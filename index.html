// Dragging a blue pin onto another lane anchor swaps the two slots wholesale
// (player AND champ travel together) and the role board below follows.
// Pointer events, not HTML5 drag — that API never fires on iPad touches.
function wireRiftDrag(m) {
  const anchors = ROLES.map(r => ({ r, x: RIFT_POS.ours[r][0], y: RIFT_POS.ours[r][1] }));
  m.querySelectorAll("[data-drag-slot]").forEach(pin => {
    pin.addEventListener("pointerdown", e => {
      const src = +pin.dataset.dragSlot;
      if (e.button || (!slots[src].player && !slots[src].champ)) return;
      e.preventDefault();
      // capture keeps a fast touch-drag glued to the pin; the listeners live
      // on window regardless, so a failed capture only costs smoothness
      try { pin.setPointerCapture(e.pointerId); } catch { /* ignore */ }
      pin.classList.add("dragging");
      const rect = m.getBoundingClientRect();
      let target = null, moved = false;
      const onMove = ev => {
        if (ev.pointerId !== e.pointerId) return;
        const x = (ev.clientX - rect.left) / rect.width * 100;
        const y = (ev.clientY - rect.top) / rect.height * 100;
        moved = true;
        pin.style.left = x + "%";
        pin.style.top = y + "%";
        let best = null, bd = Infinity;
        for (const a of anchors) {
          const d = Math.hypot(a.x - x, a.y - y);
          if (d < bd) { bd = d; best = a; }
        }
        target = bd <= 20 ? ROLES.indexOf(best.r) : null;
        m.querySelectorAll(".drop-target").forEach(t => t.classList.remove("drop-target"));
        if (target != null && target !== src) {
          const t = m.querySelector(`[data-drag-slot="${target}"]`);
          if (t) t.classList.add("drop-target");
        }
      };
      const unbind = () => {
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        window.removeEventListener("pointercancel", onCancel);
      };
      // a cancelled gesture (OS grabbed the touch mid-drag) must never
      // commit — only an explicit release over an anchor swaps roles
      const onCancel = ev => {
        if (ev.pointerId !== e.pointerId) return;
        unbind();
        renderRift();  // snap back
      };
      const onUp = ev => {
        if (ev.pointerId !== e.pointerId) return;
        unbind();
        if (moved && target != null && target !== src) {
          [slots[src], slots[target]] = [slots[target], slots[src]];
          autoSwapNote = null;  // the user is steering again
          rankedTabs.assigned = null;  // role assignment changed — stale
          if (activeTab === "assigned") switchTab("assigned");
          renderSlots(); renderScore();
        } else {
          renderRift();  // snap back
        }
      };
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      window.addEventListener("pointercancel", onCancel);
    });
  });
}

// The old enemy chip's controls, relocated onto the pin: lane lock (with the
// same "auto" distribution label) and removal for manually entered picks.
function openRiftPop(cid, pinEl) {
  const m = $("#riftMap");
  if (!m) return;
  const old = m.querySelector(".rift-pop");
  if (old) old.remove();
  // effective distribution (after other picks' lane claims) unless the
  // user locked a lane — then the raw guess labels the "auto" option
  const guess = Object.entries(enemyRole.get(cid) ? laneDist(cid, true) : laneDist(cid))
    .sort((a, b) => b[1] - a[1]);
  const auto = guess.length
    ? `auto — ${guess.slice(0, 2).map(([r, w]) => `${ROLE_LABEL[r]} ${Math.round(w * 100)}%`).join(" / ")}`
    : "lane?";
  const live = liveEnemy.has(cid);
  const pop = document.createElement("div");
  pop.className = "rift-pop";
  // anchor at the pin, open toward the map's center so it never clips
  const x = parseFloat(pinEl.style.left), y = parseFloat(pinEl.style.top);
  pop.style.left = x + "%";
  pop.style.top = y + "%";
  pop.style.transform = `translate(${x > 50 ? "calc(-100% + 17px)" : "-17px"}, ${y > 50 ? "calc(-100% - 26px)" : "26px"})`;
  pop.innerHTML = `
    <b>${champName(cid)}${live ? ` <span class="rlive">live</span>` : ""}</b>
    <select data-erole aria-label="${champName(cid)} lane" title="their lane — a flexible pick splits its matchup weight across likely lanes until you lock one">
      <option value="">${auto}</option>
      ${ROLES.map(r => `<option value="${r}" ${enemyRole.get(cid) === r ? "selected" : ""}>${ROLE_LABEL[r]}</option>`).join("")}
    </select>
    ${manualEnemy.has(cid) && !live ? `<button type="button" class="btn toggle" data-pop-remove>Remove pick</button>` : ""}`;
  m.appendChild(pop);
  pop.querySelector("[data-erole]").addEventListener("change", e => {
    enemyRole.set(cid, e.target.value || null);
    ensureEnemyCounters(cid);
    draftChanged();
  });
  const rm = pop.querySelector("[data-pop-remove]");
  if (rm) rm.addEventListener("click", () => {
    manualEnemy.delete(cid);
    draftChanged();
  });
  const close = ev => {
    if (!pop.contains(ev.target)) { pop.remove(); document.removeEventListener("click", close); }
  };
  setTimeout(() => document.addEventListener("click", close), 0);
}

// A slotted champ just got banned or enemy-picked: swap in the best still-
// available candidate for that player+role instead of leaving a dead board.
// Judged by full comp score when the board is complete (synergy counts), by
// slot score otherwise. Returns swap descriptions, or null if nothing died.
function autoReplaceDead() {
  if (!draftMode) return null;
  const swaps = [];
  for (let i = 0; i < 5; i++) {
    const s = slots[i];
    if (!s.player || !s.champ) continue;
    if (!draftUnavailable(s.champ) && !counterAvoid.has(s.champ)) continue;
    const used = new Set(slots.map(x => x.champ));
    const cands = candidates(s.player, ROLES[i], 15).filter(c => !used.has(c));
    if (!cands.length) continue;
    const full = slots.every((x, j) => x.player && (j === i || x.champ));
    let best = cands[0];
    if (full) {
      let bestT = -Infinity;
      for (const c of cands) {
        const trial = slots.map((x, j) => ({ player: x.player, champ: j === i ? c : x.champ, role: ROLES[j] }));
        const t = compScore(trial).total;
        if (t > bestT) { bestT = t; best = c; }
      }
    }
    swaps.push(`${champName(s.champ)} → ${champName(best)}`);
    slots[i].champ = best;
  }
  return swaps.length ? swaps : null;
}

// While a draft is underway, every ban and pick re-runs the full role-
// agnostic optimizer over the checked squad — champs our team has locked in
// the client are pinned to their role, everything else stays fluid. Returns
// false when it can't run (no live draft, pool too small) so the cheaper
// keep-roles dead-pick swap can take over.
function autoOptimize(deadNames) {
  if (!draftMode) return false;
  if (!liveDraft.active && !effBans().size && !effEnemy().size) return false;
  if (D.players.filter(p => included[p.riotId]).length < 5) return false;
  const fixed = {};
  for (const p of liveOurs) if (p.championId && ROLES.includes(p.position)) fixed[p.position] = p.championId;
  // Roles locked: search champions only, players stay in their lanes. An
  // incomplete board falls through to autoReplaceDead, which is also
  // role-preserving.
  const res = rolesLocked() ? (optimizeChamps(10, fixed) || []) : optimize(10, fixed);
  if (!res.length) return false;
  const before = slots.map(s => s.player + "|" + s.champ).join();
  const hadChamps = slots.some(s => s.champ);
  res[0].assign.forEach((a, i) => { slots[i] = { player: a.player, champ: a.champ }; });
  // locked results are champs-for-these-roles — they belong in that tab, not
  // under "Best overall", which promises a role-agnostic search
  rankedTabs[rolesLocked() ? "assigned" : "overall"] = res;
  if (hadChamps && slots.map(s => s.player + "|" + s.champ).join() !== before)
    autoSwapNote = (deadNames.length
      ? `re-optimized — ${deadNames.join(", ")} no longer available`
      : "re-optimized for the draft") + (lockRoles ? " (roles locked)" : "");
  return true;
}

// Draft state changed: matchup + candidate caches are stale; re-rank any
// results the user is currently looking at.
function draftChanged(rerenderCard = true) {
  dAdjCache = {};
  candCache = {};
  const dead = slots.flatMap(s => {
    if (!s.champ) return [];
    if (draftUnavailable(s.champ)) return [champName(s.champ)];
    if (counterAvoid.has(s.champ)) return [champName(s.champ) + " (hard-countered)"];
    return [];
  });
  const had = { assigned: !!rankedTabs.assigned, overall: !!rankedTabs.overall };
  rankedTabs.assigned = rankedTabs.overall = null;
  if (autoOptimize(dead)) {
    // fresh results are worth showing — in whichever tab they landed
    if (rolesLocked()) { had.assigned = true; activeTab = "assigned"; }
    else had.overall = true;
  } else {
    const swaps = autoReplaceDead();
    if (swaps) autoSwapNote = `auto-swapped ${swaps.join(", ")} — pick was banned, taken, or hard-countered`;
  }
  if (rerenderCard) renderDraft();
  renderSlots();
  renderScore();
  if (had[activeTab]) switchTab(activeTab);
}

function applyLiveDraft(j) {
  if (!j || !j.ts || j.ts === liveDraft.ts) { updateLiveIndicator(); return; }
  liveDraft = j;
  liveBans = new Set(j.active ? j.bans || [] : []);
  liveEnemy = new Set(j.active ? j.enemy || [] : []);
  liveOurs = j.active ? j.ours || [] : [];
  if (!j.active) { counterAvoid.clear(); counterDismissed.clear(); }  // per-draft decisions
  for (const cid of liveEnemy) ensureEnemyCounters(cid);
  // Reflect our own locked picks on the board: fill the matching role's champ,
  // but never clobber a champ the user chose themselves — only empty slots and
  // slots this sync wrote earlier follow the client.
  if (j.active) for (const p of liveOurs) {
    const i = ROLES.indexOf(p.position);
    if (i < 0 || !p.championId) continue;
    const cur = slots[i].champ;
    if (cur == null || cur === liveOursByRole[p.position] || cur === p.championId) {
      slots[i].champ = p.championId;
      liveOursByRole[p.position] = p.championId;
    }
  }
  draftChanged();
}

// Primary transport: a WebSocket to the DraftHub Durable Object — it sends
// the current state on connect and pushes every bridge update instantly.
// While the socket is down we fall back to polling so drafts stay usable.
let draftWS = null, draftWSTimer = null, draftBackoff = 1000;
let draftPingTimer = null, draftPollTimer = null;

async function pollDraft() {
  try { applyLiveDraft(await fetch(WORKER_URL + "/draft").then(r => r.json())); }
  catch { /* worker hiccup — the indicator just goes stale */ }
}

function connectDraftWS() {
  const ws = new WebSocket(WORKER_URL.replace(/^http/, "ws") + "/draft/ws");
  draftWS = ws;
  ws.onopen = () => {
    if (draftWS !== ws) return;
    draftBackoff = 1000;
    clearInterval(draftPollTimer); draftPollTimer = null;
    clearInterval(draftPingTimer);
    draftPingTimer = setInterval(() => ws.send("ping"), 30000);
    updateLiveIndicator();
  };
  ws.onmessage = e => {
    if (e.data === "pong") return;
    try { applyLiveDraft(JSON.parse(e.data)); } catch {}
  };
  ws.onclose = ws.onerror = () => {
    if (draftWS !== ws) return;  // superseded by a newer socket
    draftWS = null;
    clearInterval(draftPingTimer);
    updateLiveIndicator();
    if (!draftMode) return;
    if (!draftPollTimer) { pollDraft(); draftPollTimer = setInterval(pollDraft, 3000); }
    clearTimeout(draftWSTimer);
    draftWSTimer = setTimeout(connectDraftWS, draftBackoff);
    draftBackoff = Math.min(draftBackoff * 2, 15000);
  };
}

function setDraftLive(on) {
  clearTimeout(draftWSTimer);
  clearInterval(draftPollTimer); draftPollTimer = null;
  clearInterval(draftPingTimer);
  if (draftWS) { const ws = draftWS; draftWS = null; ws.close(); }
  if (on && liveMode) connectDraftWS();
}

// Slotting a player is an implicit opt-in: re-check them in the squad list
// and refresh anything that depends on the player pool.
function ensureIncluded(rids) {
  let changed = false;
  for (const rid of rids) {
    if (!rid || included[rid]) continue;
    included[rid] = true;
    changed = true;
    const cb = document.querySelector(`[data-player="${CSS.escape(rid)}"]`);
    if (cb) cb.checked = true;
  }
  if (changed) {
    rankedTabs.overall = null;  // player pool changed — stale
    if (activeTab === "overall") switchTab("overall");
  }
}

// Squad-list warnings: thin game samples, and champs cut by the mastery floor.
function playerNotes(p) {
  const notes = [];
  const deep = p.champions.filter(c => c.games >= MIN_CHAMP_GAMES).length;
  if (deep === 0) notes.push(`no champs with ${MIN_CHAMP_GAMES}+ games`);
  else if (deep < 5) notes.push(`only ${deep} champ${deep > 1 ? "s" : ""} with ${MIN_CHAMP_GAMES}+ games`);
  if (masteryMin || masteryMax < MASTERY_OFF) {
    const m = Object.values(masteryIdx[p.riotId] || {}).filter(inMasteryRange).length;
    if (m === 0) notes.push(`no champs in mastery range`);
    else if (m < 5) notes.push(`only ${m} champ${m > 1 ? "s" : ""} in mastery range`);
  }
  if (minGames || maxGames < MAX_GAMES_OFF) {
    const n = p.champions.filter(c => inGamesRange(c.games)).length;
    if (n === 0) notes.push(`no champs in games range`);
    else if (n < 5) notes.push(`only ${n} champ${n > 1 ? "s" : ""} in games range`);
  }
  // rendered inline on the tag line (fixed row height — see .lowdata note)
  return notes.length ? ` · <span class="lowdata" title="${notes.join("; ")}">${notes.join(" · ")}</span>` : "";
}

function updateSquadNotes() {
  document.querySelectorAll("[data-notes]").forEach(el => {
    const p = D.players.find(x => x.riotId === el.dataset.notes);
    if (p) el.innerHTML = playerNotes(p);
  });
}

function emptyIcon() {
  return `<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2l9.5 6.9-3.6 11.2h-11.8L2.5 8.9z"/><circle cx="12" cy="12.4" r="3.2"/></svg>`;
}

function renderSlots() {
  $("#slots").innerHTML = ROLES.map((role, i) => {
    const s = slots[i];
    const playerOpts = D.players.map(p =>
      `<option value="${p.riotId}" ${s.player === p.riotId ? "selected" : ""}>${p.riotId.split("#")[0]}</option>`).join("");
    let champOpts = "", stat = "";
    let comfortLine = "";
    if (s.player) {
      const share = playerRoleShare(s.player, role);
      comfortLine = `<div class="cstat dim" style="margin-bottom:6px">plays ${ROLE_LABEL[role].toLowerCase()} ${pct(share)} of games</div>`;
      const p = D.players.find(p => p.riotId === s.player);
      // copy — candidates() returns its cached array, and the unshift below
      // must not leak the hand-picked champ into the cache
      const cands = [...candidates(s.player, role, 15)];
      if (!cands.length && !s.champ)
        comfortLine += `<div class="cstat dim" style="margin-bottom:6px">no champs meet the mastery/games filters</div>`;
      if (s.champ && !cands.includes(s.champ)) cands.unshift(s.champ);
      const opt = cid => `<option value="${cid}" ${s.champ === cid ? "selected" : ""}>${champName(cid)}</option>`;
      const playedThere = cands.filter(cid => {
        const e = p.champions.find(c => c.championId === cid);
        return e && (e.roles[role] || { games: 0 }).games >= 2;
      });
      const metaOnly = cands.filter(cid => !playedThere.includes(cid))
        .slice(0, Math.max(0, 6 - Math.min(playedThere.length, 4)));  // keep the list short
      if (s.champ && !playedThere.includes(s.champ) && !metaOnly.includes(s.champ))
        metaOnly.unshift(s.champ);  // never drop the currently selected champion
      // Everything else the player could reasonably lock: any champ of theirs
      // that passes the mastery/games/draft filters but didn't make the
      // auto-candidate list (off-meta for the lane, or below the score cut).
      const shown = new Set([...playedThere, ...metaOnly]);
      const poolAll = new Map();
      for (const c of p.champions) poolAll.set(c.championId, c);
      for (const m of p.mastery) if (!poolAll.has(m.championId)) poolAll.set(m.championId, null);
      const byScore = (a, b) => slotScore(s.player, b, role) - slotScore(s.player, a, role);
      const extras = [...poolAll.keys()].filter(cid =>
        !shown.has(cid)
        && !draftUnavailable(cid)
        && inMasteryRange((masteryIdx[s.player] || {})[cid] || 0)
        && inGamesRange((poolAll.get(cid) || {}).games || 0));
      // champs cut from the candidate list by its display cap are still
      // meta-viable — group them honestly instead of calling them off-meta
      const cutViable = extras.filter(cid => roleViable(poolAll.get(cid), cid, role)).sort(byScore);
      const offMeta = extras.filter(cid => !roleViable(poolAll.get(cid), cid, role)).sort(byScore);
      champOpts =
        (playedThere.length ? `<optgroup label="Plays this role">${playedThere.map(opt).join("")}</optgroup>` : "") +
        (metaOnly.length + cutViable.length ? `<optgroup label="Meta-viable here">${[...metaOnly, ...cutViable].map(opt).join("")}</optgroup>` : "") +
        (offMeta.length ? `<optgroup label="Off-meta / everything else">${offMeta.map(opt).join("")}</optgroup>` : "");
      if (s.champ) {
        const p = D.players.find(p => p.riotId === s.player);
        const e = p.champions.find(c => c.championId === s.champ);
        // In Role WR mode the score only sees the in-role record, so that
        // becomes the headline number and the all-roles record dims beneath
        // it — otherwise a 52.8% Ekko card can hide the 33% jungle record
        // the score actually used.
        const allRec = e ? `${e.wins}W ${e.games - e.wins}L (${pct(e.wins / e.games)})` : null;
        if (!e) stat = `<span class="dim">no ranked games</span>`;
        else if (strictRole) {
          const rr = e.roles[role] || { games: 0, wins: 0 };
          stat = (rr.games
            ? `${ROLE_LABEL[role].toLowerCase()} ${rr.wins}W ${rr.games - rr.wins}L (${pct(rr.wins / rr.games)})`
            : `<span class="dim">no ${ROLE_LABEL[role].toLowerCase()} games — scored from meta prior + off-role record</span>`)
            + `<br><span class="dim">all roles ${allRec}</span>`;
        } else stat = allRec;
        if (META) stat += `<br><span class="dim">meta ${pct(metaWR(s.champ, role))}</span>`;
        const pts = (masteryIdx[s.player] || {})[s.champ];
        stat += `<br><span class="dim">mastery ${pts ? (pts >= 100000 ? (pts / 1000).toFixed(0) + "k" : pts.toLocaleString()) : "—"}</span>`;
        if (s.player === CS_MIN_PLAYER && e && e.secs)
          stat += `<br><span class="dim">cs/min ${(e.cs / (e.secs / 60)).toFixed(1)}</span>`;
        if (draftUnavailable(s.champ))
          stat += `<br><span class="banned-note">${effBans().has(s.champ) ? "banned!" : "enemy took it!"}</span>`;
        else {
          const hc = hardCounters(s.champ, role);
          if (hc.length)
            stat += `<br><span class="banned-note">hard-countered by ${hc.map(champName).join(", ")}!</span>`;
        }
        // surface the matchups the score silently includes — the meta win rate
        // of this champ against each enemy pick that might lane here, with the
        // lane odds shown when the enemy pick is flexible
        if (draftMode) {
          for (const ecid of effEnemy()) {
            const w = laneDist(ecid)[role] || 0;
            if (!w) continue;
            // our own champ's counter table backs rare matchups the enemy's
            // table omits — fetch it too (cached; re-renders when it lands)
            ensureCounters(s.champ, role);
            // "vs Shen (top 70%): 50.0% wr" — the odds belong to the lane
            // guess, not the win rate, so keep them attached to the name
            const who = w < 1
              ? `${champName(ecid)} <span class="dim">(${ROLE_LABEL[role].toLowerCase()} ${Math.round(w * 100)}%)</span>`
              : champName(ecid);
            const rec = matchupRec(ecid, s.champ, role);
            if (rec && rec.play >= 20) {
              const wr = 1 - rec.win / rec.play;
              const cls = wr > 0.505 ? "pos" : wr < 0.495 ? "neg" : "dim";
              stat += `<br><span class="dim">vs</span> ${who}<span class="dim">:</span> <span class="${cls}" title="meta lane matchup, ${rec.play} games">${pct(wr)} wr</span>`;
            } else {
              stat += `<br><span class="dim">vs</span> ${who}<span class="dim">: no data</span>`;
            }
          }
        }
        stat += `<br><span class="scorechip">score ${pct(slotScore(s.player, s.champ, role))}</span>`;
      }
    }
    return `<div class="slot ${s.champ ? "filled" : ""}">
      <h3>${ROLE_ICON[role]}${ROLE_LABEL[role]}</h3>
      <select data-slot="${i}" data-kind="player" aria-label="${ROLE_LABEL[role]} player"><option value="">— player —</option>${playerOpts}</select>
      ${comfortLine}
      <select data-slot="${i}" data-kind="champ" aria-label="${ROLE_LABEL[role]} champion" ${s.player ? "" : "disabled"}><option value="">— champion —</option>${champOpts}</select>
      ${s.champ
        ? `<div class="portrait-wrap"><img class="portrait" src="${champIcon(s.champ)}" alt="${champName(s.champ)}" title="${champName(s.champ)}"></div>`
        : `<div class="portrait-empty">?</div>`}
      <div class="cstat">${stat}</div>
    </div>`;
  }).join("");
  document.querySelectorAll("#slots select").forEach(sel => sel.addEventListener("change", e => {
    autoSwapNote = null;  // the user is steering again
    const i = +e.target.dataset.slot;
    if (e.target.dataset.kind === "player") {
      slots[i].player = e.target.value || null;
      slots[i].champ = null;
      ensureIncluded([slots[i].player]);
    }
    else slots[i].champ = e.target.value ? +e.target.value : null;
    rankedTabs.assigned = null;  // role assignment changed — stale
    if (activeTab === "assigned") switchTab("assigned");
    renderSlots(); renderScore();
  }));
  // the map mirrors the board — slot edits reach here without renderDraft
  renderRift();
}

function renderScore() {
  renderProfile();
  const assign = slots.map((s, i) => ({ player: s.player, champ: s.champ, role: ROLES[i] }));
  const ready = assign.every(a => a.player && a.champ)
    && new Set(assign.map(a => a.player)).size === 5
    && new Set(assign.map(a => a.champ)).size === 5;
  const verdictEl = $("#verdict");
  if (!ready) {
    $("#hero").textContent = "–"; $("#meter").style.width = "0%";
    verdictEl.hidden = true;
    $("#breakdown").textContent = "Fill all five slots (distinct players and champions).";
    return;
  }
  const sc = compScore(assign);
  $("#hero").textContent = pct(sc.total);
  $("#meter").style.width = (sc.total * 100) + "%";
  // A banned or enemy-taken champ makes the whole estimate fiction — say so
  // where the user is actually looking instead of only in one slot's fine print.
  const dead = assign.filter(a => draftUnavailable(a.champ));
  const v = dead.length
    ? { label: dead.map(a => champName(a.champ)).join(", ")
        + (effBans().has(dead[0].champ) ? " banned" : " taken") + " — re-optimize", cls: "bad" }
    : verdict(sc.total);
  verdictEl.hidden = false;
  verdictEl.textContent = v.label;
  verdictEl.className = "verdict" + (v.cls ? " " + v.cls : "");
  const synCls = sc.syn >= 0 ? "pos" : "neg";
  // Hard-counter prompts: flag the matchup and let the player decide — never
  // swap their pick out from under them over a counter alone.
  const flagged = assign.flatMap(a => {
    if (counterAvoid.has(a.champ)) return [];
    const hc = hardCounters(a.champ, a.role);
    const key = a.champ + "|" + hc.join(",");
    if (!hc.length || counterDismissed.has(key)) return [];
    return [{ cid: a.champ, key, names: hc.map(champName).join(", ") }];
  });
  $("#breakdown").innerHTML =
    flagged.map(f => `<div class="counter-flag">
      <span class="banned-note">${champName(f.cid)} is hard-countered by ${f.names}</span>
      <button class="btn toggle" data-cswap="${f.cid}">Swap it</button>
      <button class="btn toggle" data-ckeep="${f.key}">Keep</button>
    </div>`).join("") +
    (autoSwapNote
      ? `<b style="color:var(--warning)">${autoSwapNote}</b><br>`
      : "") +
    `Individual baseline: <b>${pct(sc.ind)}</b><span class="info" tabindex="0">i<span class="tip">` +
    `Average of the five slot scores: each player's win rate on their champion in that role ` +
    `(shrunk toward the champ's current-patch meta WR), plus mastery bonus and role comfort, ` +
    `minus off-role penalties. "How good are these five picks in isolation?"</span></span><br>` +
    `Synergy adjustment: <b class="${synCls}">${sc.syn >= 0 ? "▲ +" : "▼ "}${(sc.syn * 100).toFixed(1)}pp</b>` +
    `<span class="info" tabindex="0">i<span class="tip">` +
    `Sum over every champ pair and player duo of how your actual shared-game record deviates ` +
    `from expectation (champ pairs vs their average meta WR, duos vs 50%), shrunk when samples ` +
    `are small. Duo records are role-weighted: games where the pair played these exact roles ` +
    `count fully, their games in other role combos count at ${OFF_ROLE_GAME_WEIGHT}x ` +
    `(0 under "Role WRs only"). The duo sum is also scaled to ${PAIR_OVERLAP_DISCOUNT}x, because the ten ` +
    `pair records in a five-stack largely re-count the same games. ` +
    `Champ pairs are pilot-attributed: only games where these two players played ` +
    `these two champions themselves count. Green: this group overperforms together. Red: you ` +
    `win less together than your individual stats predict. Caveat: pair and individual records ` +
    `come from the same games, so hot streaks inflate both.</span></span>`;
  document.querySelectorAll("[data-cswap]").forEach(b => b.addEventListener("click", () => {
    counterAvoid.add(+b.dataset.cswap);
    candCache = {};
    draftChanged(false);
  }));
  document.querySelectorAll("[data-ckeep]").forEach(b => b.addEventListener("click", () => {
    counterDismissed.add(b.dataset.ckeep);
    renderScore();
  }));
}

// Advisory read on the comp's shape — damage mix, frontline, crowd control —
// from per-champion combat profiles (data/profiles.json). Deliberately NOT
// part of the win-rate estimate: it flags structural risks, it doesn't score.
function renderProfile() {
  const el = $("#profile");
  if (!el || !PROFILES) return;
  const cids = slots.filter(s => s.champ).map(s => s.champ);
  el.innerHTML = cids.length < 5
    ? `<div class="hint">Pick all five champions to see damage mix, frontline, and CC.</div>`
    : profileHTML(cids);
}

// Damage mix / frontline / CC markup for any set of champions — the team
// profile card and the draft card's enemy readout share this.
function profileHTML(cids) {
  const champs = cids.map(c => PROFILES && PROFILES.champions[c]).filter(Boolean);
  if (!champs.length) return "";
  const share = k => champs.reduce((a, c) => a + c[k], 0) / champs.length;
  const phys = share("physShare"), magic = share("magicShare"), tru = Math.max(0, 1 - phys - magic);
  const dmgStatus = phys >= 0.7 ? { label: "Heavy AD", cls: "warn", tip: "easy to counter with armor" }
    : magic >= 0.7 ? { label: "Heavy AP", cls: "warn", tip: "easy to counter with magic resist" }
    : { label: "Mixed", cls: "good", tip: "" };

  const tanks = champs.filter(c => c.tankPct >= 0.75).length;
  const maxTank = Math.max(...champs.map(c => c.tankPct));
  const front = tanks >= 2 ? { label: "Heavy", cls: "good", w: 100 }
    : tanks === 1 ? { label: "Solid", cls: "good", w: 70 }
    : maxTank >= 0.6 ? { label: "Thin", cls: "warn", w: 40 }
    : { label: "None", cls: "bad", w: 15 };

  const ccAvg = champs.reduce((a, c) => a + c.ccPct, 0) / champs.length;
  const cc = ccAvg >= 0.6 ? { label: "High", cls: "good" }
    : ccAvg >= 0.35 ? { label: "Medium", cls: "" }
    : { label: "Low", cls: "warn" };

  const pctLbl = x => Math.round(x * 100) + "%";
  return `
    <div style="display:flex; align-items:center; gap:10px">
      <span class="plabel" style="flex:none; width:74px; font-size:12px; color:var(--text-secondary); font-weight:500">Damage</span>
      <span style="flex:1"></span>
      <span class="pstatus ${dmgStatus.cls}" ${dmgStatus.tip ? `title="${dmgStatus.tip}"` : ""}>${dmgStatus.label}</span>
    </div>
    <div class="stackbar">
      <div class="sPhys" style="width:${phys * 100}%"></div>
      <div class="sMagic" style="width:${magic * 100}%"></div>
      <div class="sTrue" style="width:${tru * 100}%"></div>
    </div>
    <div class="dmglegend">
      <span><span class="dot sPhys" style="background:#e08b3d"></span>Physical ${pctLbl(phys)}</span>
      <span><span class="dot" style="background:#6aa8e8"></span>Magic ${pctLbl(magic)}</span>
      <span><span class="dot" style="background:#cfd8e3"></span>True ${pctLbl(tru)}</span>
    </div>
    <div class="prow">
      <span class="plabel">Frontline</span>
      <span class="pmeter"><div style="width:${front.w}%"></div></span>
      <span class="pstatus ${front.cls}">${front.label}</span>
    </div>
    <div class="prow">
      <span class="plabel">CC</span>
      <span class="pmeter"><div style="width:${ccAvg * 100}%"></div></span>
      <span class="pstatus ${cc.cls}">${cc.label}</span>
    </div>`;
}

// Two result sets: champs-only for the roles set in the slots, and the full
// role-agnostic search. Tabs switch the view without touching the slots.
const rankedTabs = { assigned: null, overall: null };
let activeTab = "overall";

function switchTab(tab) {
  // A role-agnostic search contradicts a locked board, so while the lock is on
  // there is only one list — asking for "overall" gets the champs-only one.
  if (rolesLocked()) tab = "assigned";
  activeTab = tab;
  if (!rankedTabs[tab]) {
    const res = tab === "overall" ? optimize(10) : optimizeChamps(10);
    rankedTabs[tab] = res && res.length ? res : null;
  }
  renderTabs();
}

function renderTabs() {
  const locked = rolesLocked();
  // Locked leaves exactly one list, so the whole switcher goes — a lone tab
  // chip that can't be switched away from is a dead control. The heading
  // carries the meaning instead.
  $("#rankedTabs").hidden = locked;
  $("#rankedHead").textContent = locked ? "Top comps for these roles" : "Top compositions";
  $("#tabAssigned").classList.toggle("active", activeTab === "assigned");
  $("#tabOverall").classList.toggle("active", activeTab === "overall");
  const results = rankedTabs[activeTab];
  if (!results) {
    $("#ranked").innerHTML = `<div class="empty">${emptyIcon()}<br>${activeTab === "assigned"
      ? "Assign a distinct player to all five roles above."
      : "Check at least 5 players."}</div>`;
    return;
  }
  renderRanked(results);
}

function renderRanked(results) {
  $("#ranked").innerHTML = `<table>
    <tr><th></th>
    <th>Win rate<span class="info" tabindex="0">i<span class="tip">
      Estimated win rate for the whole comp: the individual baseline (average of the five slot
      scores — win rate on champ-in-role shrunk toward the current-patch meta, plus mastery and
      role comfort) plus the synergy adjustment.</span></span></th>
    <th>Comp</th>
    <th>Synergy<span class="info" tabindex="0">i<span class="tip">
      How much this group's actual shared-game record shifts the estimate: champ pairs (only
      games these two players piloted these two champs themselves) measured against their
      average meta WR, player duos against 50%, shrunk when samples are small. Duo games in
      the assigned role combo count fully; the duo's other games are discounted.
      Green = you overperform together; red = you win less together than your individual stats
      predict.</span></span></th></tr>
    ${results.map((r, i) => `
      <tr class="comp-row" data-i="${i}" style="--i:${i}" title="Click to load into the builder">
        <td><span class="rank ${i < 3 ? "r" + (i + 1) : ""}">${i + 1}</span></td>
        <td><div class="wr-cell"><b>${pct(r.total)}</b><div class="wr-bar"><div style="width:${r.total * 100}%"></div></div></div></td>
        <td class="champ-icons">${r.assign.map(a =>
          `<span class="ci" data-tip="${a.player.split("#")[0]} · ${ROLE_LABEL[a.role]}"><img src="${champIcon(a.champ)}" alt="${champName(a.champ)}"></span>`).join("")}</td>
        <td><span class="syn-chip ${r.syn >= 0 ? "pos" : "neg"}">${r.syn >= 0 ? "▲ +" : "▼ "}${(r.syn * 100).toFixed(1)}pp</span></td>
      </tr>`).join("")}
  </table>`;
  document.querySelectorAll(".comp-row").forEach(tr =>
    tr.addEventListener("click", () => applyComp(results[+tr.dataset.i])));
}

function runOptimize() {
  // both entry points to the full search are hidden while the lock is on;
  // this keeps any other path (keyboard, stale handler) honest
  if (rolesLocked()) return runOptimizeChamps();
  rankedTabs.overall = optimize(10);
  if (!rankedTabs.overall.length) rankedTabs.overall = null;
  else applyComp(rankedTabs.overall[0]);
  activeTab = "overall";
  renderTabs();
}

function runOptimizeChamps() {
  rankedTabs.assigned = optimizeChamps(10);
  if (rankedTabs.assigned) applyComp(rankedTabs.assigned[0]);
  activeTab = "assigned";
  renderTabs();
}

function applyComp(r) {
  autoSwapNote = null;  // a freshly chosen comp supersedes any auto-swap
  // Loading a comp can reassign players to new roles, which makes any cached
  // "Roles as set" results stale (champ-only clicks keep the same mapping).
  const mappingChanged = r.assign.some((a, i) => slots[i].player !== a.player);
  r.assign.forEach((a, i) => { slots[i] = { player: a.player, champ: a.champ }; });
  if (mappingChanged) rankedTabs.assigned = null;
  ensureIncluded(r.assign.map(a => a.player));
  renderSlots(); renderScore();
}

// --- boot ----------------------------------------------------------------
// Deployed Cloudflare Worker origin (e.g. "https://comp-builder-api.you.workers.dev").
// When set, data loads live from the worker and the Refresh button appears;
// when empty (or the worker is down), the committed data/*.json files serve.
const WORKER_URL = "https://comp-builder-api.robertsandbox.workers.dev";
let liveMode = false;
let RAW = null;         // last-loaded full payload {players, meta, profiles}
let flexOnly = localStorage.getItem("flexOnly") === "1";

// Flex-only view: every champ record, role record, and synergy pair rebuilt
// from the per-queue ("q") counters for flex (440) alone. Scoring code is
// untouched — it just sees a smaller dataset.
function flexView(src) {
  return {
    ...src,
    players: src.players.map(p => ({
      ...p,
      champions: p.champions.map(c => {
        const f = c.q && c.q["440"];
        return f && f.games ? { championId: c.championId, games: f.games, wins: f.wins,
          cs: f.cs || 0, secs: f.secs || 0, roles: f.roles || {} } : null;
      }).filter(Boolean).sort((a, b) => b.games - a.games),
      queues: Object.fromEntries(Object.entries(p.queues || {}).filter(([q]) => q === "440")),
    })),
    playerPairs: src.playerPairs.map(pp => {
      const f = pp.q && pp.q["440"];
      return f && f.games ? { a: pp.a, b: pp.b, games: f.games, wins: f.wins,
        roles: f.roles } : null;
    }).filter(Boolean),
    championPairs: src.championPairs.map(cp => {
      const f = cp.q && cp.q["440"];
      return f && f.games >= 2 ? { pa: cp.pa, a: cp.a, pb: cp.pb, b: cp.b,
        games: f.games, wins: f.wins } : null;
    }).filter(Boolean),
  };
}

function applyCurrent() {
  applyData(flexOnly ? flexView(RAW.players) : RAW.players, RAW.meta, RAW.profiles);
}

const refreshedAt = iso => {
  const d = new Date(iso), now = new Date();
  if (now - d < 90e3) return "just now";
  const t = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  return d.toDateString() === now.toDateString() ? t
    : d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " + t;
};

// (Re)build every index and re-render — used at boot and after each refresh.
function applyData(players, meta, profiles) {
  D = players; META = meta; PROFILES = profiles;
  masteryIdx = {}; champPairIdx = {}; playerPairIdx = {};
  indCache = {}; candCache = {}; pairBoostIdx = null;
  for (const k of Object.keys(roleShareCache)) delete roleShareCache[k];
  rankedTabs.assigned = rankedTabs.overall = null;
  // Data Dragon lists game-mode variant units (Jade_Annie, id 60001, …) that
  // share display names with real champions — name lookups always resolve to
  // the base champ (lowest id), and the datalist shows each name once.
  CHAMP_BY_NAME = {};
  for (const [id, c] of Object.entries(D.champions)) {
    const k = c.name.toLowerCase();
    if (!(k in CHAMP_BY_NAME) || +id < CHAMP_BY_NAME[k]) CHAMP_BY_NAME[k] = +id;
  }
  // ?squad=gimly,secondcoming,… preselects exactly these players (name match,
  // tag optional, case-insensitive) — handy for demos and fixed 5-stacks.
  if (!squadApplied) {
    squadApplied = true;
    const q = new URLSearchParams(location.search).get("squad");
    if (q) {
      const want = new Set(q.toLowerCase().split(",").map(s => s.trim()).filter(Boolean));
      for (const p of D.players)
        included[p.riotId] = want.has(p.riotId.toLowerCase()) || want.has(p.riotId.split("#")[0].toLowerCase());
    }
  }
  for (const p of D.players) {
    if (!(p.riotId in included)) included[p.riotId] = true;
    masteryIdx[p.riotId] = Object.fromEntries(p.mastery.map(m => [m.championId, m.points]));
  }
  for (const cp of D.championPairs)
    champPairIdx[cp.pa + "|" + cp.a + ":" + cp.pb + "|" + cp.b] = cp;
  for (const pp of D.playerPairs)
    playerPairIdx[[pp.a, pp.b].sort().join("|")] = pp;
  renderChips();
  render();
}

function renderChips() {
  const chips = [
    `patch <b>${D.ddragonVersion}</b>`,
    META ? `meta <b>${(META.matchCount / 1e6).toFixed(1)}M</b> ${META.region.toUpperCase()} games` : `no meta data`,
    liveMode ? `refreshed <b>${refreshedAt(D.generatedAt)}</b>` : `fetched ${D.generatedAt.slice(0, 10)}`,
  ];
  if (flexOnly) chips.push(`<b>flex games only</b>`);
  if (strictRole) chips.push(`<b>role WRs only</b>`);
  $("#sub").innerHTML = chips.map(c => `<span class="chip">${c}</span>`).join("");
}

async function loadLive() {
  if (!WORKER_URL) return null;
  try {
    const r = await fetch(WORKER_URL + "/data");
    const j = r.ok ? await r.json() : null;
    return j && j.players ? j : null;
  } catch { return null; }
}

async function loadStatic() {
  const get = f => fetch("data/" + f, { cache: "no-cache" }).then(r => r.ok ? r.json() : null).catch(() => null);
  const [players, meta, profiles] = await Promise.all(
    [get("players.json"), get("meta.json"), get("profiles.json")]);
  return players ? { players, meta, profiles } : null;
}

const REFRESH_LABEL = `<span class="spin">⟳</span> Refresh`;

// Ask the worker to pull the group's newest games, then re-render if anything
// landed. Runs on page load too (silent = no feedback flash unless games were
// found); the worker's 3-minute debounce makes that free.
async function doRefresh(silent = false) {
  const btn = $("#refreshBtn");
  if (btn.disabled) return;
  btn.disabled = true; btn.classList.add("busy");
  const restore = () => { btn.innerHTML = REFRESH_LABEL; btn.disabled = false; };
  const flash = msg => { btn.innerHTML = msg; setTimeout(restore, 2500); };
  try {
    // keep pulling until the worker has caught up (it merges in small batches)
    let added = 0, res;
    do {
      res = await fetch(WORKER_URL + "/refresh", { method: "POST" }).then(r => r.json());
      added += res.added || 0;
    } while (res.remaining > 0);
    if (added) {
      const fresh = await loadLive();
      if (fresh) { RAW = fresh; applyCurrent(); }
    } else if (res.lastRefresh) {
      // nothing new, but the server did just check — reflect that
      D.generatedAt = res.lastRefresh;
      renderChips();
    }
    btn.classList.remove("busy");
    if (silent && !added) return restore();
    flash(res.error ? "Refresh failed" : added ? `+${added} game${added > 1 ? "s" : ""}` : "Up to date");
  } catch {
    btn.classList.remove("busy");
    if (silent) return restore();
    flash("Refresh failed");
  }
}

function initRefreshButton() {
  const btn = $("#refreshBtn");
  btn.hidden = false;
  btn.addEventListener("click", () => doRefresh());
}

function initRoleToggle() {
  const t = $("#roleToggle");
  t.classList.toggle("active", strictRole);
  t.addEventListener("click", () => {
    strictRole = !strictRole;
    localStorage.setItem("strictRole", strictRole ? "1" : "0");
    t.classList.toggle("active", strictRole);
    const m = $("#roleToggle2");
    if (m) m.classList.toggle("active", strictRole);
    indCache = {}; candCache = {};  // scores depend on the mode
    rankedTabs.assigned = rankedTabs.overall = null;
    renderChips(); renderSlots(); renderScore();
  });
}

function initDraftToggle() {
  const t = $("#draftToggle");
  t.classList.toggle("active", draftMode);
  document.body.classList.toggle("drafting", draftMode);
  setDraftLive(draftMode);
  t.addEventListener("click", () => {
    draftMode = !draftMode;
    autoSwapNote = null;
    localStorage.setItem("draftMode", draftMode ? "1" : "0");
    t.classList.toggle("active", draftMode);
    document.body.classList.toggle("drafting", draftMode);
    setDraftLive(draftMode);
    draftChanged();
  });
}

function initThemeToggle() {
  // Unset theme follows prefers-color-scheme; the toggle pins the opposite of
  // whatever is currently showing and persists it.
  $("#themeToggle").addEventListener("click", () => {
    const sysDark = !window.matchMedia("(prefers-color-scheme: light)").matches;
    const cur = document.documentElement.dataset.theme || (sysDark ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    localStorage.setItem("theme", next);
  });
}

function initFlexToggle() {
  const t = $("#flexToggle");
  // needs per-queue counters in the data — hide against a pre-split dataset
  if (!RAW.players.players.some(p => p.champions.some(c => c.q))) return;
  t.hidden = false;
  t.classList.toggle("active", flexOnly);
  t.addEventListener("click", () => {
    flexOnly = !flexOnly;
    localStorage.setItem("flexOnly", flexOnly ? "1" : "0");
    t.classList.toggle("active", flexOnly);
    applyCurrent();
  });
}

(async () => {
  const live = await loadLive();
  liveMode = !!live;
  const data = live || await loadStatic();
  if (!data) {
    $("#sub").innerHTML = "";
    $("#app").innerHTML = `<div class="card empty">
      <p><b style="color:var(--text-primary)">No data yet.</b></p>
      <p>1. Copy <code>config.example.json</code> → <code>config.json</code> and fill in your Riot API key + the 6 Riot IDs.</p>
      <p>2. Run <code>python3 fetch_data.py</code></p>
      <p>3. Reload this page.</p>
    </div>`;
    return;
  }
  RAW = data;
  applyCurrent();
  initThemeToggle();
  initFlexToggle();
  initRoleToggle();
  initDraftToggle();
  if (liveMode) { initRefreshButton(); doRefresh(true); }
})();
</script>
</body>
