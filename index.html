}

// --- match history (five-stacks) -------------------------------------------
// The group's shared op.gg: every game where one whole team was our five
// registered accounts, kept with both scoreboards. Like the profiles pane it
// derives from D at render time (flexView already narrows the feed to flex),
// so the flex-only toggle and refreshes need no extra invalidation.
const mhOpen = new Set();     // expanded match ids — survive re-renders
const MH_SHOW_STEP = 25;      // rows added per "show more" click
let mhShow = MH_SHOW_STEP;
const REMAKE_SECS = 300;      // sub-5-minute games are remakes: shown, not counted

// enemy names are arbitrary player-chosen strings straight from match data
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const MH_LANE = { TOP: 0, JUNGLE: 1, MIDDLE: 2, BOTTOM: 3, UTILITY: 4 };
const byLane = rows => [...rows].sort((a, b) => (MH_LANE[a.role] ?? 9) - (MH_LANE[b.role] ?? 9));

// --- impact score (shown as "Robert score") --------------------------------
// PandaSkill's recipe (arXiv:2501.10049) scaled down to a scoreboard row.
// A per-role logistic model, fit on every recorded five-stack (both teams —
// 10 rows per game), learns which end-game lines win games; a player's score
// is the percentile of their line's predicted win chance among all recorded
// lines for their ROLE, 0..100 — 74 means the line beats 74% of recorded
// games in the role. Features are contribution-shaped on purpose — kill
// participation, death/damage/gold shares within the team, KDA, damage/min,
// CS/min — NOT raw kills or gold/min, which merely re-detect the outcome
// (AUC 0.99) and collapse the score to "did you win". Winners still sit high
// (they earned the stats), but a carried loss can crack 90. MVP / worst are
// picked among OUR five; remakes are skipped and off-role UNKNOWNs use the
// all-roles fit.
const impTotals = rows => rows.reduce((t, r) => ({ k: t.k + r.k, d: t.d + r.d,
  dmg: t.dmg + (r.dmg || 0), gold: t.gold + (r.gold || 0) }), { k: 0, d: 0, dmg: 0, gold: 0 });
const impComps = (r, t, secs) => {
  const mins = Math.max(1, secs / 60);
  return [
    (r.k + r.a) / Math.max(1, t.k),     // kill participation
    r.d / Math.max(1, t.d),             // death share
    (r.dmg || 0) / Math.max(1, t.dmg),  // damage share
    (r.gold || 0) / Math.max(1, t.gold),// gold share
    (r.k + r.a) / Math.max(1, r.d),     // KDA
    (r.dmg || 0) / mins,                // damage/min
    r.cs / mins,                        // CS/min
  ];
};
const IMP_MIN_ROWS = 100;  // below this the fit is noise — no scores at all
const IMP_ROLE_MIN = 40;   // thinner roles fall back to the all-roles fit

// standardized logistic regression by batch gradient descent — deterministic;
// 800 iterations is converged for these sizes (checked against 2000)
function logitFit(X, y) {
  const n = X.length, m = X[0].length;
  const mean = new Array(m).fill(0), sd = new Array(m).fill(0);
  for (const x of X) for (let j = 0; j < m; j++) mean[j] += x[j] / n;
  for (const x of X) for (let j = 0; j < m; j++) sd[j] += (x[j] - mean[j]) ** 2 / n;
  for (let j = 0; j < m; j++) sd[j] = Math.sqrt(sd[j]) || 1;
  const Z = X.map(x => x.map((v, j) => (v - mean[j]) / sd[j]));
  const w = new Array(m + 1).fill(0);
  for (let t = 0; t < 800; t++) {
    const g = new Array(m + 1).fill(0);
    for (let i = 0; i < n; i++) {
      let z = w[m];
      for (let j = 0; j < m; j++) z += w[j] * Z[i][j];
      const e = 1 / (1 + Math.exp(-z)) - y[i];
      for (let j = 0; j < m; j++) g[j] += e * Z[i][j];
      g[m] += e;
    }
    for (let j = 0; j <= m; j++) w[j] -= g[j] / n;
  }
  return { predict: x => {
    let z = w[m];
    for (let j = 0; j < m; j++) z += w[j] * (x[j] - mean[j]) / sd[j];
    return 1 / (1 + Math.exp(-z));
  } };
}

let impModel = null;  // cached per feed — applyData swaps D, dropping the cache
function robertModels() {
  if (impModel && impModel.src === D.stacks) return impModel;
  const byRole = { _all: [] };
  for (const g of D.stacks || []) {
    if (g.secs < REMAKE_SECS) continue;
    for (const [team, win] of [[g.us, g.win], [g.them, 1 - g.win]]) {
      const t = impTotals(team);
      for (const r of team) {
        const row = { x: impComps(r, t, g.secs), win };
        byRole._all.push(row);
        if (r.role !== "UNKNOWN") (byRole[r.role] ??= []).push(row);
      }
    }
  }
  impModel = { src: D.stacks, fits: null };
  if (byRole._all.length >= IMP_MIN_ROWS) {
    impModel.fits = {};
    for (const [role, rows] of Object.entries(byRole)) {
      if (role !== "_all" && rows.length < IMP_ROLE_MIN) continue;
      const fit = logitFit(rows.map(r => r.x), rows.map(r => r.win));
      // percentile lookup table: every recorded line's predicted win chance
      fit.sorted = rows.map(r => fit.predict(r.x)).sort((a, b) => a - b);
      impModel.fits[role] = fit;
    }
  }
  return impModel;
}

function impactScore(r, t, secs) {
  const { fits } = robertModels();
  if (!fits) return null;
  const fit = fits[r.role] || fits._all;
  const p = fit.predict(impComps(r, t, secs));
  // midrank percentile among every recorded line for the role
  const arr = fit.sorted;
  let lo = 0, hi = arr.length;
  while (lo < hi) { const m = (lo + hi) >> 1; arr[m] < p ? lo = m + 1 : hi = m; }
  let lo2 = lo, hi2 = arr.length;
  while (lo2 < hi2) { const m = (lo2 + hi2) >> 1; arr[m] <= p ? lo2 = m + 1 : hi2 = m; }
  return Math.round(100 * ((lo + lo2) / 2) / arr.length);
}

function gameImpact(g) {
  const scores = new Map();
  for (const rows of [g.us, g.them]) {
    const t = impTotals(rows);
    for (const r of rows) {
      const s = impactScore(r, t, g.secs);
      if (s != null) scores.set(r, s);
    }
  }
  let mvp = null, worst = null;
  if (g.secs >= REMAKE_SECS && scores.size)
    for (const r of g.us) {
      if (!scores.has(r)) continue;
      if (!mvp || scores.get(r) > scores.get(mvp)) mvp = r;
      if (!worst || scores.get(r) < scores.get(worst)) worst = r;
    }
  if (mvp === worst) mvp = worst = null;  // degenerate feed (a lone row)
  return { scores, mvp, worst };
}

// --- Robert rating (OpenSkill over Robert scores) ---------------------------
// PandaSkill step two: after each five-stack, all ten seats are ranked by
// Robert score and every rating — a Gaussian (μ, σ) — moves on that finish
// alone via OpenSkill's Plackett-Luce free-for-all update (faithful port of
// openskill.js defaults). Performance moves the rating, not the W/L, so a
// carried loss still climbs. Our five persist chronologically; opponents are
// strangers and enter each game at the default rating. Reported as μ − 3σ,
// a conservative floor that rewards consistency and punishes thin samples.
const OS_MU = 25, OS_SIG = 25 / 3, OS_BETASQ = (OS_SIG / 2) ** 2, OS_EPS = 1e-4;
function plackettLuce(seats) {
  // seats: [{mu, sigma, score}] → updated [{mu, sigma}], same order.
  // Update runs in rank order (ties share a rank) so the prefix sums below
  // index correctly — this mirrors openskill.js, which sorts before rating.
  const order = seats.map((_, i) => i).sort((a, b) => seats[b].score - seats[a].score);
  const ranks = [];
  let s = 0;
  order.forEach((si, j) => {
    if (j > 0 && seats[order[j - 1]].score > seats[order[j]].score) s = j;
    ranks[j] = s;
  });
  const tr = order.map((si, j) => [seats[si].mu, seats[si].sigma ** 2, si, ranks[j]]);
  const c = Math.sqrt(tr.reduce((t, [, sq]) => t + sq + OS_BETASQ, 0));
  const sumQ = tr.map(([, , , qR]) =>
    tr.reduce((t, [iMu, , , iR]) => iR >= qR ? t + Math.exp(iMu / c) : t, 0));
  const nEq = tr.map(([, , , iR]) => tr.filter(([, , , qR]) => iR === qR).length);
  const out = new Array(seats.length);
  tr.forEach(([mu, sigmaSq, si, rank], i) => {
    const expMu = Math.exp(mu / c);
    let omega = 0, delta = 0;
    tr.forEach(([, , , qRank], q) => {
      if (qRank > rank) return;
      const quot = expMu / sumQ[q];
      omega += (i === q ? 1 - quot : -quot) / nEq[q];
      delta += quot * (1 - quot) / nEq[q];
    });
    out[si] = {
      mu: mu + (sigmaSq / c) * omega,
      sigma: Math.sqrt(sigmaSq * Math.max(1 - (Math.sqrt(sigmaSq) / c) * (sigmaSq / (c * c)) * delta, OS_EPS)),
    };
  });
  return out;
}

let impRatings = null;  // cached per feed and per role filter, like the models
function robertRatings(roles, flexQ) {
  // With a role filter (a Set of roles), a tracked player's persistent rating
  // only engages for games where they played an in-filter role; every other
  // seat still shapes the finish but joins at the default rating, like the
  // opponents do. No filter = the plain career rating. flexQ restricts the
  // replay to flex-queue games (the leaderboard is flex-only by design).
  const roleKey = roles && roles.size ? [...roles].sort().join("|") : "";
  const key = (flexQ ? "flex|" : "") + roleKey;
  if (!impRatings || impRatings.src !== D.stacks) impRatings = { src: D.stacks, byKey: {} };
  if (impRatings.byKey[key]) return { by: impRatings.byKey[key] };
  const by = impRatings.byKey[key] = {};
  for (const g of [...(D.stacks || [])].sort((a, b) => a.ts - b.ts)) {
    if (g.secs < REMAKE_SECS || (flexQ && g.q !== 440)) continue;
    const { scores } = gameImpact(g);
    if (!scores.size) break;  // dataset too thin for the score models
    const seats = [...g.us, ...g.them].filter(r => scores.has(r)).map(r => {
      const tracked = r.rid && (!roleKey || roles.has(r.role));
      return {
        rid: tracked ? r.rid : null,
        mu: (tracked && by[r.rid]) ? by[r.rid].mu : OS_MU,
        sigma: (tracked && by[r.rid]) ? by[r.rid].sigma : OS_SIG,
        score: scores.get(r),
      };
    });
    const up = plackettLuce(seats);
    seats.forEach((seat, i) => {
      if (!seat.rid) return;
      by[seat.rid] = { mu: up[i].mu, sigma: up[i].sigma,
        games: (by[seat.rid] ? by[seat.rid].games : 0) + 1 };
    });
  }
  return { by };
}

// Tiered name for our worst seat, cut where the data actually falls on the
// 0-100 percentile scale (worst-performer spread over 384 stacks: median 42,
// p25 12, p90 78 — a won game usually keeps even the worst seat above 60):
//   >60 ~30% · >40 ~21% · >20 ~15% · >7 ~16% · else ~17%
const worstLabel = s => s > 60 ? "you alright son" : s > 40 ? "malik moment"
  : s > 20 ? "holy stinker" : s > 7 ? "uninstall" : "...";

const IMPACT_INFO = `<span class="info" tabindex="0">i<span class="tip">
  The Robert score, 0–100: how much this stat line looks like a winning
  player's, compared against every game we've recorded in the same role.
  50 is a typical game, 74 beats 74% of them; winners usually land high,
  but a hard-carried loss can still crack 90. ★ marks our MVP, ▼ our worst
  seat (named by how bad it got). The FAQ tab explains the whole thing step
  by step.</span></span>`;

function mhScoreboard(g) {
  const maxDmg = Math.max(1, ...g.us.concat(g.them).map(r => r.dmg || 0));
  const mins = Math.max(1, g.secs / 60);
  const { scores, mvp, worst } = gameImpact(g);
  const line = r => `<tr>
    <td><span class="pf-champ"><img src="${champIcon(r.champ)}" alt="">${r.rid
      ? `<b>${esc(r.rid.split("#")[0])}</b>`
      : `<span class="dim">${esc(r.name || "?")}</span>`}${ROLE_ICON[r.role] || ""}</span></td>
    <td>${kdaHTML({ k: r.k, d: r.d, a: r.a, kg: 1 })}</td>
    <td><div class="wr-cell"><span>${((r.dmg || 0) / 1000).toFixed(1)}k <span class="dim">(${Math.round((r.dmg || 0) / mins)})</span></span><div class="wr-bar"><div style="width:${(r.dmg || 0) / maxDmg * 100}%"></div></div></div></td>
    <td>${((r.gold || 0) / 1000).toFixed(1)}k</td>
    <td>${r.cs} <span class="dim">(${(r.cs / mins).toFixed(1)})</span></td>
    <td>${scores.has(r) ? scores.get(r) : `<span class="dim">—</span>`}${r === mvp ? `<span class="imp-chip mvp">★ MVP</span>`
      : r === worst ? `<span class="imp-chip worst">▼ ${worstLabel(scores.get(r))}</span>` : ""}</td>
  </tr>`;
  const head = (label, won, tip = "") => `<tr><th class="mh-side ${won ? "win" : "loss"}">${label} — ${won ? "Victory" : "Defeat"}</th>
    <th>KDA</th><th title="damage to champions — total (per minute)">Damage (dmg/m)</th><th>Gold</th><th>CS</th><th>Robert score${tip}</th></tr>`;
  return `<div class="mh-detail pf-sec"><table>
    ${head("Us", g.win, IMPACT_INFO)}${byLane(g.us).map(line).join("")}
    ${head("Them", !g.win)}${byLane(g.them).map(line).join("")}
  </table></div>`;
}

function renderHistoryPane() {
  const games = D.stacks || [];
  if (!games.length) {
    $("#ranked").innerHTML = `<div class="empty">${emptyIcon()}<br>${!D.stacks
      ? "No five-stack feed in this dataset yet — it arrives with the next data refresh."
      : flexOnly ? "No five-stack flex games recorded."
        : "No games where a whole team was our five registered accounts."}</div>`;
    return;
  }
  const real = games.filter(g => g.secs >= REMAKE_SECS);
  const wins = real.reduce((a, g) => a + g.win, 0);
  const remakes = games.length - real.length;
  const sum = `<div class="mh-sum">
    <span class="chip"><b>${real.length}</b> five-stack game${real.length === 1 ? "" : "s"}${flexOnly ? " · flex only" : ""}</span>
    ${real.length ? `<span class="chip">${wins}W ${real.length - wins}L · <b>${pct(wins / real.length)}</b></span>` : ""}
    ${remakes ? `<span class="chip">${remakes} remake${remakes === 1 ? "" : "s"} not counted</span>` : ""}
  </div>`;
  const rows = games.slice(0, mhShow).map(g => {
    const remake = g.secs < REMAKE_SECS;
    const open = mhOpen.has(g.id);
    const gi = remake ? { mvp: null, worst: null } : gameImpact(g);
    const { mvp, worst } = gi;
    const icons = byLane(g.us).map(r =>
      `<span class="ci${r === mvp ? " mvp" : r === worst ? " worst" : ""}" data-tip="${esc(r.rid.split("#")[0])} · ${r.k}/${r.d}/${r.a}${r === mvp ? " · MVP of the game" : r === worst ? ` · worst seat: ${worstLabel(gi.scores.get(r))}` : ""}"><img src="${champIcon(r.champ)}" alt="${champName(r.champ)}"></span>`).join("");
    return `<div class="mh-row ${remake ? "remake" : g.win ? "win" : "loss"}${open ? " open" : ""}" data-mh="${g.id}"
        title="Click for the full scoreboard">
      <span class="res">${remake ? "—" : g.win ? "W" : "L"}</span>
      <span class="mq">${QUEUE_NAME[String(g.q)] || "Queue " + g.q}${remake ? ` <span class="dim">remake</span>` : ""}</span>
      <span class="champ-icons">${icons}</span>
      <span class="dim">${Math.round(g.secs / 60)}min</span>
      <span class="when">${timeAgo(g.ts)}</span>
      <span class="chev">▾</span>
    </div>${open ? mhScoreboard(g) : ""}`;
  }).join("");
  const more = games.length > mhShow
    ? `<button class="btn" id="mhMore" style="margin-top:6px">Show ${Math.min(MH_SHOW_STEP, games.length - mhShow)} more of ${games.length - mhShow}</button>`
    : "";
  $("#ranked").innerHTML = sum + rows + more;
  document.querySelectorAll("[data-mh]").forEach(el => el.addEventListener("click", () => {
    const id = el.dataset.mh;
    mhOpen.has(id) ? mhOpen.delete(id) : mhOpen.add(id);
    renderHistoryPane();
  }));
  const moreBtn = $("#mhMore");
  if (moreBtn) moreBtn.addEventListener("click", () => { mhShow += MH_SHOW_STEP; renderHistoryPane(); });
}

// --- leaderboard -----------------------------------------------------------
// The squad ranked by any metric. Rate-style columns (WR, KDA, DPM, CS/m)
// aggregate every tracked game; the Robert columns (KP, avg score, MVP/worst
// counts, rating) only exist where we hold both scoreboards, i.e. the
// five-stack feed. Click a header to re-rank; medals follow the sort.
let lbSort = { key: "rating", dir: 1 };  // dir 1 = best first (A→Z for names)
let lbRoles = new Set();  // role filter — empty means every role counts

function renderBoardPane() {
  const roleSel = lbRoles.size ? lbRoles : null;
  // The whole board is flex-only by design — solo-queue heroics never count
  // here. In the full view that means the champ records' "440" queue slice
  // (in the flex-only view the records already ARE that slice), and the
  // five-stack loops skip the odd clash game.
  const players = D.players.map(p => {
    const t = { games: 0, wins: 0, k: 0, d: 0, as: 0, kg: 0, cs: 0, secs: 0, dmg: 0, dsecs: 0 };
    for (const c of p.champions) {
      const src = flexOnly ? c : c.q && c.q["440"];
      if (!src || !src.games) continue;
      const parts = roleSel
        ? Object.entries(src.roles || {}).filter(([role]) => roleSel.has(role)).map(([, s]) => s)
        : [src];
      for (const s of parts) {
        t.games += s.games; t.wins += s.wins;
        t.k += s.k || 0; t.d += s.d || 0; t.as += s.a || 0; t.kg += s.kg || 0;
        t.cs += s.cs || 0; t.secs += s.secs || 0;
        t.dmg += s.dmg || 0; t.dsecs += s.dsecs || 0;
      }
    }
    return { rid: p.riotId, t };
  });
  // five-stack aggregates in one pass (score models are cached per feed) —
  // under a filter only the player's in-filter games count, MVP/worst included
  const agg = {};
  for (const g of D.stacks || []) {
    if (g.secs < REMAKE_SECS || g.q !== 440) continue;
    const gi = gameImpact(g);
    const tot = impTotals(g.us);
    for (const r of g.us) {
      if (roleSel && !roleSel.has(r.role)) continue;
      const a = agg[r.rid] ??= { imps: [], mvp: 0, worst: 0, kpS: 0, kpN: 0 };
      if (gi.scores.has(r)) a.imps.push(gi.scores.get(r));
      if (r === gi.mvp) a.mvp += 1;
      if (r === gi.worst) a.worst += 1;
      a.kpS += (r.k + r.a) / Math.max(1, tot.k);
      a.kpN += 1;
    }
  }
  const ratings = robertRatings(roleSel, true).by;

  const val = {
    player: r => r.rid.split("#")[0].toLowerCase(),
    games: r => r.t.games,
    wr: r => r.t.games ? r.t.wins / r.t.games : null,
    kda: r => r.t.kg ? (r.t.k + r.t.as) / Math.max(1, r.t.d) : null,
    dpm: r => r.t.dsecs ? r.t.dmg / (r.t.dsecs / 60) : null,
    csm: r => r.t.secs ? r.t.cs / (r.t.secs / 60) : null,
    kp: r => { const a = agg[r.rid]; return a && a.kpN ? a.kpS / a.kpN : null; },
    avg: r => { const a = agg[r.rid]; return a && a.imps.length
      ? a.imps.reduce((x, y) => x + y, 0) / a.imps.length : null; },
    mvp: r => agg[r.rid] ? agg[r.rid].mvp : null,
    worst: r => agg[r.rid] ? agg[r.rid].worst : null,
    rating: r => ratings[r.rid] ? ratings[r.rid].mu - 3 * ratings[r.rid].sigma : null,
  };
  const v = val[lbSort.key] || val.rating;
  const rows = [...players].sort((a, b) => {
    const va = v(a), vb = v(b);
    if (va == null || vb == null) return (va == null) - (vb == null);
    return typeof va === "string" ? va.localeCompare(vb) * lbSort.dir : (vb - va) * lbSort.dir;
  });

  const COLS = [
    ["player", "Player", "Click a row for the full profile"],
    ["games", "Games", "Flex games in the 12-month window"],
    ["wr", "Win rate", "Across every tracked flex game"],
    ["kda", "KDA", "(kills + assists) / deaths, summed over every tracked flex game"],
    ["dpm", "DPM", "Damage to champions per minute, every tracked flex game"],
    ["csm", "CS/m", "Creep score per minute, every tracked flex game"],
    ["kp", "KP", "Average kill participation — flex five-stacks only"],
    ["avg", "Avg Robert", "Average Robert score (0–100, 50 = typical) over flex five-stacks — see the FAQ"],
    ["mvp", "★ MVP", "Games as our five's top Robert score"],
    ["worst", "▼ Worst", "Games as our five's lowest Robert score"],
    ["rating", "Robert rating", "μ−3σ skill rating from ranking all ten seats of every flex five-stack — see the FAQ"],
  ];
  const head = COLS.map(([k, label, tip]) =>
    `<th class="sortable${lbSort.key === k ? " sorted" : ""}" data-lbsort="${k}" title="${tip}">
      ${label}${lbSort.key === k ? (lbSort.dir === 1 ? " ▼" : " ▲") : ""}</th>`).join("");
  const dash = `<span class="dim">—</span>`;
  const body = rows.map((r, i) => {
    const a = agg[r.rid], rt = ratings[r.rid];
    const wr = val.wr(r), kda = val.kda(r);
    return `<tr data-lb="${r.rid}" title="Open ${esc(r.rid.split("#")[0])}'s profile">
      <td><span class="lb-rank ${i === 0 ? "g" : i === 1 ? "s" : i === 2 ? "b" : ""}">${i + 1}</span></td>
      <td><span class="lb-player">${avatar(r.rid)}${esc(r.rid.split("#")[0])}</span></td>
      <td>${r.t.games}g</td>
      <td>${wr != null ? `<div class="wr-cell"><b>${pct(wr)}</b><div class="wr-bar"><div style="width:${wr * 100}%"></div></div></div>` : dash}</td>
      <td>${kda != null ? kda.toFixed(2) : dash}</td>
      <td>${val.dpm(r) != null ? Math.round(val.dpm(r)) : dash}</td>
      <td>${val.csm(r) != null ? val.csm(r).toFixed(1) : dash}</td>
      <td>${val.kp(r) != null ? pct(val.kp(r)) : dash}</td>
      <td>${val.avg(r) != null ? val.avg(r).toFixed(1) : dash}</td>
      <td>${a ? a.mvp : dash}</td>
      <td>${a ? a.worst : dash}</td>
      <td>${rt ? `<b>${(rt.mu - 3 * rt.sigma).toFixed(1)}</b> <span class="dim">· ${rt.games}g</span>` : dash}</td>
    </tr>`;
  }).join("");

  const roleChips = `<div class="pf-switch" style="margin-bottom:8px">
    <button type="button" class="pf-chip${lbRoles.size ? "" : " active"}" data-lbclear
      title="No filter — every game counts">All roles</button>
    ${ROLES.map(r => `<button type="button" class="pf-chip${lbRoles.has(r) ? " active" : ""}" data-lbrole="${r}"
      title="Only count games played as ${ROLE_LABEL[r]} — combine several roles by selecting more than one">${ROLE_LABEL[r]}</button>`).join("")}
  </div>`;

  $("#ranked").innerHTML = `
    ${roleChips}
    <div class="hint" style="margin-bottom:10px">Flex games only. Click a column to re-rank${roleSel ? ` — counting only games played as ${[...lbRoles].map(r => ROLE_LABEL[r]).join(" / ")}` : ""}.
      Win rate, KDA, DPM and CS/m cover every tracked flex game; KP, Robert score and rating only exist for five-stacks.
      Filter by role to compare like for like — a support's CS/m only makes sense against other support games.</div>
    <div class="pf-sec"><table>
      <tr><th></th>${head}</tr>
      ${body}
    </table></div>`;
  document.querySelectorAll("[data-lbsort]").forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.lbsort;
    lbSort = lbSort.key === k ? { key: k, dir: -lbSort.dir } : { key: k, dir: 1 };
    renderBoardPane();
  }));
  document.querySelectorAll("[data-lbrole]").forEach(b => b.addEventListener("click", () => {
    const r = b.dataset.lbrole;
    lbRoles.has(r) ? lbRoles.delete(r) : lbRoles.add(r);
    renderBoardPane();
  }));
  const clearBtn = document.querySelector("[data-lbclear]");
  if (clearBtn) clearBtn.addEventListener("click", () => { lbRoles.clear(); renderBoardPane(); });
  document.querySelectorAll("[data-lb]").forEach(tr => tr.addEventListener("click", () => {
    profilePlayer = tr.dataset.lb;
    setPage("profiles");
  }));
}

// --- FAQ -------------------------------------------------------------------
// Long-form, from-scratch explanations of the Robert score and rating — the
// hover tips give the one-breath version and point here. Written for someone
// who has never met a statistical model; live numbers come from the current
// dataset so the examples never go stale.
function renderFaqPane() {
  const real = (D.stacks || []).filter(g => g.secs >= REMAKE_SECS);
  const nGames = real.length, nLines = nGames * 10;
  const qa = (q, a) => `<details><summary>${q}</summary><div class="faq-a">${a}</div></details>`;

  // Live case study: the squad's favorite apparent paradox. Numbers are
  // recomputed from the current feed so the box never goes stale; it only
  // renders when both accounts are in the dataset (and skips gracefully in
  // someone else's copy).
  const CASE = ["SecondComing#him", "fallenbanditfan#luv"];
  let caseBox = "";
  if (CASE.every(rid => D.players.some(p => p.riotId === rid))) {
    const cs = {};
    for (const g of real.filter(g => g.q === 440)) {
      const gi = gameImpact(g);
      if (!gi.scores.size) break;
      const all = [...g.us, ...g.them].filter(r => gi.scores.has(r))
        .sort((a, b) => gi.scores.get(b) - gi.scores.get(a));
      all.forEach((r, idx) => {
        if (!r.rid || !CASE.includes(r.rid)) return;
        const a = cs[r.rid] ??= { n: 0, s: 0, fin: 0, w: 0, roles: {} };
        a.n += 1; a.s += gi.scores.get(r); a.fin += idx + 1; a.w += g.win;
        const ro = a.roles[r.role] ??= { n: 0, s: 0 };
        ro.n += 1; ro.s += gi.scores.get(r);
      });
    }
    const [sc, fbf] = CASE.map(rid => cs[rid]);
    if (sc && fbf && sc.n > 20 && fbf.n > 20) {
      const avg = a => (a.s / a.n).toFixed(1), fin = a => (a.fin / a.n).toFixed(2),
        wr = a => pct(a.w / a.n);
      const roleLine = a => Object.entries(a.roles).filter(([r]) => ROLE_LABEL[r])
        .sort((x, y) => y[1].n - x[1].n)
        .map(([r, v]) => `${ROLE_LABEL[r]} <b>${(v.s / v.n).toFixed(1)}</b> (${v.n}g)`).join(" · ");
      caseBox = qa("Why does SecondComing out-rate fallenbanditfan when fallenbanditfan's stats look better?", `
        <p>Because "looks better" usually means raw damage, and the score deliberately doesn't rate
        that — it rates <b>how good the line was for the seat it was played in</b>. Across our flex
        five-stacks SecondComing averages <b>${avg(sc)}</b> (typical finish ${fin(sc)} of 10 over
        ${sc.n} games) against fallenbanditfan's <b>${avg(fbf)}</b> (finish ${fin(fbf)} of 10 over
        ${fbf.n}), and the rating just accumulates those finishes.</p>
        <p>The per-role averages show where the gap comes from —</p>
        <p>fallenbanditfan: ${roleLine(fbf)}<br>SecondComing: ${roleLine(sc)}</p>
        <p>fallenbanditfan's mid and bot games really are excellent — but a big share of his games
        come in the jungle and support seats, where his lines rank below average <i>for those
        seats</i>, and that mix pulls the career number down. SecondComing plays most of his games
        in his best seats, and a tanky top line that looks unimpressive as raw damage can still be
        a great <i>top</i> line.</p>
        <p>Honest footnote: fallenbanditfan's five-stack win rate is actually higher
        (${wr(fbf)} vs ${wr(sc)}) — but the rating ignores W/L by design, and the seven features
        can't see vision, CC or peel, so a utility-heavy style is probably a little undervalued.</p>`);
    }
  }
  $("#ranked").innerHTML = `<div class="faq">
    <div class="hint">Everything here is computed from the squad's own games — currently
      <b>${nGames}</b> five-stack game${nGames === 1 ? "" : "s"} (${nLines.toLocaleString()} player stat lines)${flexOnly ? ", flex only" : ""}.
      The method is borrowed from PandaSkill (arXiv 2501.10049), a system built to rate pro League players, scaled down to our scoreboards.</div>

    ${qa("What is the Robert score?", `
      <p>One number, <b>0 to 100</b>, for a single game: how much your end-of-game stat line
      looks like the stat line of someone whose team won.</p>
      <p><b>50 is a perfectly typical game.</b> A 74 means your line looked more like a winner's
      than 74% of every game we have on record for your role. It appears in every match-history
      scoreboard, and each profile shows the player's average.</p>`)}

    ${qa("How is it calculated, exactly?", `
      <p><b>Step 1 — the data.</b> Every recorded five-stack keeps both full scoreboards, so each
      game contributes ten stat lines (${nLines.toLocaleString()} so far). Each line is boiled down to seven numbers:</p>
      <ul>
        <li><b>Kill participation</b> — the share of your team's kills you had a hand in</li>
        <li><b>Death share</b> — your slice of the team's deaths</li>
        <li><b>Damage share</b> and <b>gold share</b> — your slice of the team's totals</li>
        <li><b>KDA</b>, <b>damage per minute</b>, <b>CS per minute</b></li>
      </ul>
      <p>Shares instead of raw kills on purpose: they describe <i>your part in the team</i>, not how
      stomp-y the game happened to be.</p>
      <p><b>Step 2 — the model.</b> Label every line <b>1</b> if that player's team won and <b>0</b> if it
      lost, then fit a <b>logistic regression</b>: the computer searches for a weight on each of the
      seven numbers so that "multiply, add up, squash to a 0–1 probability" matches the labels as
      well as possible. Think line-of-best-fit, but for yes/no outcomes instead of a number — there
      is nothing deeper going on than "find the weights that best fit history".</p>
      <p><b>Step 3 — the score.</b> One model is fit per role, on that role's lines only. Your seven
      numbers go into your role's model and out comes a probability — but probabilities bunch up,
      so the score you see is that probability's <b>percentile</b>: the fraction of all recorded lines
      in your role that yours beats. That construction is what makes 50 average by definition.</p>`)}

    ${qa("What does “looks like a winner” mean?", `
      <p>The model never sees who won <i>your</i> game — it only sees your seven numbers. But its
      weights were learned from lines labeled by team win/loss. So a high score literally means:
      <b>"in our history, lines like this one usually belonged to players whose team won."</b></p>
      <p>It measures resemblance, not the W itself — which is exactly why a monster game in a loss
      can still score 90+.</p>`)}

    ${qa("Why do winners almost always outscore losers?", `
      <p>Because good stats and winning mostly happen together — the team that's ahead gets the
      kills, the gold, and fewer deaths. In our data the winning side averages about <b>73</b> and the
      losing side about <b>27</b>. That's not the model cheating; that's League.</p>
      <p>The interesting information is in the exceptions: a <b>90 in a loss</b> (you did your job, the
      team lost anyway) or a <b>30 in a win</b> (you got carried, and the score knows).</p>`)}

    ${qa("Why is everything judged per role?", `
      <p>A support's damage share will never look like a mid laner's, and their death share is
      structurally different. Each role gets its own model, fit only on that role's games, and the
      final percentile is taken within the role too — so a support's 80 and a jungler's 80 mean the
      same thing: top-20% for that seat.</p>`)}

    ${qa("What is the Robert rating, and how is it different from the score?", `
      <p>The score judges <b>one game</b>; the rating accumulates a <b>career</b>. It works like chess
      Elo with two twists.</p>
      <p><b>Twist one:</b> instead of a 1-v-1 win/loss, every five-stack is treated as a ten-player
      free-for-all that finishes in Robert-score order — someone comes 1st, someone comes 10th.</p>
      <p><b>Twist two:</b> the update rule is <b>OpenSkill</b> (an open-source Bayesian rating system in
      the TrueSkill family). Finish about where your rating predicted and nothing much moves;
      outperform the prediction and your rating jumps. The actual W or L never enters the
      formula — only where your performance ranked.</p>`)}

    ${qa("What are μ and σ, and why is the headline number μ − 3σ?", `
      <p>The system's belief about your skill isn't a single number, it's a bell curve.
      <b>μ (mu)</b> is its best guess; <b>σ (sigma)</b> is how unsure it still is — large when you have
      few games, shrinking as evidence piles up.</p>
      <p>The number shown is <b>μ − 3σ</b>, a deliberately conservative floor: "we're about 99.7% sure
      you're <i>at least</i> this good." A player with 30 excellent games still shows a modest floor
      because σ is big; keep posting consistent scores over many games and the floor climbs even
      when μ barely moves. It rewards proven consistency over a hot streak.</p>`)}

    ${qa("Why did my rating drop after a win (or climb after a loss)?", `
      <p>Because it rates <b>finishes, not results</b>. Win the game while posting our five's lowest
      score and you likely finished 7th–10th of ten — below what your rating expected, so it dips.
      Hard-carry a loss and you finished near the top, so it climbs. If it barely moved, you landed
      about where the system predicted.</p>`)}

    ${caseBox}

    ${qa("What do the ★ MVP star and the ▼ worst-seat labels mean?", `
      <p>In each scoreboard, <b>★ MVP</b> marks the highest Robert score among <i>our</i> five and
      <b>▼</b> the lowest. The worst seat's label is tiered by the raw score, with the cuts placed
      where our data actually falls:</p>
      <ul>
        <li>above 60 — <b>"you alright son"</b> (~30% of games: a clean win keeps everyone decent)</li>
        <li>above 40 — <b>"malik moment"</b></li>
        <li>above 20 — <b>"holy stinker"</b></li>
        <li>above 7 — <b>"uninstall"</b></li>
        <li>7 or below — <b>"..."</b> (~17% of games; condolences)</li>
      </ul>`)}

    ${qa("What data feeds all of this?", `
      <p>The squad's Riot match history from the last 12 months — only games where one whole team
      was our five registered accounts, since those are the games we hold both scoreboards for.
      Remakes (under 5 minutes) are shown but never counted.</p>
      <p>The models are re-fit <b>in your browser</b> every time the dataset refreshes or you toggle
      the flex-only view, so scores always reflect the current data — a past game's score can drift
      by a point as new games widen the comparison pool. The ratings replay every game in order,
      oldest first, each time.</p>`)}
  </div>`;
}

// Three result sets: champs-only for the roles set in the slots, the full
// role-agnostic search, and the nightmare blunt rotation (the same search
// minimized). Tabs switch the view without touching the slots.
const rankedTabs = { assigned: null, overall: null, worst: null };
let activeTab = "overall";

// "No repeats": each comp on the list puts nobody on a champ they already
// hold in a higher-ranked comp, so ten variations on one core become ten
// genuinely different plans. Filtering the normal top-10 pool can't deliver
// this (the whole pool shares its core picks), so the list is built by
// re-running the optimizer once per row with the shown player+champ pairings
// excluded. Locked picks bypass candidates(), so they rightly persist in
// every row. Cached on the results array itself — replacing a tab's results
// drops the cached view with it.
const RANKED_TOP = 10;
let uniqueComps = localStorage.getItem("uniqueComps") === "1";
let uniqueExclude = new Set();  // "riotId|championId" pairs shown higher up the unique list
function uniqueList(tab, results) {
  const { fixed, pinPlayer } = lockPins();
  const out = [results[0]];
  try {
    uniqueExclude = new Set(results[0].assign.map(a => a.player + "|" + a.champ));
    candCache = {};
    while (out.length < RANKED_TOP) {
      const res = tab === "overall" ? optimize(1, fixed, pinPlayer)
        : tab === "worst" ? optimizeWorst(1)
        : optimizeChamps(1, fixed);
      if (!res || !res.length) break;
      out.push(res[0]);
      for (const a of res[0].assign) uniqueExclude.add(a.player + "|" + a.champ);
      candCache = {};
    }
  } finally {
    uniqueExclude = new Set();  // never leak exclusions into normal scoring
    candCache = {};
  }
  return out;
}

function switchTab(tab) {
  // A role-agnostic search contradicts a locked board, so while the lock is on
  // there is only one list — asking for "overall" gets the champs-only one.
  if (rolesLocked()) tab = "assigned";
  activeTab = tab;
  if (!rankedTabs[tab]) {
    const res = tab === "overall" ? optimize(10)
      : tab === "worst" ? optimizeWorst(10)
      : optimizeChamps(10);
    rankedTabs[tab] = res && res.length ? res : null;
  }
  renderTabs();
}

// --- haunt layer -----------------------------------------------------------
// Figures drifting across the screen while nightmare mode is on: mostly pale
// specters, the occasional tall shade with red eyes. Spawned on a jittered
// timer into #hauntLayer (which also carries the extra fog sheets), each one
// removed when its drift finishes. Purely decorative: aria-hidden and
// pointer-events none, and reduced-motion collapses the drift to 1ms so the
// figures never actually appear.
const SPECTER_SVG = `<svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <path fill="currentColor" d="M32 5C19 5 11 16 11 29v26l7.5-6.5L25 56l7-6.5L39 56l6.5-7.5L53 55V29C53 16 45 5 32 5z"/>
  <circle cx="24.5" cy="27" r="3.4" fill="#06080d"/>
  <circle cx="39.5" cy="27" r="3.4" fill="#06080d"/>
  <ellipse cx="32" cy="37" rx="3" ry="4.6" fill="#06080d" opacity=".8"/>
</svg>`;
const SHADE_SVG = `<svg viewBox="0 0 40 96" fill="none" aria-hidden="true">
  <circle cx="20" cy="13" r="8.5" fill="currentColor"/>
  <path fill="currentColor" d="M20 20c-9 0-13 8-13.5 16L3 92c5.5-6 9.5-6 12.5-1 2-5 7-5 9 0 3-5 7-5 12.5 1l-3.5-56C33 28 29 20 20 20z"/>
  <circle cx="16.5" cy="12" r="1.7" fill="#ff5d5d" opacity=".85"/>
  <circle cx="23.5" cy="12" r="1.7" fill="#ff5d5d" opacity=".85"/>
</svg>`;
let hauntTimer = null;
function spawnSpecter() {
  const layer = $("#hauntLayer");
  if (!layer || document.hidden) return;
  const shade = Math.random() < 0.25;
  const ltr = Math.random() < 0.5;
  const el = document.createElement("div");
  el.className = "specter" + (shade ? " shade" : "") + (ltr ? "" : " flip");
  el.style.setProperty("--dur", ((shade ? 19 : 11) + Math.random() * 8).toFixed(1) + "s");
  el.style.setProperty("--op", (shade ? 0.5 : 0.3 + Math.random() * 0.25).toFixed(2));
  el.style.setProperty("--sc", (shade ? 1 + Math.random() * 0.5 : 0.7 + Math.random() * 0.9).toFixed(2));
  el.style.setProperty("--dx", (ltr ? "" : "-") + "130vw");
  el.style.top = 4 + Math.random() * 68 + "vh";
  el.style[ltr ? "left" : "right"] = "-14vw";
  el.innerHTML = shade ? SHADE_SVG : SPECTER_SVG;
  // the inner bob loops forever — only the drift ending removes the figure
  el.addEventListener("animationend", e => { if (e.target === el) el.remove(); });
  layer.appendChild(el);
}
function setHaunt(on) {
  const layer = $("#hauntLayer");
  if (on && !layer) {
    const l = document.createElement("div");
    l.id = "hauntLayer";
    l.setAttribute("aria-hidden", "true");
    document.body.appendChild(l);
    spawnSpecter();
    const tick = () => { hauntTimer = setTimeout(() => { spawnSpecter(); tick(); }, 3500 + Math.random() * 4500); };
    tick();
  } else if (!on && layer) {
    clearTimeout(hauntTimer);
    hauntTimer = null;
    layer.remove();
  }
}

function renderTabs() {
  const locked = rolesLocked();
  // the nightmare haunts the whole page, not just the list — see the
  // "nightmare mode" style block; the drifting figures ride the same switch
  const nightmare = !locked && activeTab === "worst";
  document.body.classList.toggle("nightmare", nightmare);
  setHaunt(nightmare);
  // Locked leaves exactly one list, so the whole switcher goes — a lone tab
  // chip that can't be switched away from is a dead control. The heading
  // carries the meaning instead.
  $("#rankedTabs").hidden = locked;
  $("#rankedHead").innerHTML = locked ? "Top comps for these roles"
    : activeTab === "worst"
      ? `<span class="ghost" aria-hidden="true">👻</span> Nightmare blunt rotation<span class="info" tabindex="0">i<span class="tip">
        The optimizer in reverse: the worst realistic comps this roster could field, judged by
        the exact same model as the top comps (win rates shrunk toward the meta, mastery, role
        comfort, synergy). Every pick is still a real draft — a champ the meta actually plays in
        that lane, or one the player has a genuine in-role sample on — so this isn't "ADC in the
        jungle", it's the champs and role swaps this group demonstrably loses with. Filters and
        bans still apply. #1 is the single worst thing you could queue up as five. Please do not.</span></span>`
      : "Top compositions";
  $("#tabAssigned").classList.toggle("active", activeTab === "assigned");
  $("#tabOverall").classList.toggle("active", activeTab === "overall");
  $("#tabWorst").classList.toggle("active", activeTab === "worst");
  const results = rankedTabs[activeTab];
  if (!results) {
    $("#ranked").innerHTML = `<div class="empty">${emptyIcon()}<br>${activeTab === "assigned"
      ? "Assign a distinct player to all five roles above."
      : "Check at least 5 players."}</div>`;
    return;
  }
  renderRanked(uniqueComps ? (results.unique ??= uniqueList(activeTab, results)) : results);
}

function renderRanked(results) {
  $("#ranked").innerHTML = `<table>
    <tr><th></th>
    <th>Win rate<span class="info" tabindex="0">i<span class="tip">
      Estimated win rate for the whole comp: the individual baseline (average of the five slot
      scores — win rate on champ-in-role shrunk toward the current-patch meta, plus mastery and
      role comfort) plus the synergy adjustment.</span></span></th>
    <th>Comp</th>
    <th>Synergy<span class="info" tabindex="0">i<span class="tip">
      How much this group's actual shared-game record shifts the estimate: champ pairs (only
      games these two players piloted these two champs themselves) measured against their
      average meta WR, player duos against 50%, shrunk when samples are small. Duo games in
      the assigned role combo count fully; the duo's other games are discounted.
      Green = you overperform together; red = you win less together than your individual stats
      predict.</span></span></th></tr>
    ${results.map((r, i) => `
      <tr class="comp-row" data-i="${i}" style="--i:${i}" title="Click to load into the builder">
        <td><span class="rank ${i === 0 && activeTab === "worst" ? "rneg" : i < 3 ? "r" + (i + 1) : ""}">${i + 1}</span></td>
        <td><div class="wr-cell"><b>${pct(r.total)}</b><div class="wr-bar"><div style="width:${r.total * 100}%"></div></div></div></td>
        <td class="champ-icons">${r.assign.map(a =>
          `<span class="ci" data-tip="${a.player.split("#")[0]} · ${ROLE_LABEL[a.role]}"><img src="${champIcon(a.champ)}" alt="${champName(a.champ)}"></span>`).join("")}</td>
        <td><span class="syn-chip ${r.syn >= 0 ? "pos" : "neg"}">${r.syn >= 0 ? "▲ +" : "▼ "}${(r.syn * 100).toFixed(1)}pp</span></td>
      </tr>`).join("")}
  </table>`;
  document.querySelectorAll(".comp-row").forEach(tr =>
    tr.addEventListener("click", () => applyComp(results[+tr.dataset.i])));
}

// Hand locks on champs that have since died (banned, taken, fearless-spent)
// survive passive re-optimization so the user's pick is never yanked out from
// under them — but an explicit Optimize click means "re-roll this board", and
// that is the moment a dead lock is released.
function releaseDeadLocks() {
  for (const [role, cid] of [...allyLock])
    if (draftUnavailable(cid)) allyLock.delete(role);
}

function runOptimize() {
  // both entry points to the full search are hidden while the lock is on;
  // this keeps any other path (keyboard, stale handler) honest
  if (rolesLocked()) return runOptimizeChamps();
  releaseDeadLocks();
  const { fixed, pinPlayer } = lockPins();
  rankedTabs.overall = optimize(10, fixed, pinPlayer);
  if (!rankedTabs.overall.length) rankedTabs.overall = null;
  else applyComp(rankedTabs.overall[0]);
  activeTab = "overall";
  renderTabs();
}

function runOptimizeChamps() {
  releaseDeadLocks();
  rankedTabs.assigned = optimizeChamps(10, lockPins().fixed);
  if (rankedTabs.assigned) applyComp(rankedTabs.assigned[0]);
  activeTab = "assigned";
  renderTabs();
}

function applyComp(r) {
  autoSwapNote = null;  // a freshly chosen comp supersedes any auto-swap
  // Loading a comp can reassign players to new roles, which makes any cached
  // "Roles as set" results stale (champ-only clicks keep the same mapping).
  const mappingChanged = r.assign.some((a, i) => slots[i].player !== a.player);
  r.assign.forEach((a, i) => { slots[i] = { player: a.player, champ: a.champ }; });
  if (mappingChanged) rankedTabs.assigned = null;
  ensureIncluded(r.assign.map(a => a.player));
  renderSlots(); renderScore();
}

// --- boot ----------------------------------------------------------------
// Deployed Cloudflare Worker origin (e.g. "https://comp-builder-api.you.workers.dev").
// When set, data loads live from the worker and the Refresh button appears;
// when empty (or the worker is down), the committed data/*.json files serve.
const WORKER_URL = "https://comp-builder-api.robertsandbox.workers.dev";
let liveMode = false;
let RAW = null;         // last-loaded full payload {players, meta, profiles}
let flexOnly = localStorage.getItem("flexOnly") === "1";

// Flex-only view: every champ record, role record, and synergy pair rebuilt
// from the per-queue ("q") counters for flex (440) alone. Scoring code is
// untouched — it just sees a smaller dataset.
function flexView(src) {
  return {
    ...src,
    players: src.players.map(p => ({
      ...p,
      champions: p.champions.map(c => {
        const f = c.q && c.q["440"];
        return f && f.games ? { championId: c.championId, games: f.games, wins: f.wins,
          cs: f.cs || 0, secs: f.secs || 0, k: f.k || 0, d: f.d || 0, a: f.a || 0,
          kg: f.kg || 0, dmg: f.dmg || 0, dsecs: f.dsecs || 0, roles: f.roles || {} } : null;
      }).filter(Boolean).sort((a, b) => b.games - a.games),
      queues: Object.fromEntries(Object.entries(p.queues || {}).filter(([q]) => q === "440")),
      recent: (p.recent || []).filter(g => g.q === 440),
    })),
    playerPairs: src.playerPairs.map(pp => {
      const f = pp.q && pp.q["440"];
      return f && f.games ? { a: pp.a, b: pp.b, games: f.games, wins: f.wins,
        roles: f.roles } : null;
    }).filter(Boolean),
    championPairs: src.championPairs.map(cp => {
      const f = cp.q && cp.q["440"];
      return f && f.games >= 2 ? { pa: cp.pa, a: cp.a, pb: cp.pb, b: cp.b,
        games: f.games, wins: f.wins } : null;
    }).filter(Boolean),
    stacks: (src.stacks || []).filter(g => g.q === 440),
  };
}

function applyCurrent() {
  applyData(flexOnly ? flexView(RAW.players) : RAW.players, RAW.meta, RAW.profiles);
}

const refreshedAt = iso => {
  const d = new Date(iso), now = new Date();
  if (now - d < 90e3) return "just now";
  const t = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  return d.toDateString() === now.toDateString() ? t
    : d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " + t;
};

// (Re)build every index and re-render — used at boot and after each refresh.
function applyData(players, meta, profiles) {
  D = players; META = meta; PROFILES = profiles;
  masteryIdx = {}; champPairIdx = {}; playerPairIdx = {};
  indCache = {}; candCache = {}; pairBoostIdx = null; pairDragIdx = null;
  for (const k of Object.keys(roleShareCache)) delete roleShareCache[k];
  rankedTabs.assigned = rankedTabs.overall = rankedTabs.worst = null;
  // Data Dragon lists game-mode variant units (Jade_Annie, id 60001, …) that
  // share display names with real champions — name lookups always resolve to
  // the base champ (lowest id), and the datalist shows each name once.
  CHAMP_BY_NAME = {};
  for (const [id, c] of Object.entries(D.champions)) {
    const k = c.name.toLowerCase();
    if (!(k in CHAMP_BY_NAME) || +id < CHAMP_BY_NAME[k]) CHAMP_BY_NAME[k] = +id;
  }
  // ?squad=gimly,secondcoming,… preselects exactly these players (name match,
  // tag optional, case-insensitive) — handy for demos and fixed 5-stacks.
  if (!squadApplied) {
    squadApplied = true;
    const q = new URLSearchParams(location.search).get("squad");
    if (q) {
      const want = new Set(q.toLowerCase().split(",").map(s => s.trim()).filter(Boolean));
      for (const p of D.players)
        included[p.riotId] = want.has(p.riotId.toLowerCase()) || want.has(p.riotId.split("#")[0].toLowerCase());
    }
  }
  for (const p of D.players) {
    if (!(p.riotId in included)) included[p.riotId] = true;
    masteryIdx[p.riotId] = Object.fromEntries(p.mastery.map(m => [m.championId, m.points]));
  }
  for (const cp of D.championPairs)
    champPairIdx[cp.pa + "|" + cp.a + ":" + cp.pb + "|" + cp.b] = cp;
  for (const pp of D.playerPairs)
    playerPairIdx[[pp.a, pp.b].sort().join("|")] = pp;
  renderChips();
  render();
}

function renderChips() {
  const chips = [
    `patch <b>${D.ddragonVersion}</b>`,
    META ? `meta <b>${(META.matchCount / 1e6).toFixed(1)}M</b> ${META.region.toUpperCase()} games`
         + (META.tier && META.tier !== "all" ? ` · <b>${META.tier}</b>` : "") : `no meta data`,
    liveMode ? `refreshed <b>${refreshedAt(D.generatedAt)}</b>` : `fetched ${D.generatedAt.slice(0, 10)}`,
  ];
  if (flexOnly) chips.push(`<b>flex games only</b>`);
  if (strictRole) chips.push(`<b>role WRs only</b>`);
  $("#sub").innerHTML = chips.map(c => `<span class="chip">${c}</span>`).join("");
}

async function loadLive() {
  if (!WORKER_URL) return null;
  try {
    const r = await fetch(WORKER_URL + "/data");
    const j = r.ok ? await r.json() : null;
    return j && j.players ? j : null;
  } catch { return null; }
}

async function loadStatic() {
  const get = f => fetch("data/" + f, { cache: "no-cache" }).then(r => r.ok ? r.json() : null).catch(() => null);
  const [players, meta, profiles] = await Promise.all(
    [get("players.json"), get("meta.json"), get("profiles.json")]);
  return players ? { players, meta, profiles } : null;
}

const REFRESH_LABEL = `<span class="spin">⟳</span> Refresh`;

// Ask the worker to pull the group's newest games, then re-render if anything
// landed. Runs on page load too (silent = no feedback flash unless games were
// found); the worker's 3-minute debounce makes that free.
async function doRefresh(silent = false) {
  const btn = $("#refreshBtn");
  if (btn.disabled) return;
  btn.disabled = true; btn.classList.add("busy");
  const restore = () => { btn.innerHTML = REFRESH_LABEL; btn.disabled = false; };
  const flash = msg => { btn.innerHTML = msg; setTimeout(restore, 2500); };
  try {
    // keep pulling until the worker has caught up (it merges in small batches)
    let added = 0, res;
    do {
      res = await fetch(WORKER_URL + "/refresh", { method: "POST" }).then(r => r.json());
      added += res.added || 0;
    } while (res.remaining > 0);
    if (added) {
      const fresh = await loadLive();
      if (fresh) { RAW = fresh; applyCurrent(); }
    } else if (res.lastRefresh) {
      // nothing new, but the server did just check — reflect that
      D.generatedAt = res.lastRefresh;
      renderChips();
    }
    btn.classList.remove("busy");
    if (silent && !added) return restore();
    flash(res.error ? "Refresh failed" : added ? `+${added} game${added > 1 ? "s" : ""}` : "Up to date");
  } catch {
    btn.classList.remove("busy");
    if (silent) return restore();
    flash("Refresh failed");
  }
}

function initRefreshButton() {
  const btn = $("#refreshBtn");
  btn.hidden = false;
  btn.addEventListener("click", () => doRefresh());
}

function initRoleToggle() {
  const t = $("#roleToggle");
  t.classList.toggle("active", strictRole);
  t.addEventListener("click", () => {
    strictRole = !strictRole;
    localStorage.setItem("strictRole", strictRole ? "1" : "0");
    t.classList.toggle("active", strictRole);
    const m = $("#roleToggle2");
    if (m) m.classList.toggle("active", strictRole);
    indCache = {}; candCache = {};  // scores depend on the mode
    rankedTabs.assigned = rankedTabs.overall = rankedTabs.worst = null;
    renderChips(); renderSlots(); renderScore();
  });
}

function initDraftToggle() {
  const t = $("#draftToggle");
  t.classList.toggle("active", draftMode);
  document.body.classList.toggle("drafting", draftMode);
  setDraftLive(draftMode);
  t.addEventListener("click", () => {
    draftMode = !draftMode;
    autoSwapNote = null;
    localStorage.setItem("draftMode", draftMode ? "1" : "0");
    t.classList.toggle("active", draftMode);
    document.body.classList.toggle("drafting", draftMode);
    if (!draftMode) allyLock.clear();  // locks are draft-scoped, like the bans
    setDraftLive(draftMode);
    draftChanged();
  });
}

function initThemeToggle() {
  // Unset theme follows prefers-color-scheme; the toggle pins the opposite of
  // whatever is currently showing and persists it.
  $("#themeToggle").addEventListener("click", () => {
    const sysDark = !window.matchMedia("(prefers-color-scheme: light)").matches;
    const cur = document.documentElement.dataset.theme || (sysDark ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    localStorage.setItem("theme", next);
  });
}

function initFlexToggle() {
  const t = $("#flexToggle");
  // needs per-queue counters in the data — hide against a pre-split dataset
  if (!RAW.players.players.some(p => p.champions.some(c => c.q))) return;
  t.hidden = false;
  t.classList.toggle("active", flexOnly);
  t.addEventListener("click", () => {
    flexOnly = !flexOnly;
    localStorage.setItem("flexOnly", flexOnly ? "1" : "0");
    t.classList.toggle("active", flexOnly);
    applyCurrent();
  });
}

(async () => {
  const live = await loadLive();
  liveMode = !!live;
  const data = live || await loadStatic();
  if (!data) {
    $("#sub").innerHTML = "";
    $("#app").innerHTML = `<div class="card empty">
      <p><b style="color:var(--text-primary)">No data yet.</b></p>
      <p>1. Copy <code>config.example.json</code> → <code>config.json</code> and fill in your Riot API key + the 6 Riot IDs.</p>
      <p>2. Run <code>python3 fetch_data.py</code></p>
      <p>3. Reload this page.</p>
    </div>`;
    return;
  }
  RAW = data;
  applyCurrent();
  initThemeToggle();
  initFlexToggle();
  initRoleToggle();
  initDraftToggle();
  // A fearless session left on overnight is over, not resumable — the worker
  // refuses a >24h lookback anyway, so expire it instead of erroring forever.
  if (fearless && fearlessSince < Math.floor(Date.now() / 1000) - 24 * 3600) {
    fearless = false;
    fearlessPicks = [];
    fearlessChamps = new Set();
    localStorage.setItem("fearless", "0");
    localStorage.removeItem("fearlessSince");
    localStorage.removeItem("fearlessPicks");
  } else if (fearless) fetchFearless();
  if (liveMode) { initRefreshButton(); doRefresh(true); }
})();
</script>
