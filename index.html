<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comp Builder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2l9.5 6.9-3.6 11.2h-11.8L2.5 8.9z' fill='none' stroke='%23e3b13f' stroke-width='1.6'/%3E%3Ccircle cx='12' cy='12.4' r='3.2' fill='%23e3b13f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Token system — see STYLE_GUIDE.md. All color lives in these tokens;
     dark is the design-lead theme, light is a pure token swap. */
  :root {
    color-scheme: dark;
    --surface: #14161c;
    --layer-1: #1c1f27;
    --layer-2: #252932;
    --layer-3: #2f3440;
    --text-primary: #e6e9ef;
    --text-secondary: #a8b0bf;
    --text-muted: #8a93a5;
    --accent: #5aa2ff;
    --on-accent: #0c1524;
    --enemy: #ff8a5c;
    --positive: #57c78a;
    --negative: #ff6b6b;
    --warning: #eac54f;
    --outline: #6c7483;
    --outline-variant: #343a46;
    --focus: #7cc4ff;
    --accent-dim: rgba(90, 162, 255, 0.16);
    --positive-dim: rgba(87, 199, 138, 0.12);
    --negative-dim: rgba(255, 107, 107, 0.12);
    --enemy-dim: rgba(255, 138, 92, 0.14);
    --warning-dim: rgba(234, 197, 79, 0.12);
    --hover-layer: rgba(230, 233, 239, 0.08);
    --elev-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
    --elev-md: 0 4px 6px rgba(0, 0, 0, 0.3), 0 1px 3px rgba(0, 0, 0, 0.4);
    --elev-lg: 0 12px 24px rgba(0, 0, 0, 0.4);
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
    --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;
    --radius: 12px;
    --ease-standard: cubic-bezier(0.2, 0, 0.38, 0.9);
    --ease-entrance: cubic-bezier(0, 0, 0.38, 0.9);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --surface: #f6f7f9;
    --layer-1: #ffffff;
    --layer-2: #eef0f4;
    --layer-3: #ffffff;
    --text-primary: #30343c;
    --text-secondary: #5b6270;
    --text-muted: #656d7c;
    --accent: #2d69cb;
    --on-accent: #ffffff;
    --enemy: #b05029;
    --positive: #1d7a4a;
    --negative: #c5393f;
    --warning: #8a6d1c;
    --outline: #828996;
    --outline-variant: #d8dce3;
    --focus: #2d69cb;
    --accent-dim: rgba(45, 105, 203, 0.12);
    --positive-dim: rgba(29, 122, 74, 0.14);
    --negative-dim: rgba(197, 57, 63, 0.12);
    --enemy-dim: rgba(176, 80, 41, 0.12);
    --warning-dim: rgba(138, 109, 28, 0.12);
    --hover-layer: rgba(48, 52, 60, 0.06);
    --elev-sm: 0 1px 2px rgba(16, 24, 40, 0.12);
    --elev-md: 0 4px 6px rgba(16, 24, 40, 0.1), 0 1px 3px rgba(16, 24, 40, 0.14);
    --elev-lg: 0 12px 24px rgba(16, 24, 40, 0.16);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --surface: #f6f7f9;
      --layer-1: #ffffff;
      --layer-2: #eef0f4;
      --layer-3: #ffffff;
      --text-primary: #30343c;
      --text-secondary: #5b6270;
      --text-muted: #656d7c;
      --accent: #2d69cb;
      --on-accent: #ffffff;
      --enemy: #b05029;
      --positive: #1d7a4a;
      --negative: #c5393f;
      --warning: #8a6d1c;
      --outline: #828996;
      --outline-variant: #d8dce3;
      --focus: #2d69cb;
      --accent-dim: rgba(45, 105, 203, 0.12);
      --positive-dim: rgba(29, 122, 74, 0.14);
      --negative-dim: rgba(197, 57, 63, 0.12);
      --enemy-dim: rgba(176, 80, 41, 0.12);
      --warning-dim: rgba(138, 109, 28, 0.12);
      --hover-layer: rgba(48, 52, 60, 0.06);
      --elev-sm: 0 1px 2px rgba(16, 24, 40, 0.12);
      --elev-md: 0 4px 6px rgba(16, 24, 40, 0.1), 0 1px 3px rgba(16, 24, 40, 0.14);
      --elev-lg: 0 12px 24px rgba(16, 24, 40, 0.16);
    }
  }

  * { box-sizing: border-box; }
  /* a horizontal drag near the screen edge must never become Chrome's
     back/forward navigation gesture — sliders live near the edges */
  html { scrollbar-gutter: stable; overscroll-behavior-x: none; }
  body {
    margin: 0;
    font-family: "Inter", "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    background: var(--surface);
    color: var(--text-primary);
    font-size: 14px; line-height: 20px;
    font-variant-numeric: tabular-nums;
    min-height: 100vh;
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .shell { max-width: 1584px; margin: 0 auto; padding: var(--sp-5) var(--sp-4) var(--sp-7); }

  /* ---- header ---- */
  header { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-6); flex-wrap: wrap; }
  .sigil {
    width: 32px; height: 32px; flex: none;
    display: grid; place-items: center;
    background: var(--accent); color: var(--on-accent);
    border-radius: 8px;
  }
  .sigil svg { color: var(--on-accent); width: 18px; height: 18px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; line-height: 26px; }
  .tagline { font-size: 12px; line-height: 16px; color: var(--text-secondary); margin-top: 2px; }
  .patchbar { margin-left: auto; display: flex; gap: var(--sp-2); flex-wrap: wrap; }
  .chip {
    font-size: 12px; line-height: 16px; color: var(--text-secondary);
    background: var(--layer-1); border: 1px solid var(--outline-variant);
    border-radius: 999px; padding: 4px 12px;
    white-space: nowrap;
  }
  .chip b { color: var(--text-primary); font-weight: 600; }

  /* ---- layout ---- */
  .layout { display: grid; grid-template-columns: 370px 1fr; gap: var(--sp-6); align-items: start; }
  /* grid children default to min-width:auto and refuse to shrink below their
     content, overflowing narrow viewports — let the columns actually shrink */
  .layout > div { min-width: 0; }
  @media (max-width: 940px) { .layout { grid-template-columns: 1fr; } }

  .card {
    background: var(--layer-1);
    border-radius: var(--radius);
    padding: var(--sp-4); margin-bottom: var(--sp-4);
  }
  h2 {
    font-size: 16px; font-weight: 600; line-height: 22px;
    color: var(--text-primary); margin: 0 0 var(--sp-4);
    display: flex; align-items: center; gap: var(--sp-2);
  }
  .hint { color: var(--text-secondary); font-size: 12px; line-height: 16px; }

  /* ---- players ---- */
  .player {
    display: flex; align-items: center; gap: var(--sp-3);
    padding: var(--sp-2) var(--sp-2); border-radius: 8px; cursor: pointer;
    transition: background 70ms var(--ease-standard);
  }
  .player:hover { background: var(--hover-layer); }
  .player input {
    accent-color: var(--accent); width: 16px; height: 16px; flex: none; cursor: pointer;
  }
  .avatar {
    width: 32px; height: 32px; flex: none; border-radius: 8px;
    object-fit: cover;
  }
  .player .who { flex: 1; min-width: 0; }
  .player .name { display: block; font-size: 14px; font-weight: 600;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player .tag { display: block; font-size: 11px; line-height: 16px; color: var(--text-muted); }
  .qsplit { flex: none; text-align: right; font-size: 11px; line-height: 16px; color: var(--text-secondary); white-space: nowrap; }
  .qsplit .q { color: var(--text-muted); font-weight: 500; font-size: 11px; letter-spacing: 0.06em; }

  /* ---- buttons ----
     One primary per view: the visible "Optimize comp" is solid accent,
     everything else is secondary (outline) or a toggle chip. */
  .btn {
    font: inherit; font-weight: 600; font-size: 14px;
    color: var(--on-accent);
    background: var(--accent);
    border: none; border-radius: 8px;
    padding: 0 var(--sp-4); height: 36px; cursor: pointer;
    transition: filter 70ms var(--ease-standard), background 70ms var(--ease-standard),
                color 70ms var(--ease-standard), border-color 70ms var(--ease-standard);
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { filter: brightness(0.95); }
  .btn.full { width: 100%; margin-top: var(--sp-4); height: 44px; }
  #optChamps {
    color: var(--text-primary); background: none;
    border: 1px solid var(--outline);
  }
  #optChamps:hover { background: var(--hover-layer); filter: none; }
  #refreshBtn {
    margin-left: auto;
    color: var(--text-primary); background: none;
    border: 1px solid var(--outline);
  }
  #refreshBtn:hover { background: var(--hover-layer); filter: none; }
  #refreshBtn:disabled { opacity: 0.38; cursor: default; }
  #refreshBtn .spin { display: inline-block; }
  #refreshBtn.busy .spin { animation: rot 1s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  #flexToggle, #roleToggle, #draftToggle, #themeToggle { margin-left: 0; }
  /* shared look for the header toggles and their board-head mirrors */
  .toggle {
    color: var(--text-secondary); background: none;
    border: 1px solid var(--outline-variant); border-radius: 999px;
    font-weight: 400;
  }
  .toggle:hover { background: var(--hover-layer); color: var(--text-primary); filter: none; }
  .toggle.active {
    color: var(--accent); font-weight: 600;
    border-color: var(--accent);
    background: var(--accent-dim);
  }
  /* inline so filter warnings never change a player row's height — the games
     slider sits below the roster and would jump mid-drag otherwise */
  .lowdata { font-size: 11px; line-height: 16px; color: var(--warning); }
  .player .tag { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mfloor { margin-top: var(--sp-4); }
  .mfloor label { display: flex; justify-content: space-between; font-size: 12px; line-height: 16px; color: var(--text-secondary); margin-bottom: 6px; }
  .mfloor label b { color: var(--text-primary); font-weight: 600; }
  .mfloor input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
  /* two-thumb range: min and max inputs stacked on one track, thumbs styled
     to match accent-color sliders; only the thumbs take pointer events */
  .dualrange { position: relative; height: 24px; }
  .dualrange input[type="range"] {
    -webkit-appearance: none; appearance: none;
    position: absolute; inset: 0; width: 100%; height: 100%; margin: 0;
    background: none; pointer-events: none;
  }
  .dualrange input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; pointer-events: auto;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); cursor: pointer; border: 2px solid var(--layer-1);
    box-shadow: var(--elev-sm);
  }
  .dualrange input[type="range"]::-moz-range-thumb {
    pointer-events: auto; width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); cursor: pointer; border: 2px solid var(--layer-1);
  }
  .drtrack, .drfill {
    position: absolute; top: 50%; transform: translateY(-50%);
    height: 4px; border-radius: 2px; pointer-events: none;
  }
  .drtrack { left: 0; right: 0; background: var(--outline); }
  .drfill { background: var(--accent); }

  /* ---- win-rate hero ---- */
  .hero-row { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
  .hero-num {
    font-size: 28px; font-weight: 600; line-height: 34px;
  }
  .verdict {
    font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase;
    border-radius: 999px; padding: 4px 12px;
    background: var(--layer-2); color: var(--text-secondary);
  }
  .verdict.good { background: var(--positive-dim); color: var(--positive); }
  .verdict.bad  { background: var(--negative-dim);  color: var(--negative); }
  .verdict.gold { background: var(--accent-dim); color: var(--accent); }
  .meter {
    position: relative; height: 4px; margin-top: var(--sp-4);
    background: var(--layer-2); border-radius: 2px; overflow: hidden;
  }
  .meter .fill {
    height: 100%; width: 0;
    background: var(--accent);
    border-radius: 2px;
    transition: width 240ms var(--ease-entrance);
  }
  .meter .tick {
    position: absolute; left: 50%; top: 0; bottom: 0; width: 1px;
    background: var(--outline);
  }
  .breakdown { font-size: 14px; color: var(--text-secondary); line-height: 1.7; margin-top: var(--sp-3); }
  .breakdown b { color: var(--text-primary); }
  .pos { color: var(--positive); font-weight: 600; }
  .neg { color: var(--negative); font-weight: 600; }
  .breakdown .pos, .breakdown .neg { font-weight: 600; }

  /* ---- draft board ---- */
  .board-head { display: flex; gap: var(--sp-2); align-items: center; margin-bottom: var(--sp-3); flex-wrap: wrap; }
  .mirror-bar { display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; margin-top: var(--sp-4); }
  .mirror-bar .mfloor { margin-top: 0; flex: 1 1 130px; max-width: 240px; }
  .mirror-bar .toggle + .mfloor { margin-left: auto; }  /* first slider after the toggles pushes the group right */
  .roles { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--sp-2); }
  /* 136px keeps all five slots on one row on a base iPad — 1180pt landscape
     (731px main column) and 820pt portrait (single column) both fit 5 tracks */
  @media (max-width: 1200px) { .roles { grid-template-columns: repeat(auto-fit, minmax(136px, 1fr)); } }
  .slot {
    background: var(--layer-1);
    border-radius: var(--radius);
    padding: var(--sp-3); text-align: center;
  }
  .slot.filled { box-shadow: inset 3px 0 0 var(--accent); }
  .slot h3 {
    margin: 0 0 var(--sp-2);
    font-size: 11px; font-weight: 500; line-height: 16px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .slot h3 svg { color: var(--accent); flex: none; }
  select {
    width: 100%; font: inherit; font-size: 13px;
    padding: 7px 22px 7px 8px; margin-bottom: var(--sp-2);
    text-overflow: ellipsis;
    background: var(--layer-2); color: var(--text-primary);
    border: 1px solid var(--outline); border-radius: 8px;
    cursor: pointer; transition: border-color 70ms var(--ease-standard);
  }
  select:hover:not(:disabled) { border-color: var(--accent); }
  select:disabled { opacity: 0.38; cursor: not-allowed; }
  .portrait-wrap { position: relative; width: 64px; margin: var(--sp-2) auto; }
  .portrait {
    width: 64px; height: 64px; border-radius: 8px; display: block;
  }
  .portrait-empty {
    width: 64px; height: 64px; border-radius: 8px; margin: var(--sp-2) auto;
    border: 1px dashed var(--outline); display: grid; place-items: center;
    color: var(--text-muted); font-size: 20px;
  }
  .cstat { font-size: 12px; line-height: 18px; color: var(--text-secondary); }
  .cstat .dim { color: var(--text-muted); }
  .scorechip {
    display: inline-block; margin-top: var(--sp-2);
    font-size: 12px; line-height: 16px; font-weight: 600;
    color: var(--accent); background: var(--accent-dim);
    border-radius: 999px; padding: 3px 12px;
  }

  /* ---- top comps ---- */
  .tabs { display: inline-flex; gap: 4px; background: var(--layer-2); border-radius: 999px; padding: 3px; }
  /* an author display value outranks the UA [hidden] rule — restore it */
  .tabs[hidden] { display: none; }
  .tabs button {
    font: inherit; font-size: 12px; font-weight: 500; cursor: pointer;
    background: none; border: none; color: var(--text-secondary);
    border-radius: 999px; padding: 5px 14px;
    transition: color 70ms var(--ease-standard), background 70ms var(--ease-standard);
  }
  .tabs button:hover { color: var(--text-primary); }
  .tabs button.active { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  table { width: 100%; border-collapse: separate; border-spacing: 0 var(--sp-1); font-size: 14px; }
  th {
    text-align: left; color: var(--text-muted); font-weight: 500; font-size: 11px;
    letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 10px;
  }
  td { padding: 9px 10px; background: var(--layer-2); }
  td:first-child { border-radius: 8px 0 0 8px; }
  td:last-child { border-radius: 0 8px 8px 0; }
  tr.comp-row { cursor: pointer; }
  tr.comp-row td { transition: background 70ms var(--ease-standard); }
  tr.comp-row:hover td { background: var(--layer-3); }
  tr.comp-row { animation: rise 150ms var(--ease-entrance) both; animation-delay: calc(var(--i) * 30ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .rank {
    display: inline-grid; place-items: center;
    width: 24px; height: 24px; border-radius: 50%;
    font-size: 12px; font-weight: 600;
    background: var(--layer-3); color: var(--text-secondary);
  }
  .rank.r1 { background: var(--accent); color: var(--on-accent); }
  .wr-cell { display: flex; align-items: center; gap: 10px; }
  .wr-cell b { font-weight: 600; }
  .wr-bar { flex: 1; max-width: 110px; height: 4px; background: var(--layer-3); border-radius: 2px; overflow: hidden; }
  .wr-bar > div { height: 100%; background: var(--accent); border-radius: 2px; }
  .champ-icons { white-space: nowrap; }
  .ci { position: relative; display: inline-block; margin-right: 4px; vertical-align: middle; }
  .ci img {
    width: 32px; height: 32px; border-radius: 8px; display: block;
    transition: transform 70ms var(--ease-standard);
  }
  .ci:hover img { transform: scale(1.25); }
  .ci::after {
    content: attr(data-tip);
    position: absolute; left: 50%; bottom: calc(100% + 8px);
    transform: translateX(-50%) translateY(2px);
    background: var(--layer-3); color: var(--text-primary);
    border-radius: 8px;
    padding: 5px 10px; font-size: 12px; font-weight: 500; white-space: nowrap;
    box-shadow: var(--elev-md);
    opacity: 0; pointer-events: none; z-index: 6;
    transition: opacity 110ms var(--ease-entrance), transform 110ms var(--ease-entrance);
  }
  .ci:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); }
  .syn-chip {
    display: inline-block; font-size: 12px; line-height: 16px; font-weight: 600;
    border-radius: 999px; padding: 3px 10px;
  }
  .syn-chip.pos { background: var(--positive-dim); }
  .syn-chip.neg { background: var(--negative-dim); }

  /* ---- team profile ---- */
  .prow { display: flex; align-items: center; gap: 10px; margin-top: var(--sp-3); }
  .prow .plabel { flex: none; width: 74px; font-size: 12px; line-height: 16px; color: var(--text-secondary); font-weight: 500; }
  .prow .pmeter { flex: 1; position: relative; height: 4px; background: var(--layer-2); border-radius: 2px; overflow: hidden; }
  .prow .pmeter > div { height: 100%; border-radius: 2px; background: var(--accent); transition: width 240ms var(--ease-entrance); }
  .pstatus {
    flex: none; font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase;
    border-radius: 999px; padding: 3px 10px; min-width: 58px; text-align: center;
    background: var(--layer-2); color: var(--text-secondary);
  }
  .pstatus.good { background: var(--positive-dim); color: var(--positive); }
  .pstatus.warn { background: var(--warning-dim); color: var(--warning); }
  .pstatus.bad  { background: var(--negative-dim);  color: var(--negative); }
  .stackbar { display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 6px; }
  .stackbar > div { height: 100%; }
  .stackbar .sPhys { background: #e08b3d; }
  .stackbar .sMagic { background: #6aa8e8; }
  .stackbar .sTrue { background: #cfd8e3; }
  .dmglegend { display: flex; gap: 14px; margin-top: 7px; font-size: 12px; line-height: 16px; color: var(--text-secondary); flex-wrap: wrap; }
  .dmglegend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }

  /* ---- draft mode ---- */
  .draft-row { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-2); }
  .dlabel { flex: none; width: 52px; font-size: 11px; line-height: 16px; color: var(--text-secondary); font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
  .dchip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; line-height: 16px; font-weight: 500;
    background: var(--layer-2); border: 1px solid var(--outline-variant);
    border-radius: 999px; padding: 3px 6px 3px 10px;
    color: var(--text-primary);
  }
  .dchip img { width: 20px; height: 20px; border-radius: 5px; }
  /* semantic sides: bans are red (unavailable), enemy picks are orange —
     each also carries its row label, never color alone */
  .dchip-ban { border-color: var(--negative); background: var(--negative-dim); }
  .dchip-enemy { border-color: var(--enemy); background: var(--enemy-dim); }
  .dchip.live { border-color: var(--positive); }
  .dchip button {
    font: inherit; background: none; border: none; cursor: pointer;
    color: var(--text-secondary); padding: 0 4px; border-radius: 50%;
  }
  .dchip button:hover { color: var(--negative); }
  .dchip select {
    width: auto; font-size: 11px; padding: 2px 4px; margin: 0;
    border-radius: 6px;
  }
  .dinput {
    font: inherit; font-size: 13px; width: 150px;
    padding: 6px 9px;

  /* Drafting declutters the page: roster and filters are pre-queue decisions,

  /* ---- rift map ----

  /* ---- touch (iPad/phone, any orientation) ---- */

    /* the rift map renders on phones too — at this width it's the same
       ~330px it gets in the desktop column, and coarse-pointer pins are

<div class="shell">
  <header>
    <div class="sigil">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
        <path d="M12 2l9.5 6.9-3.6 11.2h-11.8L2.5 8.9z"/>
        <circle cx="12" cy="12.4" r="3.2" fill="currentColor" stroke="none"/>
      </svg>

      <h1>Comp Builder</h1>
    </div>
    <div class="patchbar" id="sub"><span class="chip">Loading account data…</span></div>
    <button id="refreshBtn" class="btn" hidden title="Pull the group's newest games"><span class="spin">⟳</span> Refresh</button>
    <button id="flexToggle" class="btn toggle" hidden title="Score and display using flex-queue games only">Flex only</button>
    <button id="roleToggle" class="btn toggle" title="Champion win rates count only games played in the assigned role">Role WR</button>
  <button id="draftToggle" class="btn toggle" title="Draft assist: bans and enemy picks filter the board (auto-synced when lcu_bridge.py runs)">Draft</button>
    <button id="themeToggle" class="btn toggle" title="Toggle light/dark theme" aria-label="Toggle light/dark theme">◐</button>
  </header>
  <main id="app"></main>

<script>
"use strict";
const ROLES = ["TOP", "JUNGLE", "MIDDLE", "BOTTOM", "UTILITY"];
const ROLE_LABEL = { TOP: "Top", JUNGLE: "Jungle", MIDDLE: "Mid", BOTTOM: "Bot", UTILITY: "Support" };

// --- scoring model -------------------------------------------------------
// Individual: champion win rate (in-role games full weight, other-role games
// discounted) shrunk toward the champion's CURRENT-PATCH meta win rate for
// that role (falls back to 50% if meta.json is absent),
// + mastery familiarity bonus, − off-role penalty.
// Synergy: pilot-attributed champ-pair WR deviation vs the pair's expected
// meta WR (only games where these two PLAYERS piloted these two champs on the
// same team), plus player-pair (duo) WR deviation vs 50%.
const K_IND = 8;        // shrinkage prior weight for individual champ WR
const K_PAIR = 20;      // shrinkage for pair stats (small samples)
const MASTERY_MAX_BONUS = 0.03;  // up to +3% for very high mastery
const SYNERGY_WEIGHT = 0.5;      // how much a pair's WR deviation counts
// The ten duo records in a 5-stack largely re-count the SAME games, so summing
// them multiplies one shared win streak ~10x. This scales the sum back so ten
// fully-overlapping pairs count the group's record roughly once.
const PAIR_OVERLAP_DISCOUNT = 0.25;
const OFF_ROLE_PENALTY = 0.04;       // player rarely plays this champ in this role
const OFF_META_PRIOR_PENALTY = 0.04; // champ has no meta presence in this role (e.g. Annie bot)
const OFF_ROLE_GAME_WEIGHT = 0.3;    // off-role games count this much toward a role's record
// Strict mode halves that instead of zeroing it: a 1W-5L mid record is still
// evidence about how the player pilots the champ, and zero weight let a champ
// they demonstrably lose on score as a fresh meta-prior unknown ("hidden bad
// data") while a real bad in-role record counted fully against its rival.
const OFF_ROLE_GAME_WEIGHT_STRICT = 0.15;
const ROLE_COMFORT_WEIGHT = 0.12;    // bonus/penalty for how much of the player's games are in this role
const MIN_CHAMP_GAMES = 5;           // preferred: champs the player has actually logged games on
const OWN_ROLE_VIABLE_GAMES = 10;    // personal games in a role needed to trust a pick the meta doesn't play there

let D = null;           // loaded dataset
let CHAMP_BY_NAME = {}; // lowercased name -> base championId (dupes resolved)
let META = null;        // current-patch meta stats (optional)
let PROFILES = null;    // per-champion combat profiles (optional)
let masteryIdx = {};    // riotId -> championId -> points
let champPairIdx = {};  // "rid|cid:rid|cid" -> {games, wins} (pilot-attributed)
let playerPairIdx = {}; // "a|b" -> {games, wins, roles: {"roleA|roleB": {games, wins}}}
let slots = ROLES.map(() => ({ player: null, champ: null }));
let included = {};      // riotId -> bool
let squadApplied = false;  // ?squad= URL param consumed (applies once)
let indCache = {};      // memoized indScore — larger rosters make the search combinatorial
let candCache = {};     // memoized candidates
const CS_MIN_PLAYER = "BigBellyBobby#NA1"; // show cs/min in this player's slot cards
// Mastery range: champs outside [masteryMin, masteryMax] mastery points are
// filtered from a player's candidate list (with the usual graceful fallback).
// Default 30k minimum; a max slider at MASTERY_OFF means no upper cap.
const MASTERY_OFF = 200000;
let masteryMin = +(localStorage.getItem("masteryFloor") ?? 30000);
let masteryMax = +(localStorage.getItem("masteryMax") ?? MASTERY_OFF);
const inMasteryRange = pts => pts >= masteryMin && (masteryMax >= MASTERY_OFF || pts <= masteryMax);
// Games-played range: champs outside [minGames, maxGames] total ranked games
// are filtered from candidate lists — too few games means the record is
// noise, too many means the pick is predictable/bannable. A max slider at
// MAX_GAMES_OFF means no upper cap.
const MAX_GAMES_OFF = 31;  // slider runs 0–30; the top notch means no ceiling
let minGames = Math.min(+(localStorage.getItem("minGames") ?? 0), MAX_GAMES_OFF - 1);
let maxGames = +(localStorage.getItem("maxGames") ?? MAX_GAMES_OFF);
const inGamesRange = g => g >= minGames && (maxGames >= MAX_GAMES_OFF || g <= maxGames);
// Strict role WRs: the in-role record dominates a champion's score and the
// candidate "played" tier counts only in-role games; off-role games still
// contribute at OFF_ROLE_GAME_WEIGHT_STRICT so champ-skill evidence is never
// discarded outright.
let strictRole = localStorage.getItem("strictRole") === "1";

// --- draft mode ------------------------------------------------------------
// Bans and enemy picks (entered manually or streamed from lcu_bridge.py via
// the worker) become unavailable, and known lane opponents nudge pick scores
// with OP.GG matchup records.
let draftMode = localStorage.getItem("draftMode") === "1";
// "We're playing these roles this game": auto re-optimization on bans/enemy
// picks re-picks champions only and never reshuffles player→role. Dragging a
// pin still reassigns roles — that's the deliberate manual override.
let lockRoles = localStorage.getItem("lockRoles") === "1";
// The lock only exists inside draft mode (its toggle lives in the rift card),
// so a stale localStorage "1" can't affect the normal builder.
const rolesLocked = () => draftMode && lockRoles;
let manualBans = new Set(), manualEnemy = new Set();  // championIds
let liveBans = new Set(), liveEnemy = new Set();      // from the LCU bridge
let enemyRole = new Map();   // enemy cid -> our ROLES key (inferred, editable)
let liveDraft = { ts: 0, active: false };
let liveOurs = [];           // our team's live picks [{championId, position}]
let liveOursByRole = {};     // role -> cid the live sync last wrote into a slot
let autoSwapNote = null;     // "Tristana → Kai'Sa" — last automatic dead-pick swap
let counterIdx = {};         // "enemyCid|OPGGPOS" -> {ourCid: {play, win}}
let dAdjCache = {};
const MATCHUP_WEIGHT = 1;      // matchup deltas are already small; cap below
const MATCHUP_CAP = 0.03;      // per-lane-opponent cap (±3pp)

const effBans = () => draftMode ? new Set([...manualBans, ...liveBans]) : new Set();
const effEnemy = () => draftMode ? new Set([...manualEnemy, ...liveEnemy]) : new Set();
const draftUnavailable = cid => draftMode && (effBans().has(cid) || effEnemy().has(cid));

const shrunk = (wins, games, k, prior = 0.5) => (wins + prior * k) / (games + k);

// Share of ALL the player's games played in this role — their role comfort.
// 0.2 (= 1/5 roles) is neutral; above is home turf, below is off-role.
const roleShareCache = {};
function playerRoleShare(riotId, role) {
  let shares = roleShareCache[riotId];
  if (!shares) {
    const p = D.players.find(p => p.riotId === riotId);
    shares = roleShareCache[riotId] = { total: 0 };
    for (const c of p.champions)
      for (const [r, rec] of Object.entries(c.roles)) {
        shares[r] = (shares[r] || 0) + rec.games;
        shares.total += rec.games;
      }
  }
  return shares.total ? (shares[role] || 0) / shares.total : 0.2;
}

// Current-patch meta win rate for a champion in a role. If the champ simply
// isn't played in that role on this patch, its overall WR is a bad prior —
// apply the off-meta penalty instead of pretending role doesn't matter.
const OPGG_POS = { TOP: "TOP", JUNGLE: "JUNGLE", MIDDLE: "MID", BOTTOM: "ADC", UTILITY: "SUPPORT" };
function metaWR(champId, role) {
  const m = META && META.champions[champId];
  if (!m) return 0.5;
  const pos = role && m.positions[OPGG_POS[role]];
  if (pos && pos.games >= 100) return pos.winRate;
  const base = m.winRate ?? 0.5;
  if (role && Object.keys(m.positions).length) return base - OFF_META_PRIOR_PENALTY;
  return base;
}

// Where an enemy pick is likely headed: its meta-viable lanes (≥10% role
// rate) weighted by how often it actually goes there. A flex pick like Yasuo
// splits its matchup weight across mid/top/bot instead of betting on one
// guess. A manual lane on the chip collapses this to certainty, and lanes
// manually claimed by other enemy picks are eliminated before normalizing.
// raw=true ignores both — the full meta distribution.
function laneDist(cid, raw = false) {
  const manual = enemyRole.get(cid);
  if (manual && !raw) return { [manual]: 1 };
  const m = META && META.champions[cid];
  const back = { TOP: "TOP", JUNGLE: "JUNGLE", MID: "MIDDLE", ADC: "BOTTOM", SUPPORT: "UTILITY" };
  const dist = {};
  let listed = 0;
  if (m) for (const [pos, s] of Object.entries(m.positions)) {
    const role = back[pos];
    if (!role || (s.roleRate || 0) < 0.10) continue;
    dist[role] = s.roleRate;
    listed += s.roleRate;
  }
  // OP.GG only ships a champ's headline lanes — Heimerdinger arrives as
  // "top, 59% role rate" with the mid/support games missing entirely, and
  // normalizing that would claim he's a 100% top-laner. Weights are kept as
  // true probabilities (sum ≤ 1), and any large unexplained share goes to
  // lanes the roster itself has a real sample playing the champ in.
  const missing = Math.max(0, 1 - listed);
  if (missing >= 0.15) {
    const own = {};
    let ownTotal = 0;
    for (const p of D.players) {
      const e = p.champions.find(c => c.championId === cid);
      if (!e) continue;
      for (const [r, rec] of Object.entries(e.roles)) {
        if (rec.games < OWN_ROLE_VIABLE_GAMES || dist[r]) continue;
        own[r] = (own[r] || 0) + rec.games;
        ownTotal += rec.games;
      }
    }
    for (const r in own) dist[r] = missing * own[r] / ownTotal;
  }
  if (!raw) {
    // Lanes claimed by other enemy picks are off the table: manual chip
    // assignments, plus champs whose own meta distribution is effectively
    // single-lane (a 100%-top pick landing second means the earlier flex pick
    // is NOT top — collapse and renormalize the survivors accordingly).
    const claimed = new Set();
    for (const c of effEnemy()) {
      if (c === cid) continue;
      const manual = enemyRole.get(c);
      if (manual) { claimed.add(manual); continue; }
      const rd = laneDist(c, true);
      const keys = Object.keys(rd);
      if (keys.length === 1 && rd[keys[0]] >= 0.85) claimed.add(keys[0]);
    }
    let removed = 0;
    for (const r of Object.keys(dist)) if (claimed.has(r)) { removed += dist[r]; delete dist[r]; }
    if (removed > 0) {
      const rest = Object.values(dist).reduce((a, b) => a + b, 0);
      if (rest) for (const r in dist) dist[r] /= rest;
    }
  }
  return dist;
}

// Prefetch matchup tables for every lane the pick might go to.
function ensureEnemyCounters(cid) {
  for (const r of Object.keys(laneDist(cid, true))) ensureCounters(cid, r);
  if (enemyRole.get(cid)) ensureCounters(cid, enemyRole.get(cid));
}

// Lane-matchup records for an enemy pick, fetched once per (champ, lane) and
// KV-cached worker-side. Arrives async — scores re-render when it lands.
function ensureCounters(cid, role) {
  if (!role || !WORKER_URL) return;
  const key = cid + "|" + OPGG_POS[role];
  if (counterIdx[key]) return;
  counterIdx[key] = {};  // placeholder so a slow response isn't refetched
  fetch(`${WORKER_URL}/counters?champ=${cid}&pos=${OPGG_POS[role]}`)
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      if (!j || !j.counters) return;
      const map = {};
      for (const c of j.counters) map[c.champion_id] = c;
      counterIdx[key] = map;
      draftChanged(false);
    })
    .catch(() => {});
}

// Matchup record for our champ vs an enemy in a lane. OP.GG's counter table
// on the enemy's page omits rare opponents (an off-meta Heimerdinger mid
// rarely makes anyone's list) — but the same matchup often still lives on OUR
// champ's page for that lane, with the win count from the other side.
function matchupRec(ecid, cid, role) {
  const direct = (counterIdx[ecid + "|" + OPGG_POS[role]] || {})[cid];
  if (direct) return direct;
  const rev = (counterIdx[cid + "|" + OPGG_POS[role]] || {})[ecid];
  return rev ? { play: rev.play, win: rev.play - rev.win } : null;
}

// Matchup nudge for playing champ `cid` in `role` into the enemy picks that
// might lane there: the complement of the enemy's WR vs us, shrunk by sample
// size, capped, and weighted by how likely that enemy is to be in this lane.
// counters[x].win is the ENEMY champ's wins against x.
function dAdj(cid, role) {
  if (!draftMode) return 0;
  const k = cid + "|" + role;
  if (k in dAdjCache) return dAdjCache[k];
  let adj = 0;
  for (const ecid of effEnemy()) {
    const w = laneDist(ecid)[role] || 0;
    if (!w) continue;
    const rec = matchupRec(ecid, cid, role);
    if (!rec || rec.play < 20) continue;
    const edge = (0.5 - rec.win / rec.play) * (rec.play / (rec.play + 50)) * MATCHUP_WEIGHT;
    adj += w * Math.max(-MATCHUP_CAP, Math.min(MATCHUP_CAP, edge));
  }
  return dAdjCache[k] = adj;
}

// Hard-counter flag: enemy picks likely in this lane (≥50% lane odds) that
// beat the champ ≥55% of the time in the meta (20+ games). This never swaps
// the pick by itself — the score card raises a Swap/Keep prompt and the champ
// only leaves the optimizer's menu once the player opts into the swap
// (counterAvoid); Keep dismisses the prompt for that champ+enemies combo.
const HARD_COUNTER_WR = 0.55;
let counterAvoid = new Set();      // cids the player agreed to draft around
let counterDismissed = new Set();  // "cid|enemies" prompts the player declined
function hardCounters(cid, role) {
  if (!draftMode) return [];
  const out = [];
  for (const ecid of effEnemy()) {
    if ((laneDist(ecid)[role] || 0) < 0.5) continue;
    const rec = matchupRec(ecid, cid, role);
    if (rec && rec.play >= 20 && rec.win / rec.play >= HARD_COUNTER_WR) out.push(ecid);
  }
  return out;
}

// indScore is draft-independent (and cached as such); slotScore adds the
// draft-dependent matchup nudge on top. Use this everywhere a pick is scored.
const slotScore = (riotId, champId, role) => indScore(riotId, champId, role) + dAdj(champId, role);

function masteryBonus(riotId, champId) {
  const pts = (masteryIdx[riotId] || {})[champId] || 0;
  return Math.min(pts, 200000) / 200000 * MASTERY_MAX_BONUS;
}

function roleShare(champEntry, role) {
  if (!champEntry) return 0;
  const total = Object.values(champEntry.roles).reduce((a, r) => a + r.games, 0) || 1;
  return (champEntry.roles[role] || { games: 0 }).games / total;
}

// Score of one player playing one champion in one role. The record is the
// champ-IN-ROLE games at full weight plus the champ's other-role games
// discounted to OFF_ROLE_GAME_WEIGHT (mechanics transfer between roles, but
// a jungle record shouldn't fully back a top-lane pick), shrunk toward the
// role-specific meta prior.
function indScore(riotId, champId, role) {
  const ck = riotId + "|" + champId + "|" + role;
  if (ck in indCache) return indCache[ck];
  const p = D.players.find(p => p.riotId === riotId);
  const entry = p.champions.find(c => c.championId === champId);
  const prior = metaWR(champId, role);
  let wr;
  if (entry) {
    const offW = strictRole ? OFF_ROLE_GAME_WEIGHT_STRICT : OFF_ROLE_GAME_WEIGHT;
    const roleRec = entry.roles[role] || { games: 0, wins: 0 };
    const g = roleRec.games + (entry.games - roleRec.games) * offW;
    const w = roleRec.wins + (entry.wins - roleRec.wins) * offW;
    wr = shrunk(w, g, K_IND, prior);
  } else {
    wr = prior;
  }
  const rolePen = entry && roleShare(entry, role) < 0.25 ? OFF_ROLE_PENALTY : 0;
  const comfort = ROLE_COMFORT_WEIGHT * (playerRoleShare(riotId, role) - 0.2);
  return indCache[ck] = wr + masteryBonus(riotId, champId) - rolePen + comfort;
}

// A and B are assign entries ({player, champ}): the pair record only counts
// games where these two players piloted these two champions themselves —
// someone else's games on the same champion are not this player's synergy.
function champPairAdjRaw(pa, ca, pb, cb) {
  const key = (pa < pb || (pa === pb && ca <= cb))
    ? pa + "|" + ca + ":" + pb + "|" + cb
    : pb + "|" + cb + ":" + pa + "|" + ca;
  const s = champPairIdx[key];
  if (!s) return 0;
  // Expected pair WR is the mean of the two champs' meta WRs, so champion
  // strength isn't double-counted as "synergy".
  const expected = (metaWR(ca, null) + metaWR(cb, null)) / 2;
  return (shrunk(s.wins, s.games, K_PAIR, expected) - expected) * SYNERGY_WEIGHT * (s.games / (s.games + 10));
}
const champPairAdj = (A, B) => champPairAdjRaw(A.player, A.champ, B.player, B.champ);

// Best positive champ-pair adjustment per player pair — an upper bound used
// to prune whole role-permutations in optimize() before scoring 3^5 combos.
let pairBoostIdx = null;
function buildPairBoost() {
  pairBoostIdx = {};
  for (const key in champPairIdx) {
    const [x, y] = key.split(":");
    const [pa, ca] = x.split("|"), [pb, cb] = y.split("|");
    const adj = champPairAdjRaw(pa, +ca, pb, +cb);
    const pk = pa < pb ? pa + "|" + pb : pb + "|" + pa;
    if (adj > (pairBoostIdx[pk] || 0)) pairBoostIdx[pk] = adj;
  }
}

// Duo record, role-weighted: shared games where the duo played the roles
// they're assigned here count fully; games in other role combos are
// discounted like indScore's off-role games (chemistry partly transfers,
// but a bot-lane duo's record shouldn't fully back a top+jungle pairing).
// Older pair records without a role split fall back to full weight.
function playerPairAdj(a, ra, b, rb) {
  const s = playerPairIdx[[a, b].sort().join("|")];
  if (!s) return 0;
  let g = s.games, w = s.wins;
  if (s.roles && Object.keys(s.roles).length) {
    const rec = s.roles[s.a === a ? ra + "|" + rb : rb + "|" + ra] || { games: 0, wins: 0 };
    const offW = strictRole ? 0 : OFF_ROLE_GAME_WEIGHT;
    g = rec.games + (s.games - rec.games) * offW;
    w = rec.wins + (s.wins - rec.wins) * offW;
  }
  return (shrunk(w, g, K_PAIR) - 0.5) * SYNERGY_WEIGHT * PAIR_OVERLAP_DISCOUNT * (g / (g + 10));
}

// Full comp score: mean individual + all pairwise synergy adjustments.
function compScore(assign) {  // assign: [{player, champ, role}]
  let ind = 0, syn = 0;
  for (const a of assign) ind += slotScore(a.player, a.champ, a.role);
  ind /= assign.length;
  for (let i = 0; i < assign.length; i++)
    for (let j = i + 1; j < assign.length; j++) {
      syn += champPairAdj(assign[i], assign[j]);
      syn += playerPairAdj(assign[i].player, assign[i].role, assign[j].player, assign[j].role);
    }
  return { total: Math.max(0.05, Math.min(0.95, ind + syn)), ind, syn };
}

// A champion is pickable for (player, role) only if the current meta plays it
// there, or the player has a REAL personal sample there (a handful of off-meta
// experiments — e.g. 9 games of Ezreal jungle — doesn't make it a draft pick).
function roleViable(champEntry, champId, role) {
  if (champEntry && (champEntry.roles[role] || { games: 0 }).games >= OWN_ROLE_VIABLE_GAMES) return true;
  const m = META && META.champions[champId];
  const pos = m && m.positions[OPGG_POS[role]];
  // 10%: flex picks (Yasuo bot, mage supports) hover in the 10-15% band and
  // are real drafts; below that a lane assignment is usually a fill/troll tag.
  return !!(pos && pos.games >= 100 && pos.roleRate >= 0.10);
}

// Top champion candidates for a player in a role.
function candidates(riotId, role, n = 3) {
  const ck = riotId + "|" + role + "|" + n;
  if (ck in candCache) return candCache[ck];
  const p = D.players.find(p => p.riotId === riotId);
  const pool = new Map();
  for (const c of p.champions) pool.set(c.championId, c);
  for (const m of p.mastery.slice(0, 12)) if (!pool.has(m.championId)) pool.set(m.championId, null);
  const scored = [...pool.keys()].map(cid => ({
    cid,
    s: slotScore(riotId, cid, role) + roleShare(pool.get(cid), role) * 0.02,
    viable: roleViable(pool.get(cid), cid, role),
    mastered: inMasteryRange((masteryIdx[riotId] || {})[cid] || 0),
    inRange: inGamesRange((pool.get(cid) || {}).games || 0),
    avail: !draftUnavailable(cid) && !counterAvoid.has(cid),
    // in strict Role WR mode "played" means played IN THIS ROLE — a champ
    // with a real sample elsewhere but none here drops out of the top tier
    played: (strictRole
      ? (((pool.get(cid) || {}).roles || {})[role] || { games: 0 }).games
      : (pool.get(cid) || {}).games || 0) >= MIN_CHAMP_GAMES,
  }));
  // The mastery floor, games range, and draft availability (including champs
  // the player agreed to draft around after a hard-counter flag) are hard
  // filters — outside them a champ is simply not a pick for this player.
  // Within them, prefer role-viable champs with a real game sample, degrading
  // so the list stays useful.
  const eligible = scored.filter(c => c.mastered && c.inRange && c.avail);
  const tiers = [
    eligible.filter(c => c.viable && c.played),
    eligible.filter(c => c.viable),
    eligible,
  ];
  const list = (tiers.find(t => t.length) || []).sort((a, b) => b.s - a.s);
  return candCache[ck] = list.slice(0, n).map(c => c.cid);
}

// --- optimizer -----------------------------------------------------------
function* combosOf(arr, k) {
  if (k === 0) { yield []; return; }
  for (let i = 0; i <= arr.length - k; i++)
    for (const rest of combosOf(arr.slice(i + 1), k - 1))
      yield [arr[i], ...rest];
}
function* permutations(arr) {
  if (arr.length <= 1) { yield arr; return; }
  for (let i = 0; i < arr.length; i++)
    for (const rest of permutations([...arr.slice(0, i), ...arr.slice(i + 1)]))
      yield [arr[i], ...rest];
}

// Champion-only optimization: keep the player→role assignment currently in
// the slots (e.g. what you got from fill) and search champions only.
// fixed: {ROLE: championId} — champs already locked in the client stay put.
function optimizeChamps(topN = 10, fixed = {}) {
  const players = slots.map(s => s.player);
  if (players.some(p => !p) || new Set(players).size !== 5) return null;
  const cands = players.map((rid, i) =>
    fixed[ROLES[i]] != null ? [fixed[ROLES[i]]] : candidates(rid, ROLES[i], 8));
  const results = [];
  const idx = [0, 0, 0, 0, 0];
  while (true) {
    const champs = idx.map((ci, i) => cands[i][ci]).filter(c => c !== undefined);
    if (champs.length === 5 && new Set(champs).size === 5) {
      const assign = players.map((rid, i) => ({ player: rid, champ: cands[i][idx[i]], role: ROLES[i] }));
      results.push({ assign, ...compScore(assign) });
    }
    let d = 4;
    while (d >= 0 && ++idx[d] >= cands[d].length) { idx[d] = 0; d--; }
    if (d < 0) break;
  }
  results.sort((a, b) => b.total - a.total);
  return results.slice(0, topN);
}

// Full search over every 5-player subset × role permutation × candidate
// champions. With 9+ players this is millions of combinations, so the inner
// loop is allocation-free: scores are computed from cached numbers and a comp
// object is only built when it beats the current top-N floor.
// fixed: {ROLE: championId} — champs our team already locked in the client;
// the role is pinned to that champ while players and other roles stay fluid.
function optimize(topN = 10, fixed = {}) {
  const pool = D.players.map(p => p.riotId).filter(r => included[r]);
  if (pool.length < 5) return [];
  const playerSets = pool.length === 5 ? [pool] : [...combosOf(pool, 5)];
  const keep = topN * 6;  // headroom for the dedup pass below
  let results = [], floor = -Infinity;
  if (!pairBoostIdx) buildPairBoost();
  for (const five of playerSets) {
    for (const perm of permutations(five)) {
      const cands = perm.map((rid, i) =>
        fixed[ROLES[i]] != null ? [fixed[ROLES[i]]] : candidates(rid, ROLES[i]));
      if (cands.some(c => !c.length)) continue;
      // player-pair synergy is constant for this role assignment
      let permPairs = 0, champSynBound = 0;
      for (let i = 0; i < 5; i++)
        for (let j = i + 1; j < 5; j++) {
          permPairs += playerPairAdj(perm[i], ROLES[i], perm[j], ROLES[j]);
          const pk = perm[i] < perm[j] ? perm[i] + "|" + perm[j] : perm[j] + "|" + perm[i];
          champSynBound += pairBoostIdx[pk] || 0;
        }
      const ind = cands.map((cs, i) => cs.map(cid => slotScore(perm[i], cid, ROLES[i])));
      // upper bound for this whole role assignment — skip it if it can't place
      let maxIndSum = 0;
      for (const arr of ind) maxIndSum += Math.max(...arr);
      if (maxIndSum / 5 + permPairs + champSynBound <= floor) continue;
      const idx = [0, 0, 0, 0, 0];
      while (true) {
        const c0 = cands[0][idx[0]], c1 = cands[1][idx[1]], c2 = cands[2][idx[2]],
              c3 = cands[3][idx[3]], c4 = cands[4][idx[4]];
        if (c0 !== c1 && c0 !== c2 && c0 !== c3 && c0 !== c4 && c1 !== c2 &&
            c1 !== c3 && c1 !== c4 && c2 !== c3 && c2 !== c4 && c3 !== c4) {
          const indMean = (ind[0][idx[0]] + ind[1][idx[1]] + ind[2][idx[2]]
            + ind[3][idx[3]] + ind[4][idx[4]]) / 5;
          let syn = permPairs;
          for (let i = 0; i < 5; i++)
            for (let j = i + 1; j < 5; j++)
              syn += champPairAdjRaw(perm[i], cands[i][idx[i]], perm[j], cands[j][idx[j]]);
          const total = Math.max(0.05, Math.min(0.95, indMean + syn));
          if (total > floor) {
            const assign = perm.map((rid, i) => ({ player: rid, champ: cands[i][idx[i]], role: ROLES[i] }));
            results.push({ assign, total, ind: indMean, syn });
            if (results.length > keep * 4) {
              results.sort((a, b) => b.total - a.total);
              results.length = keep;
              floor = results[keep - 1].total;
            }
          }
        }
        let d = 4;
        while (d >= 0 && ++idx[d] >= cands[d].length) { idx[d] = 0; d--; }
        if (d < 0) break;
      }
    }
  }
  results.sort((a, b) => b.total - a.total);
  const seen = new Set(), out = [];
  for (const r of results) {
    const key = r.assign.map(a => a.player + a.champ).join(",");
    if (!seen.has(key)) { seen.add(key); out.push(r); }
    if (out.length >= topN) break;
  }
  return out;
}

// Verdict thresholds are pure presentation — the score itself is untouched.
function verdict(total) {

  if (total >= 0.52) return { label: "Slight edge", cls: "good" };

}

      if (activeTab === "overall") switchTab("overall");

  const filtersChanged = () => {
    candCache = {};  // candidate lists depend on the filters

  $("#optFull").addEventListener("click", runOptimize);

  $("#tabOverall").addEventListener("click", () => switchTab("overall"));
  renderDraft();

// --- draft card ------------------------------------------------------------
// The draft tool IS the rift card: picks live on the map (enemy pins open a
// lane/remove popover), bans sit in a compact strip below it, and the two
// inputs stay for fast entry during a timed ban phase.
function renderDraft() {
  const el = $("#riftCard");
  if (!el) return;
  el.hidden = !draftMode;
  document.body.classList.toggle("roles-locked", rolesLocked());
  if (!draftMode) return;
  const bans = [...effBans()], enemy = [...effEnemy()];
  const banChip = cid => {
    const live = liveBans.has(cid);
    return `<span class="dchip dchip-ban bchip" title="${champName(cid)}${live ? " — from live sync" : ""}">
      <img src="${champIcon(cid)}" alt="${champName(cid)}">
      ${manualBans.has(cid) && !live ? `<button data-remove="ban:${cid}" aria-label="remove ban ${champName(cid)}">✕</button>` : ""}
    </span>`;
  };
  const anyGuess = enemy.length && [...enemyLaneMap().values()].some(a => !a.locked);
  el.innerHTML = `
    <h2>Summoner's Rift
      <span class="draft-state"><span class="live-dot" id="liveDot"></span><span id="liveMsg"></span></span>
      <button class="btn toggle ${lockRoles ? "active" : ""}" id="roleLockBtn"
        title="We're playing these roles: bans and enemy picks only re-pick champions — nothing reshuffles who plays where. Drag a pin to reassign a role by hand.">Lock roles</button>
      ${manualBans.size || manualEnemy.size
        ? `<button class="btn toggle" id="draftClear" title="Remove all manually entered bans and enemy picks">Clear</button>` : ""}
    </h2>
    <div class="rift" id="riftMap"></div>
    <div class="draft-row">
      <span class="dlabel">Bans</span>
      ${bans.map(banChip).join("")}
      <input class="dinput" id="banInput" list="champdl" aria-label="Add ban" placeholder="add ban…">
    </div>
    <div class="draft-row">
      <span class="dlabel">Enemy</span>
      <input class="dinput" id="enemyInput" list="champdl" aria-label="Add enemy pick" placeholder="add enemy pick…">
    </div>
    <div class="hint rift-hint" style="margin-bottom:var(--sp-2)">Drag a blue pin onto another lane to swap roles — the board follows.${anyGuess ? " Dashed enemy pins are lane guesses — tap one to lock its lane or remove it." : ""}</div>
    ${enemy.length && PROFILES
      ? `<div class="hint" style="margin:2px 0 6px">Their comp so far (${enemy.length}/5) — picks get matchup nudges vs whoever might lane against them:</div>` + profileHTML(enemy)
      : `<div class="hint">Banned and enemy-picked champs drop out of candidates and the optimizer. Run <code>python3 lcu_bridge.py</code> next to the League client to sync this automatically.</div>`}
  `;
  renderRift();
  updateLiveIndicator();
  const resolve = v => CHAMP_BY_NAME[v.trim().toLowerCase()] ?? null;
  // commit on change AND on Enter — during a timed ban phase the input has to
  // land without hunting for somewhere to click to blur
  const wire = (sel, add) => {
    const inp = el.querySelector(sel);
    const commit = () => {
      const cid = resolve(inp.value);
      if (cid == null) return;
      add(cid);
      inp.value = "";
      draftChanged();
      el.querySelector(sel).focus();
    };
    inp.addEventListener("change", commit);
    inp.addEventListener("keydown", e => { if (e.key === "Enter") commit(); });
  };
  wire("#banInput", cid => manualBans.add(cid));
  wire("#enemyInput", cid => {
    manualEnemy.add(cid);
    ensureEnemyCounters(cid);
  });
  el.querySelector("#roleLockBtn").addEventListener("click", () => {
    lockRoles = !lockRoles;
    localStorage.setItem("lockRoles", lockRoles ? "1" : "0");
    draftChanged();  // re-optimize under the new regime + repaint the toggle
  });
  const clr = el.querySelector("#draftClear");
  if (clr) clr.addEventListener("click", () => {
    manualBans.clear();
    manualEnemy.clear();
    counterAvoid.clear();
    counterDismissed.clear();
    for (const cid of [...enemyRole.keys()]) if (!liveEnemy.has(cid)) enemyRole.delete(cid);
    draftChanged();
  });
  el.querySelectorAll("[data-remove]").forEach(b => b.addEventListener("click", () => {
    const [kind, cid] = b.dataset.remove.split(":");
    (kind === "ban" ? manualBans : manualEnemy).delete(+cid);
    draftChanged();
  }));
}

function updateLiveIndicator() {
  const dot = $("#liveDot"), msg = $("#liveMsg");
  if (!dot) return;
  const wsUp = draftWS && draftWS.readyState === WebSocket.OPEN;
  if (!liveMode) { dot.className = "live-dot"; msg.textContent = "manual entry (no live worker)"; }
  else if (wsUp && liveDraft.active) { dot.className = "live-dot on"; msg.textContent = "live from client"; }
  else if (wsUp) { dot.className = "live-dot on"; msg.textContent = "connected — no champ select"; }
  else if (liveDraft.active && Date.now() - liveDraft.ts < 70e3) {
    dot.className = "live-dot"; msg.textContent = "live (reconnecting…)";
  } else { dot.className = "live-dot"; msg.textContent = "reconnecting — manual entry works"; }
}

// --- rift map --------------------------------------------------------------
// Something to get hyped about while the draft unfolds: our comp standing on
// the blue side of the Rift, theirs filling in on red. Enemy lanes come from
// the chip lock when set, otherwise the same laneDist guesses the scorer
// uses. Anchor coords are % of a 100×100 map, y down (blue base bottom-left).
const RIFT_POS = {
  ours:  { TOP: [10, 26], JUNGLE: [24, 44], MIDDLE: [38, 62], BOTTOM: [70, 90], UTILITY: [48, 90] },
  enemy: { TOP: [26, 10], JUNGLE: [44, 24], MIDDLE: [62, 38], BOTTOM: [90, 70], UTILITY: [90, 48] },
};

// One lane per enemy pick: chip locks first, then a greedy pass over lane
// weights (highest confidence claims its lane first), then any lane still
// free for picks with no meta signal at all — every pick lands somewhere.
function enemyLaneMap() {
  const out = new Map(), taken = new Set();
  const picks = [...effEnemy()];
  for (const cid of picks) {
    const r = enemyRole.get(cid);
    if (r && !taken.has(r)) { out.set(cid, { role: r, locked: true }); taken.add(r); }
  }
  const rest = picks.filter(c => !out.has(c));
  const scored = [];
  for (const cid of rest)
    for (const [r, w] of Object.entries(laneDist(cid))) scored.push({ cid, r, w });
  scored.sort((a, b) => b.w - a.w);
  for (const s of scored)
    if (!out.has(s.cid) && !taken.has(s.r)) { out.set(s.cid, { role: s.r, w: s.w }); taken.add(s.r); }
  for (const cid of rest) {
    if (out.has(cid)) continue;
    const free = ROLES.find(r => !taken.has(r));
    if (!free) break;
    out.set(cid, { role: free, w: 0 });
    taken.add(free);
  }
  return out;
}

// Map only — renderDraft owns the card scaffold around it. Enemy pins are
// buttons that open the lane/remove popover; empty enemy pins focus the
// add-pick input.
function renderRift() {

  if (!m || !draftMode) return;

    const s = slots[i];

    const ourTip = `${s.champ ? champName(s.champ) + " · " : ""}${ROLE_LABEL[role]}${who ? " · " + who : ""}${s.player || s.champ ? " — drag to swap roles" : " — not picked yet"}`;
    const our = s.champ
      ? `<div class="rpin ours${sup}" data-drag-slot="${i}" style="left:${ox}%;top:${oy}%" data-tip="${ourTip}">
          <img src="${champIcon(s.champ)}" alt="">
          <span class="rname">${champName(s.champ)}${who ? `<span class="rp">${who}</span>` : ""}</span>
        </div>`
      : `<div class="rpin rpin-empty ours${sup}" data-drag-slot="${i}" style="left:${ox}%;top:${oy}%" data-tip="${ourTip}">
          ${ROLE_ICON[role]}${who ? `<span class="rname"><span class="rp">${who}</span></span>` : ""}
        </div>`;
    const [ex, ey] = RIFT_POS.enemy[role];
    const e = enemyByRole[role];
    const guess = e && !e.locked;
    const enemyPin = e
      ? `<button type="button" class="rpin enemy${guess ? " guess" : ""}${sup}" data-ecid="${e.cid}" style="left:${ex}%;top:${ey}%"
          data-tip="${champName(e.cid)} · ${ROLE_LABEL[role]}${e.locked ? "" : e.w ? ` (guess ${Math.round(e.w * 100)}%)` : " (guess)"}"
          aria-label="${champName(e.cid)}, ${ROLE_LABEL[role]} — set lane or remove">
          <img src="${champIcon(e.cid)}" alt="">
          <span class="rname">${champName(e.cid)}</span>

      : `<button type="button" class="rpin rpin-empty enemy" data-add-enemy style="left:${ex}%;top:${ey}%"
          data-tip="${ROLE_LABEL[role]} — add enemy pick" aria-label="add enemy pick">${ROLE_ICON[role]}</button>`;
    return our + enemyPin;
  }).join("");
  m.innerHTML = `
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <rect x="1" y="1" width="98" height="98" rx="8" class="rf-ground"/>
      <polygon points="1,1 1,99 99,99" class="rf-side ours"/>
      <polygon points="1,1 99,1 99,99" class="rf-side enemy"/>
      <line x1="17" y1="17" x2="83" y2="83" class="rf-river"/>
      <circle cx="35" cy="35" r="3" class="rf-pit"/>
      <circle cx="65" cy="65" r="3" class="rf-pit"/>
      <path d="M 10 84 L 10 16 Q 10 10 16 10 L 84 10" class="rf-lane"/>
      <path d="M 16 90 L 84 90 Q 90 90 90 84 L 90 16" class="rf-lane"/>
      <path d="M 16 84 L 84 16" class="rf-lane"/>
      <circle cx="9" cy="91" r="6" class="rf-base ours"/>
      <circle cx="91" cy="9" r="6" class="rf-base enemy"/>
    </svg>
    ${pins}
    <span class="rside ours">us</span>
    <span class="rside enemy">them</span>`;
  m.querySelectorAll("[data-ecid]").forEach(b =>
    b.addEventListener("click", e => { e.stopPropagation(); openRiftPop(+b.dataset.ecid, b); }));
  m.querySelectorAll("[data-add-enemy]").forEach(b =>
    b.addEventListener("click", () => { const inp = $("#enemyInput"); if (inp) inp.focus(); }));
  wireRiftDrag(m);
