// --- draft card ------------------------------------------------------------
// The draft tool IS the rift card: picks live on the map (enemy pins open a
// lane/remove popover), bans sit in a compact strip below it, and the two
// inputs stay for fast entry during a timed ban phase.
function renderDraft() {
  const el = $("#riftCard");
  if (!el) return;
  el.hidden = !draftMode;
  document.body.classList.toggle("roles-locked", rolesLocked());
  if (!draftMode) return;
  const bans = [...effBans()], enemy = [...effEnemy()];
  const banChip = cid => {
    const live = liveBans.has(cid);
    return `<span class="dchip dchip-ban bchip" title="${champName(cid)}${live ? " — from live sync" : ""}">
      <img src="${champIcon(cid)}" alt="${champName(cid)}">
      ${manualBans.has(cid) && !live ? `<button data-remove="ban:${cid}" aria-label="remove ban ${champName(cid)}">✕</button>` : ""}
    </span>`;
  };
  const anyGuess = enemy.length && [...enemyLaneMap().values()].some(a => !a.locked);
  el.innerHTML = `
    <h2>Summoner's Rift
      <span class="draft-state"><span class="live-dot" id="liveDot"></span><span id="liveMsg"></span></span>
      <button class="btn toggle ${fearless ? "active" : ""}" id="fearlessBtn"
        title="Fearless session: champs we already played in finished flex games can't be picked again. Turning it on also counts games from the past 3 hours, so a session started at game two still knows about game one.">Fearless</button>
      <button class="btn toggle ${lockRoles ? "active" : ""}" id="roleLockBtn"
        title="We're playing these roles: bans and enemy picks only re-pick champions — nothing reshuffles who plays where. Drag a pin to reassign a role by hand.">Lock roles</button>
      ${manualBans.size || manualEnemy.size || allyLock.size
        ? `<button class="btn toggle" id="draftClear" title="Remove all manually entered bans, enemy picks, and pick locks">Clear</button>` : ""}
    </h2>
    <div class="rift" id="riftMap"></div>
    <div class="draft-row">
      <span class="dlabel">Bans</span>
      ${bans.map(banChip).join("")}
      <input class="dinput" id="banInput" list="champdl" aria-label="Add ban" placeholder="add ban…">
    </div>
    <div class="draft-row">
      <span class="dlabel">Enemy</span>
      <input class="dinput" id="enemyInput" list="champdl" aria-label="Add enemy pick" placeholder="add enemy pick…">
    </div>
    ${fearless ? `<div class="draft-row">
      <span class="dlabel">Played</span>
      ${fearlessPicks.map(p => `<span class="dchip dchip-fear"
          title="${champName(p.championId)} — ${p.riotId.split("#")[0]} already played it this session">
        <img src="${champIcon(p.championId)}" alt="${champName(p.championId)}">
      </span>`).join("")
      || `<span class="hint" style="margin:0">no finished flex games in the session yet</span>`}
    </div>` : ""}
    <div class="hint rift-hint" style="margin-bottom:var(--sp-2)">Tap a blue pin to lock that pick in — re-optimizing picks around it. Drag one onto another lane to swap roles.${anyGuess ? " Dashed enemy pins are lane guesses — tap one to lock its lane or remove it." : ""}</div>
    ${enemy.length && PROFILES
      ? `<div class="hint" style="margin:2px 0 6px">Their comp so far (${enemy.length}/5) — picks get matchup nudges vs whoever might lane against them:</div>` + profileHTML(enemy)
      : `<div class="hint">Banned and enemy-picked champs drop out of candidates and the optimizer. Run <code>python3 lcu_bridge.py</code> next to the League client to sync this automatically.</div>`}
  `;
  renderRift();
  updateLiveIndicator();
  const resolve = v => CHAMP_BY_NAME[v.trim().toLowerCase()] ?? null;
  // commit on change AND on Enter — during a timed ban phase the input has to
  // land without hunting for somewhere to click to blur
  const wire = (sel, add) => {
    const inp = el.querySelector(sel);
    const commit = () => {
      const cid = resolve(inp.value);
      if (cid == null) return;
      add(cid);
      inp.value = "";
      draftChanged();
      el.querySelector(sel).focus();
    };
    inp.addEventListener("change", commit);
    inp.addEventListener("keydown", e => { if (e.key === "Enter") commit(); });
  };
  wire("#banInput", cid => manualBans.add(cid));
  wire("#enemyInput", cid => {
    manualEnemy.add(cid);
    ensureEnemyCounters(cid);
  });
  el.querySelector("#fearlessBtn").addEventListener("click", () => {
    fearless = !fearless;
    localStorage.setItem("fearless", fearless ? "1" : "0");
    if (fearless) {
      // The lookback is what lets the toggle come on mid-session: game one is
      // already in match history, so it's counted even though nobody had
      // fearless on while it was played.
      fearlessSince = Math.floor(Date.now() / 1000) - FEARLESS_LOOKBACK_S;
      localStorage.setItem("fearlessSince", fearlessSince);
      fetchFearless();
    } else {
      fearlessSince = 0;
      fearlessPicks = [];
      fearlessChamps = new Set();
      localStorage.removeItem("fearlessSince");
      localStorage.removeItem("fearlessPicks");
    }
    draftChanged();
  });
  el.querySelector("#roleLockBtn").addEventListener("click", () => {
    lockRoles = !lockRoles;
    localStorage.setItem("lockRoles", lockRoles ? "1" : "0");
    draftChanged();  // re-optimize under the new regime + repaint the toggle
  });
  const clr = el.querySelector("#draftClear");
  if (clr) clr.addEventListener("click", () => {
    manualBans.clear();
    manualEnemy.clear();
    counterAvoid.clear();
    counterDismissed.clear();
    allyLock.clear();
    for (const cid of [...enemyRole.keys()]) if (!liveEnemy.has(cid)) enemyRole.delete(cid);
    draftChanged();
  });
  el.querySelectorAll("[data-remove]").forEach(b => b.addEventListener("click", () => {
    const [kind, cid] = b.dataset.remove.split(":");
    (kind === "ban" ? manualBans : manualEnemy).delete(+cid);
    draftChanged();
  }));
}

function updateLiveIndicator() {
  const dot = $("#liveDot"), msg = $("#liveMsg");
  if (!dot) return;
  const wsUp = draftWS && draftWS.readyState === WebSocket.OPEN;
  // The bridge heartbeats every 25s during champ select, so an active draft
  // with an old timestamp means the bridge stopped — the socket being up says
  // nothing about whether anyone is still feeding it.
  const fresh = Date.now() - (liveDraft.ts || 0) < 80e3;
  const from = liveDraft.owner ? `live from ${liveDraft.owner}` : "live from client";
  if (!liveMode) { dot.className = "live-dot"; msg.textContent = "manual entry (no live worker)"; }
  else if (wsUp && liveDraft.active && fresh) { dot.className = "live-dot on"; msg.textContent = from; }
  else if (wsUp && liveDraft.active) {
    dot.className = "live-dot"; msg.textContent = "bridge stopped — picks may be stale";
  }
  else if (wsUp) { dot.className = "live-dot on"; msg.textContent = "connected — no champ select"; }
  else if (liveDraft.active && Date.now() - liveDraft.ts < 70e3) {
    dot.className = "live-dot"; msg.textContent = "live (reconnecting…)";
  } else { dot.className = "live-dot"; msg.textContent = "reconnecting — manual entry works"; }
}

// --- rift map --------------------------------------------------------------
// Something to get hyped about while the draft unfolds: our comp standing on
// the blue side of the Rift, theirs filling in on red. Enemy lanes come from
// the chip lock when set, otherwise the same laneDist guesses the scorer
// uses. Anchor coords are % of a 100×100 map, y down (blue base bottom-left).
const RIFT_POS = {
  ours:  { TOP: [10, 26], JUNGLE: [24, 44], MIDDLE: [38, 62], BOTTOM: [70, 90], UTILITY: [48, 90] },
  enemy: { TOP: [26, 10], JUNGLE: [44, 24], MIDDLE: [62, 38], BOTTOM: [90, 70], UTILITY: [90, 48] },
};

// One lane per enemy pick: chip locks first, then a greedy pass over lane
// weights (highest confidence claims its lane first), then any lane still
// free for picks with no meta signal at all — every pick lands somewhere.
function enemyLaneMap() {
  const out = new Map(), taken = new Set();
  const picks = [...effEnemy()];
  for (const cid of picks) {
    const r = enemyRole.get(cid);
    if (r && !taken.has(r)) { out.set(cid, { role: r, locked: true }); taken.add(r); }
  }
  const rest = picks.filter(c => !out.has(c));
  const scored = [];
  for (const cid of rest)
    for (const [r, w] of Object.entries(laneDist(cid))) scored.push({ cid, r, w });
  scored.sort((a, b) => b.w - a.w);
  for (const s of scored)
    if (!out.has(s.cid) && !taken.has(s.r)) { out.set(s.cid, { role: s.r, w: s.w }); taken.add(s.r); }
  for (const cid of rest) {
    if (out.has(cid)) continue;
    const free = ROLES.find(r => !taken.has(r));
    if (!free) break;
    out.set(cid, { role: free, w: 0 });
    taken.add(free);
  }
  return out;
}

// Map only — renderDraft owns the card scaffold around it. Enemy pins are
// buttons that open the lane/remove popover; empty enemy pins focus the
// add-pick input.
function renderRift() {
  const m = $("#riftMap");
  if (!m || !draftMode) return;
  const enemyByRole = {};
  for (const [cid, a] of enemyLaneMap()) enemyByRole[a.role] = { cid, ...a };
  const pins = ROLES.map((role, i) => {
    const s = slots[i];
    const [ox, oy] = RIFT_POS.ours[role];
    const who = s.player ? s.player.split("#")[0] : "";
    const sup = role === "UTILITY" ? " rsup" : "";
    const lockedHere = allyLocked(role, s.champ);
    const tail = lockedHere
      ? " — locked in, re-optimizing keeps it (tap to unlock)"
      : s.champ ? " — tap to lock, drag to swap roles"
      : s.player ? " — not picked yet, tap to choose" : " — not picked yet";
    const ourTip = `${s.champ ? champName(s.champ) + " · " : ""}${ROLE_LABEL[role]}${who ? " · " + who : ""}${tail}`;
    const our = s.champ
      ? `<div class="rpin ours${lockedHere ? " locked" : ""}${sup}" data-drag-slot="${i}" style="left:${ox}%;top:${oy}%" data-tip="${ourTip}">
          <img src="${champIcon(s.champ)}" alt="">
          ${lockedHere ? `<span class="rlock">${LOCK_ICON}</span>` : ""}
          <span class="rname">${champName(s.champ)}${who ? `<span class="rp">${who}</span>` : ""}</span>
        </div>`
      : `<div class="rpin rpin-empty ours${sup}" data-drag-slot="${i}" style="left:${ox}%;top:${oy}%" data-tip="${ourTip}">
          ${ROLE_ICON[role]}${who ? `<span class="rname"><span class="rp">${who}</span></span>` : ""}
        </div>`;
    const [ex, ey] = RIFT_POS.enemy[role];
    const e = enemyByRole[role];
    const guess = e && !e.locked;
    const enemyPin = e
      ? `<button type="button" class="rpin enemy${guess ? " guess" : ""}${sup}" data-ecid="${e.cid}" style="left:${ex}%;top:${ey}%"
          data-tip="${champName(e.cid)} · ${ROLE_LABEL[role]}${e.locked ? "" : e.w ? ` (guess ${Math.round(e.w * 100)}%)` : " (guess)"}"
          aria-label="${champName(e.cid)}, ${ROLE_LABEL[role]} — set lane or remove">
          <img src="${champIcon(e.cid)}" alt="">
          <span class="rname">${champName(e.cid)}</span>
        </button>`
      : `<button type="button" class="rpin rpin-empty enemy" data-add-enemy style="left:${ex}%;top:${ey}%"
          data-tip="${ROLE_LABEL[role]} — add enemy pick" aria-label="add enemy pick">${ROLE_ICON[role]}</button>`;
    return our + enemyPin;
  }).join("");
  m.innerHTML = `
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <rect x="1" y="1" width="98" height="98" rx="8" class="rf-ground"/>
      <polygon points="1,1 1,99 99,99" class="rf-side ours"/>
      <polygon points="1,1 99,1 99,99" class="rf-side enemy"/>
      <line x1="17" y1="17" x2="83" y2="83" class="rf-river"/>
      <circle cx="35" cy="35" r="3" class="rf-pit"/>
      <circle cx="65" cy="65" r="3" class="rf-pit"/>
      <path d="M 10 84 L 10 16 Q 10 10 16 10 L 84 10" class="rf-lane"/>
      <path d="M 16 90 L 84 90 Q 90 90 90 84 L 90 16" class="rf-lane"/>
      <path d="M 16 84 L 84 16" class="rf-lane"/>
      <circle cx="9" cy="91" r="6" class="rf-base ours"/>
      <circle cx="91" cy="9" r="6" class="rf-base enemy"/>
    </svg>
    ${pins}
    <span class="rside ours">us</span>
    <span class="rside enemy">them</span>`;
  m.querySelectorAll("[data-ecid]").forEach(b =>
    b.addEventListener("click", e => { e.stopPropagation(); openRiftPop(+b.dataset.ecid, b); }));
  m.querySelectorAll("[data-add-enemy]").forEach(b =>
    b.addEventListener("click", () => { const inp = $("#enemyInput"); if (inp) inp.focus(); }));
  wireRiftDrag(m);
}

// Dragging a blue pin onto another lane anchor swaps the two slots wholesale
// (player AND champ travel together) and the role board below follows.
// Pointer events, not HTML5 drag — that API never fires on iPad touches.
function wireRiftDrag(m) {
  const anchors = ROLES.map(r => ({ r, x: RIFT_POS.ours[r][0], y: RIFT_POS.ours[r][1] }));
  m.querySelectorAll("[data-drag-slot]").forEach(pin => {
    pin.addEventListener("pointerdown", e => {
      const src = +pin.dataset.dragSlot;
      if (e.button || (!slots[src].player && !slots[src].champ)) return;
      e.preventDefault();
      // capture keeps a fast touch-drag glued to the pin; the listeners live
      // on window regardless, so a failed capture only costs smoothness
      try { pin.setPointerCapture(e.pointerId); } catch { /* ignore */ }
      pin.classList.add("dragging");
      const rect = m.getBoundingClientRect();
      let target = null, moved = false;
      const onMove = ev => {
        if (ev.pointerId !== e.pointerId) return;
        // A few pixels of finger jitter is a tap, not a drag — and a tap now
        // opens the lock popover, so the pin must not chase sub-threshold
        // movement and then snap back.
        if (!moved && Math.hypot(ev.clientX - e.clientX, ev.clientY - e.clientY) <= 4) return;
        const x = (ev.clientX - rect.left) / rect.width * 100;
        const y = (ev.clientY - rect.top) / rect.height * 100;
        moved = true;
        pin.style.left = x + "%";
        pin.style.top = y + "%";
        let best = null, bd = Infinity;
        for (const a of anchors) {
          const d = Math.hypot(a.x - x, a.y - y);
          if (d < bd) { bd = d; best = a; }
        }
        target = bd <= 20 ? ROLES.indexOf(best.r) : null;
        m.querySelectorAll(".drop-target").forEach(t => t.classList.remove("drop-target"));
        if (target != null && target !== src) {
          const t = m.querySelector(`[data-drag-slot="${target}"]`);
          if (t) t.classList.add("drop-target");
        }
      };
      const unbind = () => {
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        window.removeEventListener("pointercancel", onCancel);
      };
      // a cancelled gesture (OS grabbed the touch mid-drag) must never
      // commit — only an explicit release over an anchor swaps roles
      const onCancel = ev => {
        if (ev.pointerId !== e.pointerId) return;
        unbind();
        renderRift();  // snap back
      };
      const onUp = ev => {
        if (ev.pointerId !== e.pointerId) return;
        unbind();
        if (moved && target != null && target !== src) {
          [slots[src], slots[target]] = [slots[target], slots[src]];
          // Locks travel with the pins they belong to — a swap moves the whole
          // pairing, so leaving the lock on the old role would pin a champion
          // to a lane nobody is playing it in.
          const [ra, rb] = [ROLES[src], ROLES[target]];
          const [la, lb] = [allyLock.get(ra), allyLock.get(rb)];
          allyLock.delete(ra); allyLock.delete(rb);
          if (lb != null) allyLock.set(ra, lb);
          if (la != null) allyLock.set(rb, la);
          autoSwapNote = null;  // the user is steering again
          rankedTabs.assigned = null;  // role assignment changed — stale
          if (activeTab === "assigned") switchTab("assigned");
          candCache = {};  // locks moved — so did what the others may pick
          renderSlots(); renderScore();
        } else {
          renderRift();  // snap back
          if (!moved) openAllyPop(src);
        }
      };
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      window.addEventListener("pointercancel", onCancel);
    });
  });
}

// Anchor a popover at a pin, opening toward the map's centre so it never
// clips the edge. Shared by both sides' pins.
function riftPop(pinEl) {
  const pop = document.createElement("div");
  pop.className = "rift-pop";
  const x = parseFloat(pinEl.style.left), y = parseFloat(pinEl.style.top);
  pop.style.left = x + "%";
  pop.style.top = y + "%";
  pop.style.transform = `translate(${x > 50 ? "calc(-100% + 17px)" : "-17px"}, ${y > 50 ? "calc(-100% - 26px)" : "26px"})`;
  return pop;
}

// Tapping one of our own pins (as opposed to dragging it, which swaps roles):
// lock the pick so re-optimization leaves it alone, or jump to the slot to
// change it. This is the manual counterpart to the client's own lock-in.
function openAllyPop(i) {
  const m = $("#riftMap");
  if (!m) return;
  m.querySelectorAll(".rift-pop").forEach(p => p.remove());
  const pinEl = m.querySelector(`[data-drag-slot="${i}"]`);
  if (!pinEl) return;
  const role = ROLES[i], s = slots[i];
  const fromClient = liveLocked(role, s.champ);
  const locked = allyLock.has(role) || fromClient;
  const who = s.player ? s.player.split("#")[0] : ROLE_LABEL[role];
  const pop = riftPop(pinEl);
  pop.innerHTML = s.champ
    ? `<b>${champName(s.champ)}${fromClient ? ` <span class="rlive">live</span>` : ""}</b>
       <span class="hint" style="margin:0">${who} · ${ROLE_LABEL[role]}</span>
       ${fromClient
         ? `<span class="hint" style="margin:0">locked in the client — re-optimizing keeps it</span>`
         : `<button type="button" class="btn toggle${locked ? " active" : ""}" data-ally-lock>${
             locked ? LOCK_ICON + " Locked in" : "Lock this pick"}</button>`}
       <button type="button" class="btn toggle" data-ally-edit>Change pick</button>`
    : `<b>${who} · ${ROLE_LABEL[role]}</b>
       <span class="hint" style="margin:0">no pick yet</span>
       <button type="button" class="btn toggle" data-ally-edit>Choose champion</button>`;
  m.appendChild(pop);
  const lk = pop.querySelector("[data-ally-lock]");
  if (lk) lk.addEventListener("click", () => {
    if (locked) allyLock.delete(role); else allyLock.set(role, s.champ);
    draftChanged();  // repaints the map, which disposes of this popover
  });
  pop.querySelector("[data-ally-edit]").addEventListener("click", () => {
    pop.remove();
    const sel = document.querySelector(`#slots select[data-slot="${i}"][data-kind="champ"]`);
    if (!sel) return;
    sel.scrollIntoView({ block: "center", behavior: "smooth" });
    sel.focus();
  });
  const close = ev => {
    if (!pop.contains(ev.target)) { pop.remove(); document.removeEventListener("click", close); }
  };
  setTimeout(() => document.addEventListener("click", close), 0);
}

// The old enemy chip's controls, relocated onto the pin: lane lock (with the
// same "auto" distribution label) and removal for manually entered picks.
function openRiftPop(cid, pinEl) {
  const m = $("#riftMap");
  if (!m) return;
  m.querySelectorAll(".rift-pop").forEach(p => p.remove());
  // effective distribution (after other picks' lane claims) unless the
  // user locked a lane — then the raw guess labels the "auto" option
  const guess = Object.entries(enemyRole.get(cid) ? laneDist(cid, true) : laneDist(cid))
    .sort((a, b) => b[1] - a[1]);
  const auto = guess.length
    ? `auto — ${guess.slice(0, 2).map(([r, w]) => `${ROLE_LABEL[r]} ${Math.round(w * 100)}%`).join(" / ")}`
    : "lane?";
  const live = liveEnemy.has(cid);
  const pop = riftPop(pinEl);
  pop.innerHTML = `
    <b>${champName(cid)}${live ? ` <span class="rlive">live</span>` : ""}</b>
    <select data-erole aria-label="${champName(cid)} lane" title="their lane — a flexible pick splits its matchup weight across likely lanes until you lock one">
      <option value="">${auto}</option>
      ${ROLES.map(r => `<option value="${r}" ${enemyRole.get(cid) === r ? "selected" : ""}>${ROLE_LABEL[r]}</option>`).join("")}
    </select>
    ${manualEnemy.has(cid) && !live ? `<button type="button" class="btn toggle" data-pop-remove>Remove pick</button>` : ""}`;
  m.appendChild(pop);
  pop.querySelector("[data-erole]").addEventListener("change", e => {
    enemyRole.set(cid, e.target.value || null);
    ensureEnemyCounters(cid);
    draftChanged();
  });
  const rm = pop.querySelector("[data-pop-remove]");
  if (rm) rm.addEventListener("click", () => {
    manualEnemy.delete(cid);
    draftChanged();
  });
  const close = ev => {
    if (!pop.contains(ev.target)) { pop.remove(); document.removeEventListener("click", close); }
  };
  setTimeout(() => document.addEventListener("click", close), 0);
}

// A slotted champ just got banned or enemy-picked: swap in the best still-
// available candidate for that player+role instead of leaving a dead board.
// Judged by full comp score when the board is complete (synergy counts), by
// slot score otherwise. Returns swap descriptions, or null if nothing died.
function autoReplaceDead() {
  if (!draftMode) return null;
  const swaps = [];
  for (let i = 0; i < 5; i++) {
    const s = slots[i];
    if (!s.player || !s.champ) continue;
    if (!draftUnavailable(s.champ) && !counterAvoid.has(s.champ)) continue;
    // dead but hand-locked: the user's pick is not ours to swap — the slot
    // note says why it's dead, they decide when to give it up
    if (allyLock.get(ROLES[i]) === s.champ) continue;
    const used = new Set(slots.map(x => x.champ));
    const cands = candidates(s.player, ROLES[i], 15).filter(c => !used.has(c));
    if (!cands.length) continue;
    const full = slots.every((x, j) => x.player && (j === i || x.champ));
    let best = cands[0];
    if (full) {
      let bestT = -Infinity;
      for (const c of cands) {
        const trial = slots.map((x, j) => ({ player: x.player, champ: j === i ? c : x.champ, role: ROLES[j] }));
        const t = compScore(trial).total;
        if (t > bestT) { bestT = t; best = c; }
      }
    }
    swaps.push(`${champName(s.champ)} → ${champName(best)}`);
    slots[i].champ = best;
  }
  return swaps.length ? swaps : null;
}

// While a draft is underway, every ban and pick re-runs the full role-
// agnostic optimizer over the checked squad — champs our team has locked, in
// the client or by hand, are pinned, everything else stays fluid. Returns
// false when it can't run (no live draft, pool too small) so the cheaper
// keep-roles dead-pick swap can take over.
// What the optimizers may not touch: champs our side has locked, by hand or
// in the client. Every entry point to a search goes through this — the
// automatic re-optimize on a ban and both Optimize buttons — so a lock can
// never be quietly overwritten by the path the user happened to take.
function lockPins() {
  const fixed = {}, pinPlayer = {};
  if (!draftMode) return { fixed, pinPlayer };
  for (const [role, cid] of allyLock) {
    fixed[role] = cid;
    const p = slots[ROLES.indexOf(role)].player;
    if (p) pinPlayer[role] = p;  // the lock is on the pairing, not the lane
  }
  // The client knows what's actually locked in champ select, but a hand lock
  // that differs from it is the user deliberately exploring "what if we
  // played X here" — the board is a sandbox, so the hand lock wins and the
  // client champ only fills lanes nobody has touched.
  for (const p of liveOurs) if (ROLES.includes(p.position)) {
    if (p.championId && !allyLock.has(p.position)) fixed[p.position] = p.championId;
    // Recognized from their Riot ID: pin them to this lane too, so the
    // search stops treating "who plays what" as open — role assignments are
    // known from the moment champ select opens, before anyone picks a
    // champion. A hand lock (set above) is a deliberate override and wins
    // if present.
    if (!pinPlayer[p.position]) {
      const rid = riotIdForLive(p.riotId);
      if (rid) pinPlayer[p.position] = rid;
    }
  }
  return { fixed, pinPlayer };
}

function autoOptimize(deadNames) {
  if (!draftMode) return false;
  if (!liveDraft.active && !effBans().size && !effEnemy().size && !effFearless().size) return false;
  if (D.players.filter(p => included[p.riotId]).length < 5) return false;
  const { fixed, pinPlayer } = lockPins();
  // Roles locked: search champions only, players stay in their lanes. An
  // incomplete board falls through to autoReplaceDead, which is also
  // role-preserving.
  const res = rolesLocked() ? (optimizeChamps(10, fixed) || []) : optimize(10, fixed, pinPlayer);
  if (!res.length) return false;
  const before = slots.map(s => s.player + "|" + s.champ).join();
  const hadChamps = slots.some(s => s.champ);
  res[0].assign.forEach((a, i) => { slots[i] = { player: a.player, champ: a.champ }; });
  // locked results are champs-for-these-roles — they belong in that tab, not
  // under "Best overall", which promises a role-agnostic search
  rankedTabs[rolesLocked() ? "assigned" : "overall"] = res;
  if (hadChamps && slots.map(s => s.player + "|" + s.champ).join() !== before)
    autoSwapNote = (deadNames.length
      ? `re-optimized — ${deadNames.join(", ")} no longer available`
      : "re-optimized for the draft") + (lockRoles ? " (roles locked)" : "");
  return true;
}

// Draft state changed: matchup + candidate caches are stale; re-rank any
// results the user is currently looking at.
function draftChanged(rerenderCard = true) {
  dAdjCache = {};
  candCache = {};
  // A hand-locked pick stays put even when it gets banned, taken, or
  // fearless-spent: the user put it there to look at it, and yanking it on
  // the next passive event (a live heartbeat, a ban landing) made comparing
  // champs impossible. The slot note and verdict banner flag it; an explicit
  // Optimize click is what releases it (see releaseDeadLocks). counterAvoid
  // is different — the user already agreed to draft around that champ.
  for (const [role, cid] of [...allyLock])
    if (counterAvoid.has(cid)) allyLock.delete(role);
  const dead = slots.flatMap((s, i) => {
    if (!s.champ || allyLock.get(ROLES[i]) === s.champ) return [];
    if (draftUnavailable(s.champ)) return [champName(s.champ)];
    if (counterAvoid.has(s.champ)) return [champName(s.champ) + " (hard-countered)"];
    return [];
  });
  const had = { assigned: !!rankedTabs.assigned, overall: !!rankedTabs.overall, worst: !!rankedTabs.worst };
  rankedTabs.assigned = rankedTabs.overall = rankedTabs.worst = null;
  if (autoOptimize(dead)) {
    // fresh results are worth showing — in whichever tab they landed
    if (rolesLocked()) { had.assigned = true; activeTab = "assigned"; }
    else had.overall = true;
  } else {
    const swaps = autoReplaceDead();
    if (swaps) autoSwapNote = `auto-swapped ${swaps.join(", ")} — pick was banned, taken, or hard-countered`;
  }
  if (rerenderCard) renderDraft();
  renderSlots();
  renderScore();
  // a live update can land while a data page is showing — the builder's tab
  // strip isn't rendered there, and the stale caches re-fill on return
  if (page === "builder" && had[activeTab]) switchTab(activeTab);
}

// Match a live teammate to one of our tracked players by Riot ID (case-
// insensitive — the client's casing isn't guaranteed to match the roster's)
// — lets a live draft identify *who* is in a lane, not just what's picked.
function riotIdForLive(riotId) {
  if (!riotId) return null;
  const key = riotId.toLowerCase();
  const p = D.players.find(p => p.riotId.toLowerCase() === key);
  return p ? p.riotId : null;
}

function applyLiveDraft(j) {
  if (!j || !j.ts || j.ts === liveDraft.ts) { updateLiveIndicator(); return; }
  const wasActive = liveDraft.active;
  liveDraft = j;
  liveBans = new Set(j.active ? j.bans || [] : []);
  liveEnemy = new Set(j.active ? j.enemy || [] : []);
  liveOurs = j.active ? j.ours || [] : [];
  if (!j.active) {
    counterAvoid.clear(); counterDismissed.clear();  // per-draft decisions
    // Ally locks belong to the draft that just ended — but a bridge heartbeat
    // arriving mid-manual-draft is not the end of anything, so only a draft
    // going active → inactive clears them.
    if (wasActive) {
      allyLock.clear();
      // The squad checklist was narrowed to this game's roster below — a
      // benched teammate shouldn't stay excluded once there's no live game
      // to exclude them from.
      for (const p of D.players) setIncluded(p.riotId, true);
    }
  }
  for (const cid of liveEnemy) ensureEnemyCounters(cid);
  if (j.active) {
    // A champ select opening is the moment fearless most needs fresh data:
    // the previous game ended minutes ago and is in match history by now.
    if (!wasActive) fetchFearless();
    const recognized = liveOurs.map(p => riotIdForLive(p.riotId)).filter(Boolean);
    for (const rid of recognized) ensureIncluded([rid]);
    // A full known 5-stack tells us exactly who's playing this game — a
    // tracked player who isn't one of them (benched, playing on an alt,
    // whatever) shouldn't still be offered as a candidate for an open slot.
    // Partial recognition (a non-tracked sub in the lobby) can't safely
    // narrow the pool below 5, so it's left as ensureIncluded left it.
    if (new Set(recognized).size === 5) {
      const playing = new Set(recognized);
      for (const p of D.players) setIncluded(p.riotId, playing.has(p.riotId));
    }
    // Reflect our own locked picks on the board: fill the matching role's
    // champ, but never clobber a champ the user chose themselves — only
    // empty slots and slots this sync wrote earlier follow the client.
    for (const p of liveOurs) {
      const i = ROLES.indexOf(p.position);
      if (i < 0 || !p.championId) continue;
      // A hand lock the client confirmed is spent — leaving it would
      // resurrect an old pick if the feed stops reporting. A hand lock on a
      // DIFFERENT champ is the user exploring an alternative; it stays
      // (lockPins gives it precedence over the client champ too).
      if (allyLock.get(p.position) === p.championId) allyLock.delete(p.position);
      const cur = slots[i].champ;
      if (cur == null || cur === liveOursByRole[p.position] || cur === p.championId) {
        slots[i].champ = p.championId;
        liveOursByRole[p.position] = p.championId;
      }
    }
  }
  draftChanged();
}

// Primary transport: a WebSocket to the DraftHub Durable Object — it sends
// the current state on connect and pushes every bridge update instantly.
// While the socket is down we fall back to polling so drafts stay usable.
let draftWS = null, draftWSTimer = null, draftBackoff = 1000;
let draftPingTimer = null, draftPollTimer = null, liveTickTimer = null;

async function pollDraft() {
  try { applyLiveDraft(await fetch(WORKER_URL + "/draft").then(r => r.json())); }
  catch { /* worker hiccup — the indicator just goes stale */ }
}

function connectDraftWS() {
  const ws = new WebSocket(WORKER_URL.replace(/^http/, "ws") + "/draft/ws");
  draftWS = ws;
  ws.onopen = () => {
    if (draftWS !== ws) return;
    draftBackoff = 1000;
    clearInterval(draftPollTimer); draftPollTimer = null;
    clearInterval(draftPingTimer);
    draftPingTimer = setInterval(() => ws.send("ping"), 30000);
    updateLiveIndicator();
  };
  ws.onmessage = e => {
    if (e.data === "pong") return;
    try { applyLiveDraft(JSON.parse(e.data)); } catch {}
  };
  ws.onclose = ws.onerror = () => {
    if (draftWS !== ws) return;  // superseded by a newer socket
    draftWS = null;
    clearInterval(draftPingTimer);
    updateLiveIndicator();
    if (!draftMode) return;
    if (!draftPollTimer) { pollDraft(); draftPollTimer = setInterval(pollDraft, 3000); }
    clearTimeout(draftWSTimer);
    draftWSTimer = setTimeout(connectDraftWS, draftBackoff);
    draftBackoff = Math.min(draftBackoff * 2, 15000);
  };
}

function setDraftLive(on) {
  clearTimeout(draftWSTimer);
  clearInterval(draftPollTimer); draftPollTimer = null;
  clearInterval(draftPingTimer);
  clearInterval(liveTickTimer); liveTickTimer = null;
  if (draftWS) { const ws = draftWS; draftWS = null; ws.close(); }
  if (on && liveMode) {
    connectDraftWS();
    // Nothing arrives when a bridge dies, so the indicator needs its own tick
    // to notice the draft has gone stale.
    liveTickTimer = setInterval(updateLiveIndicator, 10000);
  }
}

// iPads are the main way people watch a draft they aren't piloting, and iOS
// suspends a backgrounded tab: the socket dies silently and the reconnect
// backoff can leave the page up to 15s stale after the screen wakes. Waking
// is a certainty here (the draft is the reason they picked the tab back up),
// so re-read the draft immediately and rebuild the socket if it's gone.
document.addEventListener("visibilitychange", () => {
  if (document.hidden || !draftMode || !liveMode) return;
  pollDraft();
  if (!draftWS || draftWS.readyState > WebSocket.OPEN) {
    clearTimeout(draftWSTimer);
    draftBackoff = 1000;
    connectDraftWS();
  }
});

// Pull the fearless session's finished flex games from the worker and rebuild
// the exclusion set. Runs on toggle-on, when a champ select opens, and on a
// slow poll — match-v5 lags a game's end by a minute or two, so any single
// moment can miss; the poll is the backstop.
let fearlessFetching = false;
async function fetchFearless() {
  if (!fearless || !WORKER_URL || fearlessFetching) return;
  fearlessFetching = true;
  try {
    const j = await fetch(`${WORKER_URL}/fearless?since=${fearlessSince}`).then(r => r.json());
    if (Array.isArray(j.games)) {
      const picks = j.games.flatMap(g => g.picks);
      if (JSON.stringify(picks) !== JSON.stringify(fearlessPicks)) {
        fearlessPicks = picks;
        fearlessChamps = new Set(picks.map(p => p.championId));
        localStorage.setItem("fearlessPicks", JSON.stringify(picks));
        draftChanged();
      }
    }
  } catch { /* keep the last-known set; the next poll retries */ }
  fearlessFetching = false;
}
setInterval(() => { if (fearless && draftMode && !document.hidden) fetchFearless(); }, 120e3);

// Sets `included` and keeps the squad checklist checkbox in sync — direct
// state writes elsewhere would leave the visible list stale.
function setIncluded(rid, val) {
  if (included[rid] === val) return;
  included[rid] = val;
  const cb = document.querySelector(`[data-player="${CSS.escape(rid)}"]`);
  if (cb) cb.checked = val;
}

// Slotting a player is an implicit opt-in: re-check them in the squad list
// and refresh anything that depends on the player pool.
function ensureIncluded(rids) {
  let changed = false;
  for (const rid of rids) {
    if (!rid || included[rid]) continue;
    included[rid] = true;
    changed = true;
    const cb = document.querySelector(`[data-player="${CSS.escape(rid)}"]`);
    if (cb) cb.checked = true;
  }
  if (changed) {
    rankedTabs.overall = rankedTabs.worst = null;  // player pool changed — stale
    if (activeTab === "overall" || activeTab === "worst") switchTab(activeTab);
  }
}

// Squad-list warnings: thin game samples, and champs cut by the mastery floor.
function playerNotes(p) {
  const notes = [];
  const deep = p.champions.filter(c => c.games >= MIN_CHAMP_GAMES).length;
  if (deep === 0) notes.push(`no champs with ${MIN_CHAMP_GAMES}+ games`);
  else if (deep < 5) notes.push(`only ${deep} champ${deep > 1 ? "s" : ""} with ${MIN_CHAMP_GAMES}+ games`);
  if (masteryMin || masteryMax < MASTERY_OFF) {
    const m = Object.values(masteryIdx[p.riotId] || {}).filter(inMasteryRange).length;
    if (m === 0) notes.push(`no champs in mastery range`);
    else if (m < 5) notes.push(`only ${m} champ${m > 1 ? "s" : ""} in mastery range`);
  }
  if (minGames || maxGames < MAX_GAMES_OFF) {
    const n = p.champions.filter(c => inGamesRange(c.games)).length;
    if (n === 0) notes.push(`no champs in games range`);
    else if (n < 5) notes.push(`only ${n} champ${n > 1 ? "s" : ""} in games range`);
  }
  // rendered inline on the tag line (fixed row height — see .lowdata note)
  return notes.length ? ` · <span class="lowdata" title="${notes.join("; ")}">${notes.join(" · ")}</span>` : "";
}

function updateSquadNotes() {
  document.querySelectorAll("[data-notes]").forEach(el => {
    const p = D.players.find(x => x.riotId === el.dataset.notes);
    if (p) el.innerHTML = playerNotes(p);
  });
}

function emptyIcon() {
  return `<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2l9.5 6.9-3.6 11.2h-11.8L2.5 8.9z"/><circle cx="12" cy="12.4" r="3.2"/></svg>`;
}

function renderSlots() {
  if (!$("#slots")) return;  // a data page is showing — the board isn't rendered
  $("#slots").innerHTML = ROLES.map((role, i) => {
    const s = slots[i];
    const playerOpts = D.players.map(p =>
      `<option value="${p.riotId}" ${s.player === p.riotId ? "selected" : ""}>${p.riotId.split("#")[0]}</option>`).join("");
    let champOpts = "", stat = "";
    let comfortLine = "";
    if (s.player) {
      const share = playerRoleShare(s.player, role);
      comfortLine = `<div class="cstat dim" style="margin-bottom:6px">plays ${ROLE_LABEL[role].toLowerCase()} ${pct(share)} of games</div>`;
      const p = D.players.find(p => p.riotId === s.player);
      // copy — candidates() returns its cached array, and the unshift below
      // must not leak the hand-picked champ into the cache
      const cands = [...candidates(s.player, role, 15)];
      if (!cands.length && !s.champ)
        comfortLine += `<div class="cstat dim" style="margin-bottom:6px">no champs meet the mastery/games filters</div>`;
      if (s.champ && !cands.includes(s.champ)) cands.unshift(s.champ);
      const opt = cid => `<option value="${cid}" ${s.champ === cid ? "selected" : ""}>${champName(cid)}</option>`;
      const playedThere = cands.filter(cid => {
        const e = p.champions.find(c => c.championId === cid);
        return e && (e.roles[role] || { games: 0 }).games >= 2;
      });
      const metaOnly = cands.filter(cid => !playedThere.includes(cid))
        .slice(0, Math.max(0, 6 - Math.min(playedThere.length, 4)));  // keep the list short
      if (s.champ && !playedThere.includes(s.champ) && !metaOnly.includes(s.champ))
        metaOnly.unshift(s.champ);  // never drop the currently selected champion
      // Everything else the player could reasonably lock: any champ of theirs
      // that passes the mastery/games/draft filters but didn't make the
      // auto-candidate list (off-meta for the lane, or below the score cut).
      const shown = new Set([...playedThere, ...metaOnly]);
      const poolAll = new Map();
      for (const c of p.champions) poolAll.set(c.championId, c);
      for (const m of p.mastery) if (!poolAll.has(m.championId)) poolAll.set(m.championId, null);
      const byScore = (a, b) => slotScore(s.player, b, role) - slotScore(s.player, a, role);
      const extras = [...poolAll.keys()].filter(cid =>
        !shown.has(cid)
        && !draftUnavailable(cid)
        && inMasteryRange((masteryIdx[s.player] || {})[cid] || 0)
        && inGamesRange((poolAll.get(cid) || {}).games || 0));
      // champs cut from the candidate list by its display cap are still
      // meta-viable — group them honestly instead of calling them off-meta
      const cutViable = extras.filter(cid => roleViable(poolAll.get(cid), cid, role)).sort(byScore);
      const offMeta = extras.filter(cid => !roleViable(poolAll.get(cid), cid, role)).sort(byScore);
      champOpts =
        (playedThere.length ? `<optgroup label="Plays this role">${playedThere.map(opt).join("")}</optgroup>` : "") +
        (metaOnly.length + cutViable.length ? `<optgroup label="Meta-viable here">${[...metaOnly, ...cutViable].map(opt).join("")}</optgroup>` : "") +
        (offMeta.length ? `<optgroup label="Off-meta / everything else">${offMeta.map(opt).join("")}</optgroup>` : "");
      if (s.champ) {
        const p = D.players.find(p => p.riotId === s.player);
        const e = p.champions.find(c => c.championId === s.champ);
        // In Role WR mode the score only sees the in-role record, so that
        // becomes the headline number and the all-roles record dims beneath
        // it — otherwise a 52.8% Ekko card can hide the 33% jungle record
        // the score actually used.
        const allRec = e ? `${e.wins}W ${e.games - e.wins}L (${pct(e.wins / e.games)})` : null;
        if (!e) stat = `<span class="dim">no ranked games</span>`;
        else if (strictRole) {
          const rr = e.roles[role] || { games: 0, wins: 0 };
          stat = (rr.games
            ? `${ROLE_LABEL[role].toLowerCase()} ${rr.wins}W ${rr.games - rr.wins}L (${pct(rr.wins / rr.games)})`
            : `<span class="dim">no ${ROLE_LABEL[role].toLowerCase()} games — scored from meta prior + off-role record</span>`)
            + `<br><span class="dim">all roles ${allRec}</span>`;
        } else stat = allRec;
        if (META) stat += `<br><span class="dim">meta ${pct(metaWR(s.champ, role))}</span>`;
        const pts = (masteryIdx[s.player] || {})[s.champ];
        stat += `<br><span class="dim">mastery ${pts ? (pts >= 100000 ? (pts / 1000).toFixed(0) + "k" : pts.toLocaleString()) : "—"}</span>`;
        if (s.player === CS_MIN_PLAYER && e && e.secs)
          stat += `<br><span class="dim">cs/min ${(e.cs / (e.secs / 60)).toFixed(1)}</span>`;
        if (draftUnavailable(s.champ))
          stat += `<br><span class="banned-note">${effBans().has(s.champ) ? "banned!"
            : effEnemy().has(s.champ) ? "enemy took it!" : "already played this session!"}</span>`;
        else {
          const hc = hardCounters(s.champ, role);
          if (hc.length)
            stat += `<br><span class="banned-note">hard-countered by ${hc.map(champName).join(", ")}!</span>`;
        }
        // surface the matchups the score silently includes — the meta win rate
        // of this champ against each enemy pick that might lane here, with the
        // lane odds shown when the enemy pick is flexible
        if (draftMode) {
          for (const ecid of effEnemy()) {
            const w = laneDist(ecid)[role] || 0;
            if (!w) continue;
            // our own champ's counter table backs rare matchups the enemy's
            // table omits — fetch it too (cached; re-renders when it lands)
            ensureCounters(s.champ, role);
            // "vs Shen (top 70%): 50.0% wr" — the odds belong to the lane
            // guess, not the win rate, so keep them attached to the name
            const who = w < 1
              ? `${champName(ecid)} <span class="dim">(${ROLE_LABEL[role].toLowerCase()} ${Math.round(w * 100)}%)</span>`
              : champName(ecid);
            const rec = matchupRec(ecid, s.champ, role);
            if (rec && rec.play >= 20) {
              const wr = 1 - rec.win / rec.play;
              const cls = wr > 0.505 ? "pos" : wr < 0.495 ? "neg" : "dim";
              stat += `<br><span class="dim">vs</span> ${who}<span class="dim">:</span> <span class="${cls}" title="meta lane matchup, ${rec.play} games">${pct(wr)} wr</span>`;
            } else {
              stat += `<br><span class="dim">vs</span> ${who}<span class="dim">: no data</span>`;
            }
          }
        }
        stat += `<br><span class="scorechip">score ${pct(slotScore(s.player, s.champ, role))}</span>`;
      }
    }
    // The lock control only exists while drafting — outside a draft nothing
    // re-optimizes underneath the board, so there is nothing to protect from.
    const fromClient = liveLocked(role, s.champ);
    const isLocked = allyLock.has(role) || fromClient;
    const lockBtn = draftMode && s.champ
      ? `<button type="button" class="btn toggle picklock${isLocked ? " active" : ""}" data-lockslot="${i}"
          ${fromClient ? "disabled" : ""}
          title="${fromClient
            ? "Locked in the League client — the live sync owns this pick"
            : "A locked pick survives re-optimization: bans and enemy picks re-pick around it instead of replacing it"}"
          >${isLocked ? LOCK_ICON + (fromClient ? " Locked (client)" : " Locked in") : "Lock this pick"}</button>`
      : "";
    return `<div class="slot ${s.champ ? "filled" : ""}${isLocked ? " locked" : ""}">
      <h3>${ROLE_ICON[role]}${ROLE_LABEL[role]}</h3>
      <select data-slot="${i}" data-kind="player" aria-label="${ROLE_LABEL[role]} player"><option value="">— player —</option>${playerOpts}</select>
      ${comfortLine}
      <select data-slot="${i}" data-kind="champ" aria-label="${ROLE_LABEL[role]} champion" ${s.player ? "" : "disabled"}><option value="">— champion —</option>${champOpts}</select>
      ${lockBtn}
      ${s.champ
        ? `<div class="portrait-wrap"><img class="portrait" src="${champIcon(s.champ)}" alt="${champName(s.champ)}" title="${champName(s.champ)}"></div>`
        : `<div class="portrait-empty">?</div>`}
      <div class="cstat">${stat}</div>
    </div>`;
  }).join("");
  document.querySelectorAll("#slots select").forEach(sel => sel.addEventListener("change", e => {
    autoSwapNote = null;  // the user is steering again
    const i = +e.target.dataset.slot;
    if (e.target.dataset.kind === "player") {
      slots[i].player = e.target.value || null;
      slots[i].champ = null;
      allyLock.delete(ROLES[i]);  // the lock was on a pairing that no longer exists
      ensureIncluded([slots[i].player]);
    }
    else {
      slots[i].champ = e.target.value ? +e.target.value : null;
      // Choosing a champion by hand mid-draft is the act of locking it: the
      // next ban has to re-optimize around the pick, not delete it.
      if (draftMode && slots[i].champ != null) allyLock.set(ROLES[i], slots[i].champ);
      else allyLock.delete(ROLES[i]);
    }
    rankedTabs.assigned = null;  // role assignment changed — stale
    if (activeTab === "assigned") switchTab("assigned");
    candCache = {};  // a lock changes what the other four may pick
    renderSlots(); renderScore();
  }));
  document.querySelectorAll("#slots [data-lockslot]").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.lockslot, role = ROLES[i];
    if (allyLock.has(role)) allyLock.delete(role);
    else if (slots[i].champ != null) allyLock.set(role, slots[i].champ);
    draftChanged();
  }));
  // the map mirrors the board — slot edits reach here without renderDraft
  renderRift();
}

function renderScore() {
  if (!$("#hero")) return;  // a data page is showing — the score card isn't rendered
  renderProfile();
  const assign = slots.map((s, i) => ({ player: s.player, champ: s.champ, role: ROLES[i] }));
  const ready = assign.every(a => a.player && a.champ)
    && new Set(assign.map(a => a.player)).size === 5
    && new Set(assign.map(a => a.champ)).size === 5;
  const verdictEl = $("#verdict");
  if (!ready) {
    $("#hero").textContent = "–"; $("#meter").style.width = "0%";
    verdictEl.hidden = true;
    $("#breakdown").textContent = "Fill all five slots (distinct players and champions).";
    return;
  }
  const sc = compScore(assign);
  $("#hero").textContent = pct(sc.total);
  $("#meter").style.width = (sc.total * 100) + "%";
  // A banned or enemy-taken champ makes the whole estimate fiction — say so
  // where the user is actually looking instead of only in one slot's fine print.
  const dead = assign.filter(a => draftUnavailable(a.champ));
  const v = dead.length
    ? { label: dead.map(a => champName(a.champ)).join(", ")
        + (effBans().has(dead[0].champ) ? " banned" : effEnemy().has(dead[0].champ)
          ? " taken" : " already played this session") + " — re-optimize", cls: "bad" }
    : verdict(sc.total);
  verdictEl.hidden = false;
  verdictEl.textContent = v.label;
  verdictEl.className = "verdict" + (v.cls ? " " + v.cls : "");
  const synCls = sc.syn >= 0 ? "pos" : "neg";
  // Hard-counter prompts: flag the matchup and let the player decide — never
  // swap their pick out from under them over a counter alone.
  const flagged = assign.flatMap(a => {
    if (counterAvoid.has(a.champ)) return [];
    const hc = hardCounters(a.champ, a.role);
    const key = a.champ + "|" + hc.join(",");
    if (!hc.length || counterDismissed.has(key)) return [];
    return [{ cid: a.champ, key, names: hc.map(champName).join(", ") }];
  });
  $("#breakdown").innerHTML =
    flagged.map(f => `<div class="counter-flag">
      <span class="banned-note">${champName(f.cid)} is hard-countered by ${f.names}</span>
      <button class="btn toggle" data-cswap="${f.cid}">Swap it</button>
      <button class="btn toggle" data-ckeep="${f.key}">Keep</button>
    </div>`).join("") +
    (autoSwapNote
      ? `<b style="color:var(--warning)">${autoSwapNote}</b><br>`
      : "") +
    `Individual baseline: <b>${pct(sc.ind)}</b><span class="info" tabindex="0">i<span class="tip">` +
    `Average of the five slot scores: each player's win rate on their champion in that role ` +
    `(shrunk toward the champ's current-patch meta WR), plus mastery bonus and role comfort, ` +
    `minus off-role penalties. "How good are these five picks in isolation?"</span></span><br>` +
    `Synergy adjustment: <b class="${synCls}">${sc.syn >= 0 ? "▲ +" : "▼ "}${(sc.syn * 100).toFixed(1)}pp</b>` +
    `<span class="info" tabindex="0">i<span class="tip">` +
    `Sum over every champ pair and player duo of how your actual shared-game record deviates ` +
    `from expectation (champ pairs vs their average meta WR, duos vs 50%), shrunk when samples ` +
    `are small. Duo records are role-weighted: games where the pair played these exact roles ` +
    `count fully, their games in other role combos count at ${OFF_ROLE_GAME_WEIGHT}x ` +
    `(0 under "Role WRs only"). The duo sum is also scaled to ${PAIR_OVERLAP_DISCOUNT}x, because the ten ` +
    `pair records in a five-stack largely re-count the same games. ` +
    `Champ pairs are pilot-attributed: only games where these two players played ` +
    `these two champions themselves count. Green: this group overperforms together. Red: you ` +
    `win less together than your individual stats predict. Caveat: pair and individual records ` +
    `come from the same games, so hot streaks inflate both.</span></span>`;
  document.querySelectorAll("[data-cswap]").forEach(b => b.addEventListener("click", () => {
    counterAvoid.add(+b.dataset.cswap);
    candCache = {};
    draftChanged(false);
  }));
  document.querySelectorAll("[data-ckeep]").forEach(b => b.addEventListener("click", () => {
    counterDismissed.add(b.dataset.ckeep);
    renderScore();
  }));
}

// Advisory read on the comp's shape — damage mix, frontline, crowd control —
// from per-champion combat profiles (data/profiles.json). Deliberately NOT
// part of the win-rate estimate: it flags structural risks, it doesn't score.
function renderProfile() {
  const el = $("#profile");
  if (!el || !PROFILES) return;
  const cids = slots.filter(s => s.champ).map(s => s.champ);
  el.innerHTML = cids.length < 5
    ? `<div class="hint">Pick all five champions to see damage mix, frontline, and CC.</div>`
    : profileHTML(cids);
}

// Damage mix / frontline / CC markup for any set of champions — the team
// profile card and the draft card's enemy readout share this.
function profileHTML(cids) {
  const champs = cids.map(c => PROFILES && PROFILES.champions[c]).filter(Boolean);
  if (!champs.length) return "";
  const share = k => champs.reduce((a, c) => a + c[k], 0) / champs.length;
  const phys = share("physShare"), magic = share("magicShare"), tru = Math.max(0, 1 - phys - magic);
  const dmgStatus = phys >= 0.7 ? { label: "Heavy AD", cls: "warn", tip: "easy to counter with armor" }
    : magic >= 0.7 ? { label: "Heavy AP", cls: "warn", tip: "easy to counter with magic resist" }
    : { label: "Mixed", cls: "good", tip: "" };

  const tanks = champs.filter(c => c.tankPct >= 0.75).length;
  const maxTank = Math.max(...champs.map(c => c.tankPct));
  const front = tanks >= 2 ? { label: "Heavy", cls: "good", w: 100 }
    : tanks === 1 ? { label: "Solid", cls: "good", w: 70 }
    : maxTank >= 0.6 ? { label: "Thin", cls: "warn", w: 40 }
    : { label: "None", cls: "bad", w: 15 };

  const ccAvg = champs.reduce((a, c) => a + c.ccPct, 0) / champs.length;
  const cc = ccAvg >= 0.6 ? { label: "High", cls: "good" }
    : ccAvg >= 0.35 ? { label: "Medium", cls: "" }
    : { label: "Low", cls: "warn" };

  const pctLbl = x => Math.round(x * 100) + "%";
  return `
    <div style="display:flex; align-items:center; gap:10px">
      <span class="plabel" style="flex:none; width:74px; font-size:12px; color:var(--text-secondary); font-weight:500">Damage</span>
      <span style="flex:1"></span>
      <span class="pstatus ${dmgStatus.cls}" ${dmgStatus.tip ? `title="${dmgStatus.tip}"` : ""}>${dmgStatus.label}</span>
    </div>
    <div class="stackbar">
      <div class="sPhys" style="width:${phys * 100}%"></div>
      <div class="sMagic" style="width:${magic * 100}%"></div>
      <div class="sTrue" style="width:${tru * 100}%"></div>
    </div>
    <div class="dmglegend">
      <span><span class="dot sPhys" style="background:#e08b3d"></span>Physical ${pctLbl(phys)}</span>
      <span><span class="dot" style="background:#6aa8e8"></span>Magic ${pctLbl(magic)}</span>
      <span><span class="dot" style="background:#cfd8e3"></span>True ${pctLbl(tru)}</span>
    </div>
    <div class="prow">
      <span class="plabel">Frontline</span>
      <span class="pmeter"><div style="width:${front.w}%"></div></span>
      <span class="pstatus ${front.cls}">${front.label}</span>
    </div>
    <div class="prow">
      <span class="plabel">CC</span>
      <span class="pmeter"><div style="width:${ccAvg * 100}%"></div></span>
      <span class="pstatus ${cc.cls}">${cc.label}</span>
    </div>`;
}

// --- profiles (pseudo op.gg) ----------------------------------------------
// Per-player profile pages built from the same dataset the optimizer scores
// with: ranks, queue records, role distribution, champion stats (with meta
// comparison), duo synergy, and — when the data pipeline has produced them —
// KDA numbers and a recent-match feed. Rendered into the profiles page's
// #ranked container; everything is derived from D at render time, so the
// flex-only view and refreshes need no extra invalidation.
let profilePlayer = null;

// Champions-table sort: dir 0 is the dataset's own order (games, high→low);
// clicking a header cycles high→low → low→high → default. Rows without the
// stat sink to the bottom in either direction.
let pfSort = { key: null, dir: 0 };

const QUEUE_NAME = { "420": "Solo/duo", "440": "Flex", "700": "Clash", "710": "Clash" };

function timeAgo(ts) {
  const s = (Date.now() - ts) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  if (s < 7 * 86400) return Math.round(s / 86400) + "d ago";
  return new Date(ts).toLocaleDateString([], { month: "short", day: "numeric" });
}

// "4.1 / 2.9 / 6.0  2.4" — per-game averages plus the ratio. kg counts the
// games the sums cover; on live data merged before the KDA fields existed it
// can trail `games`, so the title says which slice the average is from.
// Single-game rows (recent games, match-history scoreboards) are exact
// counts, not averages — "19.0 deaths" is a decimal pretending to matter.
function kdaHTML(s) {
  if (!s.kg) return `<span class="dim">—</span>`;
  const ratio = ((s.k + s.a) / Math.max(1, s.d)).toFixed(2);
  const partial = s.games && s.kg < s.games ? ` title="KDA from the newest ${s.kg} of ${s.games} games"` : "";
  const avg = v => (v / s.kg).toFixed(s.kg === 1 ? 0 : 1);
  return `<span class="pf-kda"${partial}>${avg(s.k)} <span class="dim">/</span> ${avg(s.d)} <span class="dim">/</span> ${avg(s.a)} <b>${ratio}</b></span>`;
}

function rankLine(p) {
  const out = [];
  for (const q of ["420", "440"]) {
    const r = (p.ranks || {})[q];
    if (!r || !r.tier) continue;
    const apex = APEX.has(r.tier);
    const games = (r.wins || 0) + (r.losses || 0);
    out.push(`${QUEUE_NAME[q]}: <b>${r.tier[0] + r.tier.slice(1).toLowerCase()}${apex ? "" : " " + r.division}</b> · ${r.lp} LP`
      + (games ? ` · ${r.wins}W ${r.losses}L` : ""));
  }
  return out.join("<br>") || `<span class="dim">no rank data</span>`;
}

function renderProfilePane() {
  if (!profilePlayer || !D.players.some(p => p.riotId === profilePlayer))
    profilePlayer = D.players[0].riotId;
  const p = D.players.find(x => x.riotId === profilePlayer);
  const [name, tag] = p.riotId.split("#");

  const chips = D.players.map(x => `<button type="button" class="pf-chip ${x.riotId === profilePlayer ? "active" : ""}" data-pf="${x.riotId}">
      ${avatar(x.riotId)}${x.riotId.split("#")[0]}</button>`).join("");

  // Solo/flex bars show Riot's current-season ladder record (league-v4) —
  // the same numbers the client shows — so they agree with the rank line.
  // Queues without a ladder entry fall back to the tracked-window aggregate.
  const queues = Object.entries(p.queues || {}).sort(([a], [b]) => a - b)
    .map(([qid, s]) => {
      const r = (p.ranks || {})[qid];

        ? { games: r.wins + r.losses, wins: r.wins } : null;

      const tip = seasonal
        ? `Riot's current-season ${QUEUE_NAME[qid] || ""} record — the same numbers the client shows`

      return `<div class="pf-qrow" title="${tip}">

        <span>${rec.wins}W ${rec.games - rec.wins}L</span></div>`;
    }).join("");

  // per-role damage/min, summed from the champ records' role splits. Role
  // records merged live before the fields existed lack them, so rdsecs counts
  // only the seconds the sums cover (kg's honesty rule) — no data, no number.
  const roleDmg = {};
  for (const e of p.champions)
    for (const [r, s] of Object.entries(e.roles || {})) {
      const a = roleDmg[r] ??= { dmg: 0, dsecs: 0 };

  }).join("");

  const mainRole = e => Object.entries(e.roles).sort((a, b) => b[1].games - a[1].games)[0]?.[0];
  // the champ's overall current-patch meta win rate — all pilots, all roles
  const metaOf = e => (META && META.champions[e.championId] || {}).winRate ?? null;
  const champVal = {
    champ: e => champName(e.championId).toLowerCase(),
    games: e => e.games,
    wr: e => e.wins / e.games,
    kda: e => e.kg ? (e.k + e.a) / Math.max(1, e.d) : null,
    csm: e => e.secs ? e.cs / (e.secs / 60) : null,
    dpm: e => e.dsecs ? e.dmg / (e.dsecs / 60) : null,

  let champs = p.champions;
  if (pfSort.dir) {
    const val = champVal[pfSort.key];
    champs = [...champs].sort((a, b) => {
      const va = val(a), vb = val(b);
      if (va == null || vb == null) return (va == null) - (vb == null);
      // names: dir 1 reads A→Z; numbers: dir 1 reads high→low
      return typeof va === "string" ? va.localeCompare(vb) * pfSort.dir
        : (vb - va) * pfSort.dir;

  const metaInfo = `<span class="info" tabindex="0">i<span class="tip">
    The champ's current-patch win rate across the whole meta — everyone piloting it at the

  const champHead = [["champ", "Champ"], ["games", "Games"], ["wr", "Win rate"],
    ["kda", "KDA"], ["csm", "CS/m"], ["dpm", "DPM"], ["meta", "Meta WR"]].map(([k, label]) =>
    `<th class="sortable${pfSort.key === k && pfSort.dir ? " sorted" : ""}" data-sort="${k}"
      title="Click to sort">${label}${pfSort.key === k && pfSort.dir ? (pfSort.dir === 1 ? " ▼" : " ▲") : ""}${k === "meta" ? metaInfo : ""}</th>`).join("");
  const champRows = champs.slice(0, 10).map(e => {
    const wr = e.wins / e.games;
    const role = mainRole(e);
    const mw = metaOf(e);
    const metaCell = mw != null
      ? `<span title="current-patch meta win rate, all roles">${pct(mw)}</span>`
      : `<span class="dim">—</span>`;
    return `<tr>
      <td><span class="pf-champ"><img src="${champIcon(e.championId)}" alt="">${champName(e.championId)}${role && ROLE_ICON[role] ? ROLE_ICON[role] : ""}</span></td>
      <td>${e.games}g</td>
      <td><div class="wr-cell"><b>${pct(wr)}</b><div class="wr-bar"><div style="width:${wr * 100}%"></div></div></div></td>

      <td>${e.secs ? (e.cs / (e.secs / 60)).toFixed(1) : "—"}</td>

  }).join("");
  const moreChamps = Math.max(0, p.champions.length - 10);

  const duos = Object.values(playerPairIdx)
    .filter(s => s.a === p.riotId || s.b === p.riotId)
    .sort((x, y) => y.games - x.games)
    .map(s => {
      const partner = s.a === p.riotId ? s.b : s.a;
      const wr = s.wins / s.games;
      const best = Object.entries(s.roles || {}).filter(([k]) => !k.includes("UNKNOWN"))
        .sort((x, y) => y[1].games - x[1].games)[0];
      let combo = "";
      if (best) {
        const [ra, rb] = best[0].split("|");
        const [mine, theirs] = s.a === p.riotId ? [ra, rb] : [rb, ra];
        combo = `${ROLE_LABEL[mine]} + ${ROLE_LABEL[theirs]} · ${best[1].games}g`;
      }
      const d = wr - 0.5;
      return `<div class="pf-duo">${avatar(partner)}
        <span class="who"><b>${partner.split("#")[0]}</b><span>${s.games} games together${combo ? " · best as " + combo : ""}</span></span>
        <b>${pct(wr)}</b>
        <span class="syn-chip ${d >= 0 ? "pos" : "neg"}">${d >= 0 ? "▲ +" : "▼ "}${(d * 100).toFixed(1)}pp</span>
      </div>`;
    }).join("") || `<div class="hint">no shared games recorded</div>`;

  const recentRows = (p.recent || []).map(g => `<div class="pf-mrow ${g.win ? "win" : "loss"}">
      <span class="res">${g.win ? "W" : "L"}</span>
      <img src="${champIcon(g.champ)}" alt="">
      <span class="mname">${champName(g.champ)}${ROLE_ICON[g.role] || ""}</span>
      ${kdaHTML({ k: g.k, d: g.d, a: g.a, kg: 1 })}
      <span class="dim">${g.secs ? (g.cs / (g.secs / 60)).toFixed(1) + " cs/m · " : ""}${g.dmg && g.secs ? Math.round(g.dmg / (g.secs / 60)) + " dpm · " : ""}${Math.round(g.secs / 60)}min · ${QUEUE_NAME[g.q] || QUEUE_NAME[String(g.q)] || "q" + g.q}</span>
      <span class="when">${timeAgo(g.ts)}</span>
    </div>`).join("");

  // damage/min across every tracked game — dsecs counts only the seconds the
  // damage sums cover (live records merged before the field existed lack it)
  const tDmg = p.champions.reduce((a, c) => a + (c.dmg || 0), 0);
  const tDsecs = p.champions.reduce((a, c) => a + (c.dsecs || 0), 0);
  const dpmLine = tDsecs
    ? `<div class="pf-rankline" title="Damage to champions per minute, averaged over every tracked game${flexOnly ? " (flex only)" : ""}">Damage/min: <b>${Math.round(tDmg / (tDsecs / 60))}</b></div>`
    : "";
  // average Robert score over the player's five-stack games (the score only
  // exists where we hold both full scoreboards — see the impact section)
  const imps = [];
  for (const g of D.stacks || []) {
    if (g.secs < REMAKE_SECS) continue;
    const t = impTotals(g.us);
    for (const r of g.us) if (r.rid === p.riotId) {
      const s = impactScore(r, t, g.secs);

  }
  const impLine = imps.length
    ? `<div class="pf-rankline">Avg Robert score: <b>${(imps.reduce((a, b) => a + b, 0) / imps.length).toFixed(1)}</b><span class="info" tabindex="0">i<span class="tip">
        The per-game Robert score — 0–100, "how much did this stat line look
        like a winner's for the role", 50 = typical — averaged over the
        player's ${imps.length} five-stack game${imps.length === 1 ? "" : "s"}${flexOnly ? " (flex only)" : ""}. Consistently above 50 means the
        games keep running through this player. The FAQ tab explains the

    : "";
  // persistent skill rating from ranking all ten seats of every five-stack
  const rt = robertRatings().by[p.riotId];
  const ratingLine = rt
    ? `<div class="pf-rankline">Robert rating: <b>${(rt.mu - 3 * rt.sigma).toFixed(1)}</b> <span class="dim">(μ ${rt.mu.toFixed(1)} · σ ${rt.sigma.toFixed(2)})</span><span class="info" tabindex="0">i<span class="tip">
        A career rating built on Robert scores, not wins: each of the
        player's ${rt.games} five-stack game${rt.games === 1 ? "" : "s"}${flexOnly ? " (flex only)" : ""} ranks all ten seats by score,
        and the rating moves by how that finish compared to expectation — a
        carried loss still climbs. Shown as μ−3σ, a cautious floor that

        unpacked in the FAQ tab.</span></span></div>`
    : "";

  $("#ranked").innerHTML = `
    <div class="pf-switch">${chips}</div>
    <div class="pf-head">
      ${avatar(p.riotId)}
      <div>
        <div class="pf-name">${name} <span class="tag">#${tag || ""}</span></div>
        <div class="pf-rankline">${rankLine(p)}</div>

      <div class="pf-queues">${queues || `<span class="hint">no ranked games</span>`}</div>
    </div>

    </div>
    <div class="pf-sec" style="margin-top:var(--sp-5)">
      <h4>Recent games${flexOnly ? " (flex only)" : ""}</h4>

    </div>`;
  document.querySelectorAll("[data-pf]").forEach(b => b.addEventListener("click", () => {
    profilePlayer = b.dataset.pf;
    renderProfilePane();
  }));
  document.querySelectorAll("[data-sort]").forEach(th => th.addEventListener("click", e => {
    if (e.target.closest(".info")) return;  // reading the bubble isn't a sort
    const k = th.dataset.sort;
    pfSort = pfSort.key === k
      ? { key: k, dir: pfSort.dir === 1 ? -1 : pfSort.dir === -1 ? 0 : 1 }
      : { key: k, dir: 1 };
