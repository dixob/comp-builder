<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comp Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* Committed dark theme — this is a draft-lobby tool, it lives in the dark. */
  :root {
    color-scheme: dark;
    --page: #0b0f17;
    --surface: #131a24;
    --surface-2: #1a2331;
    --ink-1: #e7edf5;
    --ink-2: #b6c2d2;
    --ink-muted: #9aa7b8;
    --line: #232e3e;
    --line-soft: #1b2432;
    --gold: #e3b13f;
    --gold-soft: #e8c98a;
    --gold-dim: rgba(227, 177, 63, 0.14);
    --good: #4ade80;
    --bad: #f4737e;
    --good-dim: rgba(74, 222, 128, 0.12);
    --bad-dim: rgba(244, 115, 126, 0.12);
    --radius: 14px;
    --display: "Cinzel", "Palatino", serif;
  }
  * { box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(1100px 500px at 70% -10%, rgba(227,177,63,0.07), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(45,120,214,0.05), transparent 55%),
      var(--page);
    color: var(--ink-1);
    min-height: 100vh;
  }
  .shell { max-width: 1280px; margin: 0 auto; padding: 28px 24px 60px; }

  /* ---- header ---- */
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; flex-wrap: wrap; }
  .sigil {
    width: 44px; height: 44px; flex: none;
    display: grid; place-items: center;
    background: linear-gradient(160deg, #1c2534, #10161f);
    border: 1px solid var(--gold); border-radius: 12px;
    box-shadow: 0 0 18px rgba(227,177,63,0.18), inset 0 0 12px rgba(227,177,63,0.08);
  }
  .sigil svg { color: var(--gold); }
  h1 {
    font-family: var(--display);
    font-size: 26px; font-weight: 700; letter-spacing: 0.06em;
    margin: 0; line-height: 1.1;
  }
  .tagline { font-size: 13px; color: var(--ink-muted); margin-top: 2px; }
  .patchbar { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    font-size: 12px; color: var(--ink-2);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 11px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .chip b { color: var(--gold-soft); font-weight: 600; }

  /* ---- layout ---- */
  .layout { display: grid; grid-template-columns: 370px 1fr; gap: 20px; align-items: start; }
  /* grid children default to min-width:auto and refuse to shrink below their
     content, overflowing narrow viewports — let the columns actually shrink */
  .layout > div { min-width: 0; }
  @media (max-width: 940px) { .layout { grid-template-columns: 1fr; } }

  .card {
    background: linear-gradient(180deg, var(--surface), #111823);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px; margin-bottom: 18px;
  }
  h2 {
    font-family: var(--display);
    font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--gold-soft); margin: 0 0 12px;
    display: flex; align-items: center; gap: 10px;
  }
  h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
  .hint { color: var(--ink-muted); font-size: 12.5px; line-height: 1.5; }

  /* ---- players ---- */
  .player {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 10px; border-radius: 10px; cursor: pointer;
    border: 1px solid transparent; transition: background .15s, border-color .15s;
  }
  .player:hover { background: var(--surface-2); border-color: var(--line-soft); }
  .player input {
    accent-color: var(--gold); width: 15px; height: 15px; flex: none; cursor: pointer;
  }
  .avatar {
    width: 34px; height: 34px; flex: none; border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(227,177,63,0.35);
  }
  .player .who { flex: 1; min-width: 0; }
  .player .name { display: block; font-size: 14px; font-weight: 650; letter-spacing: 0.01em;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player .tag { display: block; font-size: 11px; color: var(--ink-muted); }
  .qsplit { flex: none; text-align: right; font-size: 11.5px; line-height: 1.55; color: var(--ink-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .qsplit .q { color: var(--gold-soft); font-weight: 600; font-size: 10px; letter-spacing: 0.08em; }

  /* ---- buttons ---- */
  .btn {
    font: inherit; font-weight: 700; font-size: 14px;
    color: #171004;
    background: linear-gradient(180deg, #efc25d, #d9a32f);
    border: 1px solid #f0cd7e; border-radius: 10px;
    padding: 11px 20px; cursor: pointer;
    box-shadow: 0 2px 10px rgba(227,177,63,0.25), inset 0 1px 0 rgba(255,255,255,0.35);
    transition: transform .1s, box-shadow .15s, filter .15s;
  }
  .btn:hover { filter: brightness(1.07); box-shadow: 0 3px 16px rgba(227,177,63,0.4), inset 0 1px 0 rgba(255,255,255,0.35); }
  .btn:active { transform: translateY(1px) scale(0.99); box-shadow: 0 1px 4px rgba(227,177,63,0.2); }
  .btn.full { width: 100%; margin-top: 14px; }
  #refreshBtn {
    margin-left: auto; padding: 9px 16px;
    color: var(--gold); background: none;
    border: 1px solid rgba(227,177,63,0.45);
    box-shadow: none;
  }
  #refreshBtn:disabled { opacity: 0.55; cursor: default; }
  #refreshBtn .spin { display: inline-block; }
  #refreshBtn.busy .spin { animation: rot 1s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  #flexToggle, #roleToggle, #draftToggle { margin-left: 10px; }
  /* shared look for the header toggles and their board-head mirrors */
  .toggle {
    padding: 9px 16px;
    color: var(--ink-2); background: none;
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: none;
  }
  .toggle.active {
    color: var(--gold);
    border-color: rgba(227,177,63,0.6);
    background: rgba(227,177,63,0.12);
  }
  .lowdata { display: block; font-size: 11px; color: #d9a32f; opacity: 0.85; margin-top: 1px; }
  .mfloor { margin-top: 14px; }
  .mfloor label { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
  .mfloor label b { color: var(--gold); }
  .mfloor input[type="range"] { width: 100%; accent-color: var(--gold); cursor: pointer; }
  /* two-thumb range: min and max inputs stacked on one track, thumbs styled
     to match accent-color sliders; only the thumbs take pointer events */
  .dualrange { position: relative; height: 18px; }
  .dualrange input[type="range"] {
    -webkit-appearance: none; appearance: none;
    position: absolute; inset: 0; width: 100%; height: 100%; margin: 0;
    background: none; pointer-events: none;
  }
  .dualrange input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; pointer-events: auto;
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--gold); cursor: pointer; border: 2px solid var(--page);
  }
  .dualrange input[type="range"]::-moz-range-thumb {
    pointer-events: auto; width: 13px; height: 13px; border-radius: 50%;
    background: var(--gold); cursor: pointer; border: 2px solid var(--page);
  }
  .drtrack, .drfill {
    position: absolute; top: 50%; transform: translateY(-50%);
    height: 4px; border-radius: 2px; pointer-events: none;
  }
  .drtrack { left: 0; right: 0; background: var(--surface-2); border: 1px solid var(--line-soft); }
  .drfill { background: linear-gradient(90deg, #b98a25, var(--gold)); }

  /* ---- win-rate hero ---- */
  .hero-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .hero-num {
    font-size: 52px; font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
  }
  .verdict {
    font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    border-radius: 999px; padding: 5px 12px;
    background: var(--surface-2); color: var(--ink-muted); border: 1px solid var(--line);
  }
  .verdict.good { background: var(--good-dim); color: var(--good); border-color: rgba(74,222,128,0.3); }
  .verdict.bad  { background: var(--bad-dim);  color: var(--bad);  border-color: rgba(244,115,126,0.3); }
  .verdict.gold { background: var(--gold-dim); color: var(--gold-soft); border-color: rgba(227,177,63,0.35); }
  .meter {
    position: relative; height: 10px; margin-top: 14px;
    background: var(--surface-2); border-radius: 5px; overflow: hidden;
    border: 1px solid var(--line-soft);
  }
  .meter .fill {
    height: 100%; width: 0;
    background: linear-gradient(90deg, #b98a25, var(--gold), #f2d287);
    border-radius: 5px;
    box-shadow: 0 0 10px rgba(227,177,63,0.5);
    transition: width .5s cubic-bezier(.22,1,.36,1);
  }
  .meter .tick {
    position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px;
    background: var(--ink-muted); opacity: 0.55;
  }
  .breakdown { font-size: 13px; color: var(--ink-2); line-height: 1.9; margin-top: 12px; }
  .pos { color: var(--good); font-weight: 650; }
  .neg { color: var(--bad); font-weight: 650; }

  /* ---- draft board ---- */
  .board-head { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .mirror-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .mirror-bar .mfloor { margin-top: 0; flex: 1 1 130px; max-width: 220px; }
  .mirror-bar .toggle + .mfloor { margin-left: auto; }  /* first slider after the toggles pushes the group right */
  .roles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  @media (max-width: 1200px) { .roles { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); } }
  .slot {
    background: linear-gradient(180deg, var(--surface), #111823);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 12px; text-align: center;
    transition: border-color .2s, box-shadow .2s;
  }
  .slot.filled { border-color: rgba(227,177,63,0.35); box-shadow: 0 0 14px rgba(227,177,63,0.07); }
  .slot h3 {
    margin: 0 0 10px; font-family: var(--display);
    font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-2);
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .slot h3 svg { color: var(--gold); flex: none; }
  select {
    width: 100%; font: inherit; font-size: 13px;
    padding: 7px 8px; margin-bottom: 7px;
    background: var(--surface-2); color: var(--ink-1);
    border: 1px solid var(--line); border-radius: 8px;
    cursor: pointer; transition: border-color .15s;
  }
  select:hover:not(:disabled) { border-color: var(--gold); }
  select:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  select:disabled { opacity: 0.45; cursor: not-allowed; }
  .portrait-wrap { position: relative; width: 64px; margin: 10px auto 8px; }
  .portrait {
    width: 64px; height: 64px; border-radius: 12px; display: block;
    border: 2px solid var(--gold);
    box-shadow: 0 0 14px rgba(227,177,63,0.3);
  }
  .portrait-empty {
    width: 64px; height: 64px; border-radius: 12px; margin: 10px auto 8px;
    border: 2px dashed var(--line); display: grid; place-items: center;
    color: var(--line); font-size: 22px;
  }
  .cstat { font-size: 12px; color: var(--ink-2); line-height: 1.7; }
  .cstat .dim { color: var(--ink-muted); }
  .scorechip {
    display: inline-block; margin-top: 7px;
    font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--gold-soft); background: var(--gold-dim);
    border: 1px solid rgba(227,177,63,0.3); border-radius: 999px; padding: 3px 11px;
  }

  /* ---- top comps ---- */
  .tabs { display: inline-flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .tabs button {
    font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
    background: none; border: none; color: var(--ink-muted);
    border-radius: 999px; padding: 5px 14px; transition: color .15s, background .15s;
  }
  .tabs button:hover { color: var(--ink-1); }
  .tabs button.active { background: var(--gold); color: #171004; }
  table { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: 13px; }
  th {
    text-align: left; color: var(--ink-muted); font-weight: 500; font-size: 11.5px;
    letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 10px;
  }
  td { padding: 9px 10px; background: var(--surface-2); font-variant-numeric: tabular-nums; border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); }
  td:first-child { border-radius: 10px 0 0 10px; border-left: 1px solid var(--line-soft); }
  td:last-child { border-radius: 0 10px 10px 0; border-right: 1px solid var(--line-soft); }
  tr.comp-row { cursor: pointer; }
  tr.comp-row td { transition: background .15s, border-color .15s; }
  tr.comp-row:hover td { background: #202b3c; border-color: rgba(227,177,63,0.4); }
  tr.comp-row { animation: rise .35s cubic-bezier(.22,1,.36,1) both; animation-delay: calc(var(--i) * 45ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
  .rank {
    display: inline-grid; place-items: center;
    width: 26px; height: 26px; border-radius: 50%;
    font-size: 12px; font-weight: 800;
    background: var(--surface); color: var(--ink-muted); border: 1px solid var(--line);
  }
  .rank.r1 { background: linear-gradient(160deg, #f2d287, #d9a32f); color: #171004; border-color: #f0cd7e; box-shadow: 0 0 8px rgba(227,177,63,0.5); }
  .rank.r2 { background: linear-gradient(160deg, #dbe3ec, #9fadbf); color: #10141c; border-color: #dbe3ec; }
  .rank.r3 { background: linear-gradient(160deg, #d8a173, #a96b3c); color: #1c0f04; border-color: #d8a173; }
  .wr-cell { display: flex; align-items: center; gap: 10px; }
  .wr-cell b { font-size: 13.5px; }
  .wr-bar { flex: 1; max-width: 110px; height: 6px; background: var(--page); border-radius: 3px; overflow: hidden; }
  .wr-bar > div { height: 100%; background: linear-gradient(90deg, #b98a25, var(--gold)); border-radius: 3px; }
  .champ-icons { white-space: nowrap; }
  .ci { position: relative; display: inline-block; margin-right: 4px; vertical-align: middle; }
  .ci img {
    width: 32px; height: 32px; border-radius: 7px; display: block;
    border: 1px solid var(--line); transition: transform .12s, border-color .12s;
  }
  tr.comp-row:hover .ci img { border-color: rgba(227,177,63,0.5); }
  .ci:hover img { transform: scale(1.25); border-color: var(--gold); }
  .ci::after {
    content: attr(data-tip);
    position: absolute; left: 50%; bottom: calc(100% + 8px);
    transform: translateX(-50%) translateY(2px);
    background: var(--surface-2); color: var(--ink-1);
    border: 1px solid rgba(227,177,63,0.4); border-radius: 8px;
    padding: 5px 10px; font-size: 12px; font-weight: 650; white-space: nowrap;
    box-shadow: 0 6px 18px rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none; z-index: 6;
    transition: opacity .12s, transform .12s;
  }
  .ci:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); }
  .syn-chip {
    display: inline-block; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
    border-radius: 999px; padding: 3px 10px;
  }
  .syn-chip.pos { background: var(--good-dim); border: 1px solid rgba(74,222,128,0.3); }
  .syn-chip.neg { background: var(--bad-dim); border: 1px solid rgba(244,115,126,0.3); }

  /* ---- team profile ---- */
  .prow { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .prow .plabel { flex: none; width: 74px; font-size: 12px; color: var(--ink-2); font-weight: 600; }
  .prow .pmeter { flex: 1; position: relative; height: 8px; background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 4px; overflow: hidden; }
  .prow .pmeter > div { height: 100%; border-radius: 4px; background: var(--gold); transition: width .3s; }
  .pstatus {
    flex: none; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    border-radius: 999px; padding: 3px 10px; min-width: 58px; text-align: center;
    background: var(--surface-2); color: var(--ink-muted); border: 1px solid var(--line);
  }
  .pstatus.good { background: var(--good-dim); color: var(--good); border-color: rgba(74,222,128,0.3); }
  .pstatus.warn { background: var(--gold-dim); color: var(--gold-soft); border-color: rgba(227,177,63,0.35); }
  .pstatus.bad  { background: var(--bad-dim);  color: var(--bad);  border-color: rgba(244,115,126,0.3); }
  .stackbar { display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 6px; }
  .stackbar > div { height: 100%; }
  .stackbar .sPhys { background: #e08b3d; }
  .stackbar .sMagic { background: #6aa8e8; }
  .stackbar .sTrue { background: #cfd8e3; }
  .dmglegend { display: flex; gap: 14px; margin-top: 7px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
  .dmglegend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }

  /* ---- draft mode ---- */
  .draft-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .dlabel { flex: none; width: 52px; font-size: 12px; color: var(--ink-2); font-weight: 600; }
  .dchip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 6px 3px 10px;
  }
  .dchip img { width: 20px; height: 20px; border-radius: 5px; }
  .dchip.live { border-color: rgba(74,222,128,0.35); }
  .dchip button {
    font: inherit; background: none; border: none; cursor: pointer;
    color: var(--ink-muted); padding: 0 4px; border-radius: 50%;
  }
  .dchip button:hover { color: var(--bad); }
  .dchip select {
    width: auto; font-size: 11px; padding: 2px 4px; margin: 0;
    border-radius: 6px;
  }
  .dinput {
    font: inherit; font-size: 13px; width: 150px;
    padding: 6px 9px;
    background: var(--surface-2); color: var(--ink-1);
    border: 1px solid var(--line); border-radius: 8px;
  }
  .dinput:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .live-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--ink-muted); margin-right: 5px; vertical-align: 1px;
  }
  .live-dot.on { background: var(--good); box-shadow: 0 0 6px rgba(74,222,128,0.7); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.45; } }
  .draft-state { font-size: 11px; font-weight: 400; color: var(--ink-muted); text-transform: none; letter-spacing: 0; }
  .slot .banned-note { color: var(--bad); font-weight: 700; font-size: 12px; }
  /* Drafting declutters the page: roster and filters are pre-queue decisions,
     so hide them and leave draft card + win rate + slots + comps. */
  body.drafting #squadCard, body.drafting #profileCard, body.drafting .mirror-bar { display: none; }
  /* the full optimizer lives in the squad card — surface it on the board
     while drafting so hiding that card doesn't orphan the main action */
  body:not(.drafting) #optFull { display: none; }
  #draftClear {
    margin-left: 8px; padding: 3px 10px; font-size: 11px; font-weight: 600;
    letter-spacing: 0; text-transform: none; flex: none;
  }

  /* ---- misc ---- */
  .empty { padding: 44px 20px; text-align: center; color: var(--ink-muted); font-size: 13.5px; line-height: 1.7; }
  .empty svg { color: var(--line); margin-bottom: 10px; }
  .info {
    position: relative; display: inline-block; cursor: help; color: var(--ink-muted);
    border: 1px solid var(--line); border-radius: 50%; width: 15px; height: 15px;
    font-size: 10px; line-height: 14px; text-align: center; margin-left: 6px; vertical-align: 1px;
    font-style: normal; font-weight: 600; text-transform: none; letter-spacing: 0;
  }
  .info:hover, .info:focus { color: var(--gold-soft); border-color: var(--gold); }
  .info .tip {
    display: none; position: absolute; z-index: 10; left: 50%; transform: translateX(-50%);
    bottom: 24px; width: 270px; background: var(--surface-2); color: var(--ink-2);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px;
    font-size: 12px; line-height: 1.55; font-weight: 400; text-align: left;
    letter-spacing: 0; text-transform: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .info:hover .tip, .info:focus .tip { display: block; }
  code { background: var(--surface-2); border: 1px solid var(--line); padding: 2px 7px; border-radius: 6px; font-size: 12px; color: var(--gold-soft); }
  /* ---- mobile ---- */
  .h2tabs { margin-left: auto; }
  @media (max-width: 600px) {
    body { overflow-x: hidden; }
    .shell { padding: 14px 12px 44px; }
    header { gap: 10px; margin-bottom: 16px; }
    .sigil { width: 36px; height: 36px; border-radius: 10px; }
    h1 { font-size: 20px; }
    /* chips drop to their own row; the three buttons share the next one */
    .patchbar { order: 5; margin-left: 0; width: 100%; }
    #refreshBtn, #flexToggle, #roleToggle, #draftToggle {
      order: 6; flex: 1; margin-left: 0;
      padding: 9px 8px; font-size: 13px; white-space: nowrap;
    }
    .layout { gap: 14px; }
    .card { padding: 14px; margin-bottom: 14px; }
    .player { padding: 10px 8px; }
    .player input { width: 18px; height: 18px; }
    .hero-num { font-size: 42px; }
    #optChamps { width: 100%; }
    .mirror-bar .toggle { flex: 1; }
    .mirror-bar .mfloor { flex-basis: 100%; max-width: none; margin-left: 0; }
    /* slots become compact rows so the whole comp fits one screen */
    .roles { grid-template-columns: 1fr; gap: 8px; }
    .slot {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) minmax(0, 1fr);
      grid-template-areas: "img role role" "img psel csel" "img stat stat";
      gap: 4px 10px; align-items: center;
      padding: 10px 12px; text-align: left;
    }
    .slot h3 { grid-area: role; justify-content: flex-start; margin: 0; }
    .slot select { margin: 0; }
    .slot select[data-kind="player"] { grid-area: psel; }
    .slot select[data-kind="champ"] { grid-area: csel; }
    .slot .portrait-wrap, .slot .portrait-empty { grid-area: img; margin: 0; align-self: start; }
    .slot .portrait, .slot .portrait-empty { width: 52px; height: 52px; }
    .slot .portrait-wrap { width: 52px; }
    .slot > .cstat { grid-area: stat; }
    .slot > .cstat.dim { display: none; }  /* role-comfort hint — desktop only */
    .slot .cstat br { display: none; }
    .slot .cstat .dim, .slot .cstat .scorechip { margin-left: 8px; }
    .slot .scorechip { margin-top: 0; }
    /* 16px stops iOS Safari's zoom-on-focus */
    select { font-size: 16px; padding: 9px 8px; }
    h2 { flex-wrap: wrap; }
    .h2tabs { margin-left: 0; }
    /* comps table: compact enough to fit, scrollable if it still doesn't */
    #ranked { overflow-x: auto; }
    #ranked table { font-size: 12px; }
    td { padding: 7px 6px; }
    th { padding: 2px 6px; }
    .rank { width: 22px; height: 22px; font-size: 11px; }
    .wr-bar { display: none; }
    .ci { margin-right: 2px; }
    .ci img { width: 26px; height: 26px; }
    .syn-chip { font-size: 11px; padding: 3px 7px; }
    /* anchored tips get clipped by the table's scroll container and the
       viewport on a phone — show them as a fixed overlay instead */
    .info .tip {
      position: fixed; left: 16px; right: 16px; width: auto;
      top: 50%; bottom: auto; transform: translateY(-50%);
      z-index: 50; font-size: 13px;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    tr.comp-row { animation: none; }
    .meter .fill { transition: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="sigil">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
        <path d="M12 2l9.5 6.9-3.6 11.2h-11.8L2.5 8.9z"/>
        <circle cx="12" cy="12.4" r="3.2" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <div>
      <h1>Comp Builder</h1>
    </div>
    <div class="patchbar" id="sub"><span class="chip">Loading account data…</span></div>
    <button id="refreshBtn" class="btn" hidden title="Pull the group's newest games"><span class="spin">⟳</span> Refresh</button>
    <button id="flexToggle" class="btn toggle" hidden title="Score and display using flex-queue games only">Flex only</button>
    <button id="roleToggle" class="btn toggle" title="Champion win rates count only games played in the assigned role">Role WR</button>
  <button id="draftToggle" class="btn toggle" title="Draft assist: bans and enemy picks filter the board (auto-synced when lcu_bridge.py runs)">Draft</button>
  </header>
  <div id="app"></div>
</div>

<script>
"use strict";
const ROLES = ["TOP", "JUNGLE", "MIDDLE", "BOTTOM", "UTILITY"];
const ROLE_LABEL = { TOP: "Top", JUNGLE: "Jungle", MIDDLE: "Mid", BOTTOM: "Bot", UTILITY: "Support" };

// --- scoring model -------------------------------------------------------
// Individual: champion win rate (in-role games full weight, other-role games
// discounted) shrunk toward the champion's CURRENT-PATCH meta win rate for
// that role (falls back to 50% if meta.json is absent),
// + mastery familiarity bonus, − off-role penalty.
// Synergy: pilot-attributed champ-pair WR deviation vs the pair's expected
// meta WR (only games where these two PLAYERS piloted these two champs on the
// same team), plus player-pair (duo) WR deviation vs 50%.
const K_IND = 8;        // shrinkage prior weight for individual champ WR
const K_PAIR = 20;      // shrinkage for pair stats (small samples)
const MASTERY_MAX_BONUS = 0.03;  // up to +3% for very high mastery
const SYNERGY_WEIGHT = 0.5;      // how much a pair's WR deviation counts
// The ten duo records in a 5-stack largely re-count the SAME games, so summing
// them multiplies one shared win streak ~10x. This scales the sum back so ten
// fully-overlapping pairs count the group's record roughly once.
const PAIR_OVERLAP_DISCOUNT = 0.25;
const OFF_ROLE_PENALTY = 0.04;       // player rarely plays this champ in this role
const OFF_META_PRIOR_PENALTY = 0.04; // champ has no meta presence in this role (e.g. Annie bot)
const OFF_ROLE_GAME_WEIGHT = 0.3;    // off-role games count this much toward a role's record
const ROLE_COMFORT_WEIGHT = 0.12;    // bonus/penalty for how much of the player's games are in this role
const MIN_CHAMP_GAMES = 5;           // preferred: champs the player has actually logged games on
const OWN_ROLE_VIABLE_GAMES = 10;    // personal games in a role needed to trust a pick the meta doesn't play there

let D = null;           // loaded dataset
let CHAMP_BY_NAME = {}; // lowercased name -> base championId (dupes resolved)
let META = null;        // current-patch meta stats (optional)
let PROFILES = null;    // per-champion combat profiles (optional)
let masteryIdx = {};    // riotId -> championId -> points
let champPairIdx = {};  // "rid|cid:rid|cid" -> {games, wins} (pilot-attributed)
let playerPairIdx = {}; // "a|b" -> {games, wins, roles: {"roleA|roleB": {games, wins}}}
let slots = ROLES.map(() => ({ player: null, champ: null }));
let included = {};      // riotId -> bool
let squadApplied = false;  // ?squad= URL param consumed (applies once)
let indCache = {};      // memoized indScore — larger rosters make the search combinatorial
let candCache = {};     // memoized candidates
const CS_MIN_PLAYER = "BigBellyBobby#NA1"; // show cs/min in this player's slot cards
// Mastery range: champs outside [masteryMin, masteryMax] mastery points are
// filtered from a player's candidate list (with the usual graceful fallback).
// Default 30k minimum; a max slider at MASTERY_OFF means no upper cap.
const MASTERY_OFF = 200000;
let masteryMin = +(localStorage.getItem("masteryFloor") ?? 30000);
let masteryMax = +(localStorage.getItem("masteryMax") ?? MASTERY_OFF);
const inMasteryRange = pts => pts >= masteryMin && (masteryMax >= MASTERY_OFF || pts <= masteryMax);
// Games-played range: champs outside [minGames, maxGames] total ranked games
// are filtered from candidate lists — too few games means the record is
// noise, too many means the pick is predictable/bannable. A max slider at
// MAX_GAMES_OFF means no upper cap.
const MAX_GAMES_OFF = 120;
let minGames = +(localStorage.getItem("minGames") ?? 0);
let maxGames = +(localStorage.getItem("maxGames") ?? MAX_GAMES_OFF);
const inGamesRange = g => g >= minGames && (maxGames >= MAX_GAMES_OFF || g <= maxGames);
// Strict role WRs: champion win rates count only games in the assigned role
// (off-role games contribute nothing instead of OFF_ROLE_GAME_WEIGHT).
let strictRole = localStorage.getItem("strictRole") === "1";

// --- draft mode ------------------------------------------------------------
// Bans and enemy picks (entered manually or streamed from lcu_bridge.py via
// the worker) become unavailable, and known lane opponents nudge pick scores
// with OP.GG matchup records.
let draftMode = localStorage.getItem("draftMode") === "1";
let manualBans = new Set(), manualEnemy = new Set();  // championIds
let liveBans = new Set(), liveEnemy = new Set();      // from the LCU bridge
let enemyRole = new Map();   // enemy cid -> our ROLES key (inferred, editable)
let liveDraft = { ts: 0, active: false };
let liveOurs = [];           // our team's live picks [{championId, position}]
let liveOursByRole = {};     // role -> cid the live sync last wrote into a slot
let autoSwapNote = null;     // "Tristana → Kai'Sa" — last automatic dead-pick swap
let counterIdx = {};         // "enemyCid|OPGGPOS" -> {ourCid: {play, win}}
let dAdjCache = {};
const MATCHUP_WEIGHT = 1;      // matchup deltas are already small; cap below
const MATCHUP_CAP = 0.03;      // per-lane-opponent cap (±3pp)

const effBans = () => draftMode ? new Set([...manualBans, ...liveBans]) : new Set();
const effEnemy = () => draftMode ? new Set([...manualEnemy, ...liveEnemy]) : new Set();
const draftUnavailable = cid => draftMode && (effBans().has(cid) || effEnemy().has(cid));

const shrunk = (wins, games, k, prior = 0.5) => (wins + prior * k) / (games + k);

// Share of ALL the player's games played in this role — their role comfort.
// 0.2 (= 1/5 roles) is neutral; above is home turf, below is off-role.
const roleShareCache = {};
function playerRoleShare(riotId, role) {
  let shares = roleShareCache[riotId];
  if (!shares) {
    const p = D.players.find(p => p.riotId === riotId);
    shares = roleShareCache[riotId] = { total: 0 };
    for (const c of p.champions)
      for (const [r, rec] of Object.entries(c.roles)) {
        shares[r] = (shares[r] || 0) + rec.games;
        shares.total += rec.games;
      }
  }
  return shares.total ? (shares[role] || 0) / shares.total : 0.2;
}

// Current-patch meta win rate for a champion in a role. If the champ simply
// isn't played in that role on this patch, its overall WR is a bad prior —
// apply the off-meta penalty instead of pretending role doesn't matter.
const OPGG_POS = { TOP: "TOP", JUNGLE: "JUNGLE", MIDDLE: "MID", BOTTOM: "ADC", UTILITY: "SUPPORT" };
function metaWR(champId, role) {
  const m = META && META.champions[champId];
  if (!m) return 0.5;
  const pos = role && m.positions[OPGG_POS[role]];
  if (pos && pos.games >= 100) return pos.winRate;
  const base = m.winRate ?? 0.5;
  if (role && Object.keys(m.positions).length) return base - OFF_META_PRIOR_PENALTY;
  return base;
}

// Where an enemy pick is likely headed: its meta-viable lanes (≥10% role
// rate) weighted by how often it actually goes there. A flex pick like Yasuo
// splits its matchup weight across mid/top/bot instead of betting on one
// guess. A manual lane on the chip collapses this to certainty, and lanes
// manually claimed by other enemy picks are eliminated before normalizing.
// raw=true ignores both — the full meta distribution.
function laneDist(cid, raw = false) {
  const manual = enemyRole.get(cid);
  if (manual && !raw) return { [manual]: 1 };
  const m = META && META.champions[cid];
  const back = { TOP: "TOP", JUNGLE: "JUNGLE", MID: "MIDDLE", ADC: "BOTTOM", SUPPORT: "UTILITY" };
  const dist = {};
  let listed = 0;
  if (m) for (const [pos, s] of Object.entries(m.positions)) {
    const role = back[pos];
    if (!role || (s.roleRate || 0) < 0.10) continue;
    dist[role] = s.roleRate;
    listed += s.roleRate;
  }
  // OP.GG only ships a champ's headline lanes — Heimerdinger arrives as
  // "top, 59% role rate" with the mid/support games missing entirely, and
  // normalizing that would claim he's a 100% top-laner. Weights are kept as
  // true probabilities (sum ≤ 1), and any large unexplained share goes to
  // lanes the roster itself has a real sample playing the champ in.
  const missing = Math.max(0, 1 - listed);
  if (missing >= 0.15) {
    const own = {};
    let ownTotal = 0;
    for (const p of D.players) {
      const e = p.champions.find(c => c.championId === cid);
      if (!e) continue;
      for (const [r, rec] of Object.entries(e.roles)) {
        if (rec.games < OWN_ROLE_VIABLE_GAMES || dist[r]) continue;
        own[r] = (own[r] || 0) + rec.games;
        ownTotal += rec.games;
      }
    }
    for (const r in own) dist[r] = missing * own[r] / ownTotal;
  }
  if (!raw) {
    const claimed = new Set([...effEnemy()].filter(c => c !== cid).map(c => enemyRole.get(c)).filter(Boolean));
    for (const r of claimed) delete dist[r];
  }
  return dist;
}

// Prefetch matchup tables for every lane the pick might go to.
function ensureEnemyCounters(cid) {
  for (const r of Object.keys(laneDist(cid, true))) ensureCounters(cid, r);
  if (enemyRole.get(cid)) ensureCounters(cid, enemyRole.get(cid));
}

// Lane-matchup records for an enemy pick, fetched once per (champ, lane) and
// KV-cached worker-side. Arrives async — scores re-render when it lands.
function ensureCounters(cid, role) {
  if (!role || !WORKER_URL) return;
  const key = cid + "|" + OPGG_POS[role];
  if (counterIdx[key]) return;
  counterIdx[key] = {};  // placeholder so a slow response isn't refetched
  fetch(`${WORKER_URL}/counters?champ=${cid}&pos=${OPGG_POS[role]}`)
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      if (!j || !j.counters) return;
      const map = {};
      for (const c of j.counters) map[c.champion_id] = c;
      counterIdx[key] = map;
      draftChanged(false);
    })
    .catch(() => {});
}

// Matchup record for our champ vs an enemy in a lane. OP.GG's counter table
// on the enemy's page omits rare opponents (an off-meta Heimerdinger mid
// rarely makes anyone's list) — but the same matchup often still lives on OUR
// champ's page for that lane, with the win count from the other side.
function matchupRec(ecid, cid, role) {
  const direct = (counterIdx[ecid + "|" + OPGG_POS[role]] || {})[cid];
  if (direct) return direct;
  const rev = (counterIdx[cid + "|" + OPGG_POS[role]] || {})[ecid];
  return rev ? { play: rev.play, win: rev.play - rev.win } : null;
}

// Matchup nudge for playing champ `cid` in `role` into the enemy picks that
// might lane there: the complement of the enemy's WR vs us, shrunk by sample
// size, capped, and weighted by how likely that enemy is to be in this lane.
// counters[x].win is the ENEMY champ's wins against x.
function dAdj(cid, role) {
  if (!draftMode) return 0;
  const k = cid + "|" + role;
  if (k in dAdjCache) return dAdjCache[k];
  let adj = 0;
  for (const ecid of effEnemy()) {
    const w = laneDist(ecid)[role] || 0;
    if (!w) continue;
    const rec = matchupRec(ecid, cid, role);
    if (!rec || rec.play < 20) continue;
    const edge = (0.5 - rec.win / rec.play) * (rec.play / (rec.play + 50)) * MATCHUP_WEIGHT;
    adj += w * Math.max(-MATCHUP_CAP, Math.min(MATCHUP_CAP, edge));
  }
  return dAdjCache[k] = adj;
}

// indScore is draft-independent (and cached as such); slotScore adds the
// draft-dependent matchup nudge on top. Use this everywhere a pick is scored.
const slotScore = (riotId, champId, role) => indScore(riotId, champId, role) + dAdj(champId, role);

function masteryBonus(riotId, champId) {
  const pts = (masteryIdx[riotId] || {})[champId] || 0;
  return Math.min(pts, 200000) / 200000 * MASTERY_MAX_BONUS;
}

function roleShare(champEntry, role) {
  if (!champEntry) return 0;
  const total = Object.values(champEntry.roles).reduce((a, r) => a + r.games, 0) || 1;
  return (champEntry.roles[role] || { games: 0 }).games / total;
}

// Score of one player playing one champion in one role. The record is the
// champ-IN-ROLE games at full weight plus the champ's other-role games
// discounted to OFF_ROLE_GAME_WEIGHT (mechanics transfer between roles, but
// a jungle record shouldn't fully back a top-lane pick), shrunk toward the
// role-specific meta prior.
function indScore(riotId, champId, role) {
  const ck = riotId + "|" + champId + "|" + role;
  if (ck in indCache) return indCache[ck];
  const p = D.players.find(p => p.riotId === riotId);
  const entry = p.champions.find(c => c.championId === champId);
  const prior = metaWR(champId, role);
  let wr;
  if (entry) {
    const offW = strictRole ? 0 : OFF_ROLE_GAME_WEIGHT;
    const roleRec = entry.roles[role] || { games: 0, wins: 0 };
    const g = roleRec.games + (entry.games - roleRec.games) * offW;
    const w = roleRec.wins + (entry.wins - roleRec.wins) * offW;
    wr = shrunk(w, g, K_IND, prior);
  } else {
    wr = prior;
  }
  const rolePen = entry && roleShare(entry, role) < 0.25 ? OFF_ROLE_PENALTY : 0;
  const comfort = ROLE_COMFORT_WEIGHT * (playerRoleShare(riotId, role) - 0.2);
  return indCache[ck] = wr + masteryBonus(riotId, champId) - rolePen + comfort;
}

// A and B are assign entries ({player, champ}): the pair record only counts
// games where these two players piloted these two champions themselves —
// someone else's games on the same champion are not this player's synergy.
function champPairAdjRaw(pa, ca, pb, cb) {
  const key = (pa < pb || (pa === pb && ca <= cb))
    ? pa + "|" + ca + ":" + pb + "|" + cb
    : pb + "|" + cb + ":" + pa + "|" + ca;
  const s = champPairIdx[key];
  if (!s) return 0;
  // Expected pair WR is the mean of the two champs' meta WRs, so champion
  // strength isn't double-counted as "synergy".
  const expected = (metaWR(ca, null) + metaWR(cb, null)) / 2;
  return (shrunk(s.wins, s.games, K_PAIR, expected) - expected) * SYNERGY_WEIGHT * (s.games / (s.games + 10));
}
const champPairAdj = (A, B) => champPairAdjRaw(A.player, A.champ, B.player, B.champ);

// Best positive champ-pair adjustment per player pair — an upper bound used
// to prune whole role-permutations in optimize() before scoring 3^5 combos.
let pairBoostIdx = null;
function buildPairBoost() {
  pairBoostIdx = {};
  for (const key in champPairIdx) {
    const [x, y] = key.split(":");
    const [pa, ca] = x.split("|"), [pb, cb] = y.split("|");
    const adj = champPairAdjRaw(pa, +ca, pb, +cb);
    const pk = pa < pb ? pa + "|" + pb : pb + "|" + pa;
    if (adj > (pairBoostIdx[pk] || 0)) pairBoostIdx[pk] = adj;
  }
}

// Duo record, role-weighted: shared games where the duo played the roles
// they're assigned here count fully; games in other role combos are
// discounted like indScore's off-role games (chemistry partly transfers,
// but a bot-lane duo's record shouldn't fully back a top+jungle pairing).
// Older pair records without a role split fall back to full weight.
function playerPairAdj(a, ra, b, rb) {
  const s = playerPairIdx[[a, b].sort().join("|")];
  if (!s) return 0;
  let g = s.games, w = s.wins;
  if (s.roles && Object.keys(s.roles).length) {
    const rec = s.roles[s.a === a ? ra + "|" + rb : rb + "|" + ra] || { games: 0, wins: 0 };
    const offW = strictRole ? 0 : OFF_ROLE_GAME_WEIGHT;
    g = rec.games + (s.games - rec.games) * offW;
    w = rec.wins + (s.wins - rec.wins) * offW;
  }
  return (shrunk(w, g, K_PAIR) - 0.5) * SYNERGY_WEIGHT * PAIR_OVERLAP_DISCOUNT * (g / (g + 10));
}

// Full comp score: mean individual + all pairwise synergy adjustments.
function compScore(assign) {  // assign: [{player, champ, role}]
  let ind = 0, syn = 0;
  for (const a of assign) ind += slotScore(a.player, a.champ, a.role);
  ind /= assign.length;
  for (let i = 0; i < assign.length; i++)
    for (let j = i + 1; j < assign.length; j++) {
      syn += champPairAdj(assign[i], assign[j]);
      syn += playerPairAdj(assign[i].player, assign[i].role, assign[j].player, assign[j].role);
    }
  return { total: Math.max(0.05, Math.min(0.95, ind + syn)), ind, syn };
}

// A champion is pickable for (player, role) only if the current meta plays it
// there, or the player has a REAL personal sample there (a handful of off-meta
// experiments — e.g. 9 games of Ezreal jungle — doesn't make it a draft pick).
function roleViable(champEntry, champId, role) {
  if (champEntry && (champEntry.roles[role] || { games: 0 }).games >= OWN_ROLE_VIABLE_GAMES) return true;
  const m = META && META.champions[champId];
  const pos = m && m.positions[OPGG_POS[role]];
  // 10%: flex picks (Yasuo bot, mage supports) hover in the 10-15% band and
  // are real drafts; below that a lane assignment is usually a fill/troll tag.
  return !!(pos && pos.games >= 100 && pos.roleRate >= 0.10);
}

// Top champion candidates for a player in a role.
function candidates(riotId, role, n = 3) {
  const ck = riotId + "|" + role + "|" + n;
  if (ck in candCache) return candCache[ck];
  const p = D.players.find(p => p.riotId === riotId);
  const pool = new Map();
  for (const c of p.champions) pool.set(c.championId, c);
  for (const m of p.mastery.slice(0, 12)) if (!pool.has(m.championId)) pool.set(m.championId, null);
  const scored = [...pool.keys()].map(cid => ({
    cid,
    s: slotScore(riotId, cid, role) + roleShare(pool.get(cid), role) * 0.02,
    viable: roleViable(pool.get(cid), cid, role),
    mastered: inMasteryRange((masteryIdx[riotId] || {})[cid] || 0),
    inRange: inGamesRange((pool.get(cid) || {}).games || 0),
    avail: !draftUnavailable(cid),
    played: ((pool.get(cid) || {}).games || 0) >= MIN_CHAMP_GAMES,
  }));
  // The mastery floor, games range, and draft availability are hard filters —
  // outside them a champ is simply not a pick for this player. Within them,
  // prefer role-viable champs with a real game sample, degrading so the list
  // stays useful.
  const eligible = scored.filter(c => c.mastered && c.inRange && c.avail);
  const tiers = [
    eligible.filter(c => c.viable && c.played),
    eligible.filter(c => c.viable),
    eligible,
  ];
  const list = (tiers.find(t => t.length) || []).sort((a, b) => b.s - a.s);
  return candCache[ck] = list.slice(0, n).map(c => c.cid);
}

// --- optimizer -----------------------------------------------------------
function* combosOf(arr, k) {
  if (k === 0) { yield []; return; }
  for (let i = 0; i <= arr.length - k; i++)
    for (const rest of combosOf(arr.slice(i + 1), k - 1))
      yield [arr[i], ...rest];
}
function* permutations(arr) {
  if (arr.length <= 1) { yield arr; return; }
  for (let i = 0; i < arr.length; i++)
    for (const rest of permutations([...arr.slice(0, i), ...arr.slice(i + 1)]))
      yield [arr[i], ...rest];
}

// Champion-only optimization: keep the player→role assignment currently in
// the slots (e.g. what you got from fill) and search champions only.
function optimizeChamps(topN = 10) {
  const players = slots.map(s => s.player);
  if (players.some(p => !p) || new Set(players).size !== 5) return null;
  const cands = players.map((rid, i) => candidates(rid, ROLES[i], 8));
  const results = [];
  const idx = [0, 0, 0, 0, 0];
  while (true) {
    const champs = idx.map((ci, i) => cands[i][ci]).filter(c => c !== undefined);
    if (champs.length === 5 && new Set(champs).size === 5) {
      const assign = players.map((rid, i) => ({ player: rid, champ: cands[i][idx[i]], role: ROLES[i] }));
      results.push({ assign, ...compScore(assign) });
    }
    let d = 4;
    while (d >= 0 && ++idx[d] >= cands[d].length) { idx[d] = 0; d--; }
    if (d < 0) break;
  }
  results.sort((a, b) => b.total - a.total);
  return results.slice(0, topN);
}

// Full search over every 5-player subset × role permutation × candidate
// champions. With 9+ players this is millions of combinations, so the inner
// loop is allocation-free: scores are computed from cached numbers and a comp
// object is only built when it beats the current top-N floor.
// fixed: {ROLE: championId} — champs our team already locked in the client;
// the role is pinned to that champ while players and other roles stay fluid.
function optimize(topN = 10, fixed = {}) {
  const pool = D.players.map(p => p.riotId).filter(r => included[r]);
  if (pool.length < 5) return [];
  const playerSets = pool.length === 5 ? [pool] : [...combosOf(pool, 5)];
  const keep = topN * 6;  // headroom for the dedup pass below
  let results = [], floor = -Infinity;
  if (!pairBoostIdx) buildPairBoost();
  for (const five of playerSets) {
    for (const perm of permutations(five)) {
      const cands = perm.map((rid, i) =>
        fixed[ROLES[i]] != null ? [fixed[ROLES[i]]] : candidates(rid, ROLES[i]));
      if (cands.some(c => !c.length)) continue;
      // player-pair synergy is constant for this role assignment
      let permPairs = 0, champSynBound = 0;
      for (let i = 0; i < 5; i++)
        for (let j = i + 1; j < 5; j++) {
          permPairs += playerPairAdj(perm[i], ROLES[i], perm[j], ROLES[j]);
          const pk = perm[i] < perm[j] ? perm[i] + "|" + perm[j] : perm[j] + "|" + perm[i];
          champSynBound += pairBoostIdx[pk] || 0;
        }
      const ind = cands.map((cs, i) => cs.map(cid => slotScore(perm[i], cid, ROLES[i])));
      // upper bound for this whole role assignment — skip it if it can't place
      let maxIndSum = 0;
      for (const arr of ind) maxIndSum += Math.max(...arr);
      if (maxIndSum / 5 + permPairs + champSynBound <= floor) continue;
      const idx = [0, 0, 0, 0, 0];
      while (true) {
        const c0 = cands[0][idx[0]], c1 = cands[1][idx[1]], c2 = cands[2][idx[2]],
              c3 = cands[3][idx[3]], c4 = cands[4][idx[4]];
        if (c0 !== c1 && c0 !== c2 && c0 !== c3 && c0 !== c4 && c1 !== c2 &&
            c1 !== c3 && c1 !== c4 && c2 !== c3 && c2 !== c4 && c3 !== c4) {
          const indMean = (ind[0][idx[0]] + ind[1][idx[1]] + ind[2][idx[2]]
            + ind[3][idx[3]] + ind[4][idx[4]]) / 5;
          let syn = permPairs;
          for (let i = 0; i < 5; i++)
            for (let j = i + 1; j < 5; j++)
              syn += champPairAdjRaw(perm[i], cands[i][idx[i]], perm[j], cands[j][idx[j]]);
          const total = Math.max(0.05, Math.min(0.95, indMean + syn));
          if (total > floor) {
            const assign = perm.map((rid, i) => ({ player: rid, champ: cands[i][idx[i]], role: ROLES[i] }));
            results.push({ assign, total, ind: indMean, syn });
            if (results.length > keep * 4) {
              results.sort((a, b) => b.total - a.total);
              results.length = keep;
              floor = results[keep - 1].total;
            }
          }
        }
        let d = 4;
        while (d >= 0 && ++idx[d] >= cands[d].length) { idx[d] = 0; d--; }
        if (d < 0) break;
      }
    }
  }
  results.sort((a, b) => b.total - a.total);
  const seen = new Set(), out = [];
  for (const r of results) {
    const key = r.assign.map(a => a.player + a.champ).join(",");
    if (!seen.has(key)) { seen.add(key); out.push(r); }
    if (out.length >= topN) break;
  }
  return out;
}

// Verdict thresholds are pure presentation — the score itself is untouched.
function verdict(total) {
  if (total >= 0.66) return { label: "Lock it in", cls: "gold" };
  if (total >= 0.58) return { label: "Favored", cls: "good" };
  if (total >= 0.52) return { label: "Slight edge", cls: "good" };
  if (total >= 0.45) return { label: "Coin flip", cls: "" };
  return { label: "Uphill battle", cls: "bad" };
}
