  <ellipse cx="88" cy="348" rx="42" ry="52" fill="url(#tone)" stroke="#111111" stroke-width="7"/>
  <ellipse cx="396" cy="348" rx="42" ry="52" fill="url(#tone)" stroke="#111111" stroke-width="7"/>

  <!-- bottom spikes -->
  <polygon points="118,428 162,428 140,482" fill="#111111"/>
  <polygon points="178,440 222,440 200,494" fill="#111111"/>
  <polygon points="262,440 306,440 284,494" fill="#111111"/>
  <polygon points="322,428 366,428 344,482" fill="#111111"/>

