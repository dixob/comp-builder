<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 485 503">
  <defs>
    <pattern id="tone" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.7" fill="#5a5a5a"/>
      <circle cx="7" cy="7" r="1.7" fill="#5a5a5a"/>
    </pattern>
    <clipPath id="mbody">
      <path d="M 80 310 C 80 212 152 162 242 162 C 332 162 404 212 404 310 C 404 392 338 452 242 452 C 146 452 80 392 80 310 Z"/>
    </clipPath>
  </defs>

  <!-- angular side limbs -->
  <path d="M 62 372 L 22 402 L 56 416 L 26 456 L 92 446 L 70 406 L 96 386 Z" fill="#111111"/>
  <path d="M 423 372 L 463 402 L 429 416 L 459 456 L 393 446 L 415 406 L 389 386 Z" fill="#111111"/>

