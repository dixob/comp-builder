  <path d="M 158 96 L 180 82 M 154 76 L 176 62 M 158 56 L 176 46" stroke="#111111" stroke-width="3"/>
  <path d="M 316 116 Q 346 82 316 38 Q 288 68 298 116 Z" fill="#ffffff" stroke="#111111" stroke-width="6"/>
  <path d="M 326 96 L 304 82 M 330 76 L 308 62 M 326 56 L 308 46" stroke="#111111" stroke-width="3"/>
  <path d="M 190 118 L 294 118 L 284 150 L 200 150 Z" fill="#111111"/>
  <polygon points="242,30 358,86 242,142 126,86" fill="#111111"/>
  <line x1="242" y1="44" x2="242" y2="114" stroke="#ffffff" stroke-width="4"/>
  <circle cx="242" cy="44" r="6" fill="#ffffff"/>
  <circle cx="242" cy="122" r="9" fill="#ffffff" stroke="#111111" stroke-width="4"/>

  <!-- manga emphasis strokes -->
  <path d="M 66 150 L 96 170 M 52 190 L 84 202" stroke="#111111" stroke-width="5" stroke-linecap="round"/>
  <path d="M 419 150 L 389 170 M 433 190 L 401 202" stroke="#111111" stroke-width="5" stroke-linecap="round"/>
