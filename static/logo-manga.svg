    <path d="M 326 178 Q 344 300 316 440" stroke="#111111" stroke-width="3" fill="none"/>
  </g>

  <!-- glasses + eyes: purple is the only color -->
  <path d="M 226 262 L 258 262" stroke="#111111" stroke-width="9"/>
  <circle cx="178" cy="272" r="50" fill="#ffffff" stroke="#111111" stroke-width="9"/>
  <circle cx="306" cy="272" r="50" fill="#ffffff" stroke="#111111" stroke-width="9"/>

  <circle cx="178" cy="274" r="27" fill="#c026d3"/>
  <circle cx="178" cy="276" r="12" fill="#111111"/>
  <circle cx="167" cy="262" r="8" fill="#ffffff"/>
  <path d="M 138 240 Q 178 218 218 240" stroke="#111111" stroke-width="7" fill="none" stroke-linecap="round"/>

  <circle cx="306" cy="274" r="27" fill="#c026d3"/>
  <circle cx="306" cy="276" r="12" fill="#111111"/>
  <circle cx="295" cy="262" r="8" fill="#ffffff"/>
  <path d="M 266 240 Q 306 218 346 240" stroke="#111111" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- smile -->
  <path d="M 214 336 Q 242 362 270 336" stroke="#111111" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- laurel (hatched) + cap -->
